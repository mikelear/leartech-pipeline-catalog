source_project: product-first
keys:
- key: alertmanager-slack-bot-token
  mode: copy
  why: 'shared: our Slack workspace'
- key: auth-postgresql-password-sp-infra
  mode: generate
  why: 'per-cluster value: must be unique to this cluster'
- key: auth-hydra-dsn-sp-infra
  mode: derived
  shape: dsn
  why: 'composed from the password and the service name; random bytes break it'
- key: openai-api-key
  mode: manual
  why: 'provider credential a human supplies'
