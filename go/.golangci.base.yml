# Canonical golangci-lint v2 config for leartech Go services.
#
# Consumers don't edit this file directly. The go-lint pipeline task
# (tasks/go-lint/pullrequest.yaml) curls it at CI time and yq-merges it
# with each repo's own .golangci.yml, which carries only the per-repo
# override (formatters.settings.goimports.local-prefixes).
#
# Local dev mirrors the same merge via `make lint-config` + `make lint`.
#
# Linter additions / rule tweaks land HERE first, then propagate to every
# Go consumer with zero per-repo churn.
#
# version is declared HERE. It used to say "do NOT put version: \"2\" here —
# yq merge + viper unmarshal can choke". That was tested on 2026-09-14 with
# yq v4 and golangci-lint v2.13.2 and does not reproduce; meanwhile its
# absence broke the mk's own documented path.
#
#   base                merged with a local file   base used AS-IS
#   -----------------   ------------------------   ---------------
#   without version     loads fine                 FAILS TO LOAD
#   with version        loads fine                 loads fine
#
# `make lint-config` prints "no local .golangci.yml; using base as-is" and
# copies this file straight to .golangci.merged.yml. golangci-lint v2 then
# refuses it:
#
#   Error: can't load config: unsupported version of the configuration: ""
#
# Every current consumer happens to declare version in its own .golangci.yml,
# so the merge supplied it by accident and the gap stayed invisible. A NEW
# repo following the documented path silently cannot lint -- and the mk
# prints its success line either way. Found by the ba-tool session hitting
# exactly that on a new repo.
#
# Safe for existing repos: yq's ireduce takes the last document, so a local
# version: "2" overwrites this with the identical value. Both merge outputs
# were byte-identical at 185 lines.
version: "2"

run:
  timeout: 5m
  tests: true

output:
  formats:
    text:
      path: stdout

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - prealloc
    - gocritic
    - gosec
    - revive
    - nolintlint

  settings:
    gosec:
      # G104: unhandled errors — errcheck covers this better
      config:
        G104:
          - ".*"
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow

  exclusions:
    warn-unused: true
    # 'lax' detects generated files via permissive markers (covers swag's
    # "GENERATED BY SWAG; DO NOT EDIT" which doesn't match the strict
    # "Code generated ... DO NOT EDIT." regex gocritic enforces by default).
    generated: lax
    rules:
      - path: '_test\.go'
        linters:
          - gosec
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
