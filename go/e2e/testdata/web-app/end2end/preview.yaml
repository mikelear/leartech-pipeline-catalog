# A static site behind leartech-nginx: /health is served by nginx, not the SPA.
#
# The point of declaring it here: the bash lane used to default to /health/live
# and the UI lane to /health, so one PR could be told the preview was up by one
# check and down by the other.
preview:
  healthPath: /health
  service: leartech-sp-web
  port: 80
  gate: absent
  # The route behind authentication. Any authenticated GET will do; the point is
  # that it is DECLARED, so a service that does not expose /api/v1/example is not
  # reported as having broken audience binding.
  authProbe: /api/v1/site
