# A web app with both lanes. The UI lane navigates the ingress, so it says so.
preview:
  healthPath: /health
  service: leartech-auth-ui
  port: 80
  gate: auto
  setup:
    - verb: hydra-client
      name: auth-ui-e2e
      scopes: [openid, profile, offline]
      audiences: [leartech-auth-ui]
      redirectURIs: ["${PREVIEW_URL}/oauth2/callback"]
  # The one procedure the menu does not cover: the spec's login needs a browser
  # cookie bound to the ingress host, so the client above is copied into the UI's
  # own session store. Declared, preview-only, and with a reason — a reviewer can
  # weigh it, and it does not grow into three.
  bespoke:
    - script: end2end/00-seed-session-store.sh
      reason: the Playwright login reads a cookie bound to the ingress hostname,
        which no menu verb can mint without a browser; replaced by a verb once
        one exists.
