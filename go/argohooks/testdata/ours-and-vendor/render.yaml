# One of each: the vendor hook is reported and does not fail; OURS does. This is the shape the
# estate is in TODAY, and the shape that keeps the check switched on.
---
# Source: kyverno/templates/hooks/kyverno-migrate-resources-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: kyverno-migrate-resources
  namespace: kyverno
  annotations:
    "helm.sh/hook": post-upgrade
spec: {}
---
# Source: leartech-console-api/templates/migrations-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: console-migrate
  namespace: ship-proven
  annotations:
    "helm.sh/hook": post-install,post-upgrade
spec: {}
---
# Source: leartech-console-api/templates/migrations-cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-migrations
  namespace: ship-proven
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/sync-wave": "-10"
data:
  001.sql: select 1;
