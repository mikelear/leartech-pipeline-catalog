# Present but not EQUIVALENT. A pair that reads as done and behaves differently.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrate
  namespace: app
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": "-5"
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: app:1.0.0
