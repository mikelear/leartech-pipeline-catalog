# Publish the catalog's gates as a pinned image.
#
# The catalog had NO postsubmit before this: it published nothing, because
# everything it provided was curled from raw.githubusercontent at run time.
# That delivery path costs five minutes of CDN staleness on every change, a
# Go toolchain in every consuming container, and a recompile per run.
#
# The tag is the semver from jx's version stream, so consumers pin a version
# and Renovate proposes the bump -- rather than tracking a moving `main` no
# reviewer ever sees change.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: release-checkers
spec:
  pipelineSpec:
    tasks:
    - name: release-checkers
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: ghcr.io/jenkins-x/jx-boot:3.16.59
          name: next-version
          resources: {}
          script: |
            #!/usr/bin/env sh
            set -e
            jx-release-version > VERSION
            echo "==> releasing leartech-checkers $(cat VERSION)"
        - image: gcr.io/kaniko-project/executor:v1.24.0-debug
          name: build-and-push
          resources: {}
          script: |
            #!/busybox/sh
            set -e
            VERSION=$(cat VERSION)
            /kaniko/executor \
              --context=/workspace/source \
              --dockerfile=checkers/Dockerfile \
              --destination="ghcr.io/mikelear/leartech-checkers:${VERSION}" \
              --destination="ghcr.io/mikelear/leartech-checkers:latest"
        # Bump consumers NOW rather than on Renovate's Monday window.
        #
        # leartech-agent-go/release.yaml learned this the hard way: its
        # trigger targeted a CronJob that did not exist on the cluster it
        # released from, swallowed the error with `|| echo ::WARN`, and every
        # release went green while nothing propagated for up to seven days.
        # So this does NOT swallow: a missing CronJob is a configuration
        # error that will fail identically on every future release.
        - image: alpine/k8s:1.36.2
          name: trigger-renovate
          resources: {}
          script: |
            #!/bin/sh
            set -eo pipefail
            VERSION=$(cat VERSION)
            JOB="renovate-after-checkers-$(date +%s)"
            echo "==> dispatching renovate for leartech-checkers ${VERSION}"
            kubectl -n jx create job "$JOB" --from=cronjob/renovate-toolsets
            echo "==> created job/$JOB"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
