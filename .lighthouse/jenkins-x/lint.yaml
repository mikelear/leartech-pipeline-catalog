# YAML quality gate for the pipeline-catalog itself.
#
# Two checks, two separate steps so any red step names the offending file:
#   yq-parse  — yq eval . on every task YAML; catches structural parse errors
#               (this is the critical check; would have caught f4d9038's
#                inline-Python-heredoc-at-column-0 trap on the day it was added)
#   yamllint  — stricter style/structural checks with leartech-friendly rules
#
# Backstory: pipeline-catalog f4d9038 (2026-05-01) introduced two inline
# Python heredocs at column 0 inside a `script: |` literal block. YAML
# literal-block-scalars require every line to have at least the block's
# indentation, so the parser failed at the column-0 lines. Lighthouse
# silently couldn't render the ai-code-review PipelineRun → no AI reviews
# on any leartech repo's PRs for ~3 days. Caught + fixed 2026-05-04.
# This presubmit is the structural fix to prevent recurrence.
#
# Same pattern as `~/leartech/preview-shift-left/.lighthouse/jenkins-x/lint.yaml`.
# When a second consumer wants the same checks, extract into
# `tasks/yaml-lint/pullrequest.yaml` in this repo.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: lint
spec:
  pipelineSpec:
    tasks:
    - name: lint
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: mikefarah/yq:4
          name: yq-parse
          resources: {}
          script: |
            #!/bin/sh
            set -e
            # Scope: every YAML under tasks/ — the actual catalog content.
            # Also the .lighthouse/ files themselves so this lint can't
            # break itself silently.
            files=$(find tasks .lighthouse -name '*.yaml' -type f 2>/dev/null)
            if [ -z "$files" ]; then
              echo "no YAML files found — nothing to parse"
              exit 0
            fi
            failed=0
            for f in $files; do
              if yq eval '.' "$f" >/dev/null 2>&1; then
                printf '  ok    %s\n' "$f"
              else
                printf '  FAIL  %s\n' "$f"
                # Print the actual error for the failing file so the PR
                # check output names the bad file + line:
                yq eval '.' "$f" 2>&1 | head -3 | sed 's/^/      /'
                failed=1
              fi
            done
            if [ "$failed" = "1" ]; then
              echo "yq-parse: at least one file failed to parse"
              exit 1
            fi
            echo "yq-parse: ok"
        - image: mikefarah/yq:4
          name: version-pins
          resources: {}
          script: |
            #!/bin/sh
            set -e
            sh test/go/version_pin_test.sh
        - image: golangci/golangci-lint:v2.13.2
          name: config-schema
          resources: {}
          script: |
            #!/bin/sh
            set -e
            sh test/go/config_schema_test.sh
        - image: golang:1.26
          name: go-selftests
          resources: {}
          script: |
            #!/bin/sh
            set -e
            # These tools fail OTHER repos' builds, so they get the same
            # treatment they hand out: every rule has a fixture violating
            # exactly one thing, and a control violating nothing. Two of
            # authconformance's rules were wrong on first contact with the
            # estate; the controls are what caught that.
            #
            # Every module is tested here, not just the one this step used to
            # name. authcoverage and commentgate had tests and no runner.
            # authtoken's drift test in particular only means anything if it
            # runs: it compares the copy inlined in
            # tasks/end2end/pullrequest.yaml against its source, and a drift
            # test that never executes is exactly how the two come apart.
            #
            # -count=1 because some of these read files through exec, which go
            # test does not cache on -- a cached PASS can describe a different
            # tree than the one in the PR.
            rc=0
            found=0
            untested=""
            for mod in go/*/go.mod; do
              d=$(dirname "$mod")
              if ls "$d"/*_test.go >/dev/null 2>&1; then
                found=$((found + 1))
                echo "==> go test $d"
                ( cd "$d" && go test ./... -count=1 ) || rc=1
              else
                untested="$untested $d"
              fi
            done
            if [ "$found" = "0" ]; then
              echo "FAIL: no go module under go/ has tests, so this step ran nothing." >&2
              echo "      A green tick here would mean the opposite of what it says." >&2
              exit 1
            fi
            if [ -n "$untested" ]; then
              echo "==> NO TESTS:$untested"
              echo "    These tools gate other repos' pipelines and nothing here"
              echo "    exercises them -- the same gap this repo fails others for."
            fi
            echo "==> tested $found module(s)"

            exit "$rc"
        - image: debian:12-slim
          name: runner-selftests
          resources: {}
          script: |
            #!/bin/bash
            set -eo pipefail
            # The shared end2end runner is shell, not a Go module, so the Go
            # loop above cannot see it. It decides what a check's exit code
            # MEANS and writes the results.json the qa-gate reads, and it
            # carried two defects this year that each survived because nothing
            # exercised it.
            #
            # This runs in debian:12-slim, not golang, because that is what
            # tasks/end2end/pullrequest.yaml runs the runner in -- and it
            # apt-installs the tools it calls "the contract guarantees to
            # consumer scripts" before invoking it. The runner shells out to
            # jq to build results.json, so a test image without jq does not
            # test the runner: run.sh dies at exit 127 and every assertion
            # fails on a missing file, which is what the first CI run this
            # repo ever had reported. Test where the contract holds.
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              ca-certificates jq python3 >/dev/null

            # Assert rather than assume. Both of these are call-outs, so a
            # missing one does not fail the test it is meant to run -- it
            # fails it for the wrong reason, or (for a test that swallows the
            # error) passes it on nothing.
            for tool in jq python3; do
              command -v "$tool" >/dev/null || { echo "FAIL: $tool absent after install" >&2; exit 1; }
            done

            rc=0
            found=0
            for t in end2end-runner/*_test.sh; do
              [ -f "$t" ] || continue
              found=$((found + 1))
              echo "==> $t"
              bash "$t" || rc=1
            done
            if [ "$found" = "0" ]; then
              echo "FAIL: no end2end-runner/*_test.sh ran, so this step proved nothing." >&2
              exit 1
            fi
            echo "==> ran $found runner test file(s)"
            exit "$rc"
        - image: cytopia/yamllint:latest
          name: yamllint
          resources: {}
          script: |
            #!/bin/sh
            set -e
            # Permissive config — matches leartech/k8s/helm YAML conventions
            # that yamllint's default profile would flag:
            #   indent-sequences: whatever — allow list items aligned with
            #                     or indented under their parent key (k8s norm)
            #   line-length: disable — long URLs, resource descriptions etc.
            #   document-start: disable — no leading `---` required
            #   truthy: disable — we accept `yes`/`no` in comments & strings
            #   comments-indentation: disable — Tekton script blocks have
            #                     comments at varied indents inside heredocs
            yamllint \
              -d "{extends: default, rules: {indentation: {indent-sequences: whatever}, line-length: disable, document-start: disable, truthy: disable, comments: {min-spaces-from-content: 1}, comments-indentation: disable, empty-lines: disable, trailing-spaces: disable}}" \
              tasks/ .lighthouse/
            echo "yamllint: ok"
  podTemplate: {}
  serviceAccountName: tekton-bot
  timeout: 15m
status: {}
