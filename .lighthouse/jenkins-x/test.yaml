apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: test
spec:
  pipelineSpec:
    tasks:
    - name: go-test
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          name: ""
          resources: {}
          workingDir: /workspace/source
          env:
          - name: HOME
            value: /tekton/home
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        # Every go/<tool> module is its own unit; this gate runs them all.
        # The catalog ships the estate's quality gates — a broken gate tool is
        # worse than a broken app, so the tools gate themselves here.
        - image: golang:1.27.4
          name: go-test-all-tools
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          env:
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            fail=0
            # The pin gate FIRST: a bad image pin fails PRs across the whole
            # estate, so it is checked before anything slower.
            echo "=== pincheck tasks/end2end ==="
            (cd go/pincheck && go run . -task ../../tasks/end2end/pullrequest.yaml) || fail=1
            for mod in go/*/go.mod; do
              dir=$(dirname "$mod")
              echo "=== go test $dir ==="
              if ! (cd "$dir" && go test ./... ); then
                echo "FAIL: $dir"
                fail=1
              fi
            done
            # The shell tests in test/go assert things about the mk file, the task YAMLs
            # and the checkers themselves, which no Go module covers, so they run here.
            #
            # THE POPULATION IS THE GLOB, NOT A HAND-KEPT LIST. Eight of these were
            # written, passed locally, and never ran in CI because nobody added them to
            # the list: chartstd, chartstd_runs, valuesstd, identitystd, triggersync,
            # version_stamp, preflight_tools, parity. Every one is the test for a tool this
            # catalog ships — a test with no caller is a note, not a check, and that is the
            # same "declared, never run" gap as the python guards that skipped on a missing
            # import. A glob makes a new script run by default, so SKIPPING one is the
            # visible act rather than the silent one.
            #
            # SKIP_LIST is the only exemption and names the reason. parity is pure yq +
            # diff and the golang image has no yq; nothing else is exempt.
            SKIP_LIST="test/go/parity_test.sh"   # needs mikefarah yq on PATH, which the golang image has not
            for t in test/go/*_test.sh; do
              case " $SKIP_LIST " in
                *" $t "*) echo "=== skip $t (see SKIP_LIST) ==="; continue ;;
              esac
              echo "=== sh $t ==="
              if ! sh "$t"; then
                echo "FAIL: $t"
                fail=1
              fi
            done
            exit $fail
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
