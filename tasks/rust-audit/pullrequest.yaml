apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: rust-audit
spec:
  pipelineSpec:
    tasks:
    - name: rust-audit
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: ghcr.io/mikelear/leartech-checkers:0.51.1
          name: provide-catalog-tools
          resources: {}
          script: |
            #!/bin/sh
            set -eu
            mkdir -p /workspace/bin
            test -f /usr/local/share/deny.base.toml || { echo "FAIL: deny.base.toml missing from the checkers image" >&2; exit 1; }
            cp /usr/local/share/deny.base.toml /workspace/bin/deny.base.toml
            test -f /workspace/bin/deny.base.toml
            echo "==> provided /workspace/bin/deny.base.toml"
        - image: rust:1.100-slim-bookworm
          name: rust-audit
          resources:
            requests:
              cpu: 400m
              memory: 1Gi
          script: |
            #!/bin/bash
            set +e
            (
            set -e
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              git pkg-config libssl-dev libpq-dev build-essential curl ca-certificates >/dev/null

            # cargo-deny covers vulnerabilities + license policy + duplicate
            # dependency detection; cargo-audit is RustSec advisory database
            # checks specifically. cargo-deny includes audit functionality but
            # we run both for explicit cross-check.
            #
            # Cold install ~3 min combined. TODO: pre-bake into a
            # leartech-rust-tools image to drop install time to seconds.
            echo "==> installing cargo-deny + cargo-audit"
            cargo install --locked cargo-deny
            cargo install --locked cargo-audit

            # cargo-deny needs a `deny.toml` in the consumer repo. If the repo
            # doesn't ship one, fetch the leartech base policy from this catalog
            # repo. Repo-local override (deny.toml) wins over base-only.
            if [ -f deny.toml ]; then
              echo "==> using repo-local deny.toml"
            else
              echo "==> using the leartech base deny.toml from the pinned checkers image"
              cp /workspace/bin/deny.base.toml deny.toml
            fi

            echo "==> cargo deny check (advisories, licenses, bans, sources)"
            cargo deny check

            echo "==> cargo audit"
            cargo audit

            echo "==> audit complete"
            ) > /workspace/.rust-audit.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.rust-audit.log
            printf '%s\n' "$rc" > /workspace/.rust-audit.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.51.1
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            [ -f /workspace/.rust-audit.rc ] && rc=$(cat /workspace/.rust-audit.rc)
            if [ "$rc" -eq 0 ]; then
              echo "==> audit passed; nothing to report"
              exit 0
            fi
            gate="unknown"
            grep -q "==> cargo deny check" /workspace/.rust-audit.log && gate="cargo deny"
            grep -q "==> cargo audit" /workspace/.rust-audit.log && gate="cargo audit"
            grep -q "==> installing cargo-deny" /workspace/.rust-audit.log && \
              ! grep -q "==> cargo audit" /workspace/.rust-audit.log && gate="cargo install"
            {
              printf '### :x: Audit: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:-}"
              printf 'Failed at `%s` (exit %s).\n\n' "$gate" "$rc"
              printf '```\n'
              case "$gate" in
                "cargo deny")
                  grep -E "^(error|warning)(\[|:)|^(advisories|licenses|bans|sources) (FAILED|ok)" \
                    /workspace/.rust-audit.log | head -n 25 || true
                  ;;
                "cargo audit")
                  grep -E "^Crate:|^ID:|^#|error:|vulnerabilit" /workspace/.rust-audit.log \
                    | head -n 25 || true
                  ;;
                *)
                  grep -E "^error" /workspace/.rust-audit.log | head -n 15 || true
                  ;;
              esac
              printf '%s\n' '---'
              tail -n 20 /workspace/.rust-audit.log
              printf '```\n'
            } > /tmp/body.md
            prpost -tool rust-audit -check rust-audit -outcome failure \
              -cluster "${CLUSTER_ID:-}" -summary "$gate exited $rc" \
              -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
