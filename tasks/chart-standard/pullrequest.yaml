apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: chart-standard
spec:
  pipelineSpec:
    tasks:
    - name: chart-standard
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          workingDir: /workspace/source
        params:
        # No default: see docs/chart-standard.md S1.
        - name: CHART_STORE
          type: string
          description: >-
            The ClusterSecretStore every ExternalSecret in this repo must name. Read it
            from config/secrets.yaml and pass it explicitly.
        # Required values and deploy toggles only; never a value a rule judges.
        - name: CHART_VALUES
          type: string
          description: >-
            Path to a values file supplying the chart's REQUIRED values (repo-relative).
            Required values and deploy toggles only — never a value a rule judges.
          default: ""
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}

        # Render here (jx-boot carries helm), judge next door (checkers image).
        - image: ghcr.io/jenkins-x/jx-boot:3.17.126
          name: render
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            shopt -s nullglob
            mkdir -p /workspace/renders

            charts=(charts/*/Chart.yaml)
            if [ ${#charts[@]} -eq 0 ]; then
              echo "==> no charts/*/Chart.yaml in this repo; nothing for chart-standard to do"
              # Say so rather than pass quietly; the next step reads this marker.
              touch /workspace/renders/NONE
              exit 0
            fi

            for c in "${charts[@]}"; do
              dir=$(dirname "$c"); name=$(basename "$dir")
              echo "==> helm dependency build $dir"
              helm dependency build "$dir"
              echo "==> helm lint $dir"
              helm lint "$dir"
              values=()
              if [ -n "${CHART_VALUES:-}" ]; then
                test -f "$CHART_VALUES" || {
                  echo "FAIL: CHART_VALUES=$CHART_VALUES does not exist in this repo." >&2
                  echo "      A render with the wrong values proves nothing about the chart." >&2
                  exit 1
                }
                values=(-f "$CHART_VALUES")
                echo "==> helm template $dir (required values from $CHART_VALUES)"
              else
                echo "==> helm template $dir (chart defaults)"
              fi
              helm template chart-standard "$dir" "${values[@]}" > "/workspace/renders/$name.yaml"
              test -s "/workspace/renders/$name.yaml" || {
                echo "FAIL: $dir rendered nothing. A chart that renders empty objects is not" >&2
                echo "      a clean chart; the judge would then check nothing at all." >&2
                exit 1
              }
            done
            ls -l /workspace/renders

        - image: ghcr.io/mikelear/leartech-checkers:0.24.14
          name: chart-standard
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            shopt -s nullglob
            if [ -f /workspace/renders/NONE ]; then
              echo "==> no chart in this repo; chart-standard reports nothing to check"
              exit 0
            fi
            command -v chartstd >/dev/null || {
              echo "FAIL: chartstd missing from ghcr.io/mikelear/leartech-checkers:0.24.14." >&2
              echo "      Bump the pin to a release that carries it; the image build asserts" >&2
              echo "      every checker binary is executable, so this means a stale pin." >&2
              exit 1
            }
            # S5 reads the source; the render rules run once over all renders.
            args=()
            for f in /workspace/renders/*.yaml; do args+=(-render "$f"); done
            for c in charts/*/; do args+=(-chart "${c%/}"); done
            set +e
            chartstd -store "$CHART_STORE" "${args[@]}" > /workspace/.chartstd.log 2>&1
            rc=$?
            set -e
            cat /workspace/.chartstd.log
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$rc" > /workspace/.chartstd.rc
            fi
          onError: continue
        # A reader should not have to open logs to learn what was covered.
        - image: ghcr.io/mikelear/leartech-checkers:0.24.14
          name: chart-standard-report
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -uo pipefail
            [ -f /workspace/renders/NONE ] && exit 0
            count=$(ls /workspace/renders/*.yaml 2>/dev/null | wc -l | tr -d ' ')
            echo "==> chart-standard judged $count chart render(s) against store $CHART_STORE"
            for f in /workspace/renders/*.yaml; do
              echo "    $(basename "$f" .yaml): $(grep -c '^kind:' "$f") object(s)"
            done
            - image: ghcr.io/mikelear/leartech-checkers:0.24.14
          name: report
          resources: {}
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
            - name: FORGE_API_URL
              value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
            - name: LEARTECH_AUTH_SERVER_URL
              value: https://hydra-sp-infra.jx.leartech.com
            - name: LEARTECH_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: catalog-prpost-oauth
                  key: CLIENT_ID
                  optional: true
            - name: LEARTECH_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-prpost-oauth
                  key: CLIENT_SECRET
                  optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            [ -f /workspace/.chartstd.rc ] || { echo "==> chart-standard passed; nothing to report"; exit 0; }
            rc=$(cat /workspace/.chartstd.rc)
            # The findings ARE the message: each names the rule, the object, and
            # the failure the rule prevents. A red check quoting Lighthouse's
            # "the following test failed" instead is the shape this step exists to
            # remove.
            {
              printf '### :x: Chart standard: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:?}"
              printf 'Store judged against: `%s`. Each finding names the rule and what it prevents.%s\n\n' "$CHART_STORE" "${CHART_VALUES:+ Values: \`$CHART_VALUES\`.}"
              printf '```\n'
              grep -vE "^(FAIL: |$)" /workspace/.chartstd.log | head -n 40
              printf '```\n'
            } > /tmp/body.md
            prpost -tool chart-standard -check chart-standard -outcome failure \
              -cluster "${CLUSTER_ID:?}" -summary "chart-standard: $(grep -c '^S[0-9]' /workspace/.chartstd.log) finding(s)" \
              -body-file /tmp/body.md \
              || echo "==> WARNING: could not deliver the chart-standard comment; the check still fails"
            exit "$rc"
  podTemplate:
        tolerations:
        - key: sku
          operator: Equal
          value: build
          effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 20m0s
status: {}
