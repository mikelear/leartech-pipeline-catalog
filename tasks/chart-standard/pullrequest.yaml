apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: chart-standard
spec:
  pipelineSpec:
    tasks:
    - name: chart-standard
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          workingDir: /workspace/source
        params:
        - name: CHART_STORE
          type: string
          description: >-
            The ClusterSecretStore every ExternalSecret in this repo must name
            (docs/chart-standard.md S1). Read it from config/secrets.yaml.
        - name: CHART_VALUES
          type: string
          description: >-
            Path to the values file supplying the chart's required values. Never a
            value a rule judges.
          default: ""
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}

        # Render here (jx-boot carries helm), judge next door (checkers image).
        # THE RENDER RUNS IN THE CHECKERS IMAGE, BECAUSE IT ALSO NEEDS `chartstd`.
        #
        # This step does two things: `helm template` and `chartstd -list-toggles` (to find the paths to
        # flip). It used to run in jx-boot — helm yes, chartstd no — so on any repo that DECLARES toggles
        # it died at `chartstd: command not found`, and the message named the toggles FILE. A repo
        # declaring none passed, because of the `if [ -f "$decl" ]` guard below. Measured on
        # leartech-console-api#37: the behavioural half of this gate had never run anywhere.
        #
        # The checkers image now carries helm for exactly this reason (its Dockerfile says so), and its
        # own build asserts every binary it ships. So one image has both tools, and the split between the
        # two steps is about WHAT they check, not about which image happens to have which binary.
        #
        # ORDER OF LANDING, because the pin is a released tag: this change and the Dockerfile change
        # merge together; merging releases a NEW checkers tag; Renovate then bumps this pin (its rule
        # already auto-merges leartech-checkers bumps, and that PR runs the new image, so it is green).
        # Until the bump lands, `chartstd -require helm,chartstd` fails with "missing helm" — which is
        # the honest state: the image referenced here genuinely does not have it yet, and the message
        # says so instead of blaming the chart.
        - image: ghcr.io/mikelear/leartech-checkers:0.52.8
          name: render
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            shopt -s nullglob
            # NAME THE TOOL THAT IS MISSING, FROM GO, NOT FROM SHELL.
            #
            # Without this the first symptom is `chartstd: command not found` in the middle of the
            # loop, and the FAIL line beside it blames the toggles FILE — so a task defect reads as a
            # repo defect. Measured on leartech-console-api#37.
            #
            # The sentence comes from `chartstd -require` rather than a block of `echo`s here, because
            # prose in a `script: |` has no test: this repo runs a message-layer ratchet, and a verdict
            # composed in shell is one nothing can assert on. One line, and the message lives in Go.
            chartstd -require helm,chartstd
            mkdir -p /workspace/renders

            charts=(charts/*/Chart.yaml)
            if [ ${#charts[@]} -eq 0 ]; then
              echo "==> no charts/*/Chart.yaml in this repo"
              touch /workspace/renders/NONE
              exit 0
            fi

            for c in "${charts[@]}"; do
              dir=$(dirname "$c"); name=$(basename "$dir")
              echo "==> helm dependency build $dir"
              helm dependency build "$dir"
              echo "==> helm lint $dir"
              helm lint "$dir"
              values=()
              if [ -n "${CHART_VALUES:-}" ]; then
                test -f "$CHART_VALUES" || {
                  echo "FAIL: CHART_VALUES=$CHART_VALUES does not exist." >&2
                  exit 1
                }
                values=(-f "$CHART_VALUES")
                echo "==> helm template $dir (-f $CHART_VALUES)"
              else
                echo "==> helm template $dir (chart defaults)"
              fi
              helm template chart-standard "$dir" "${values[@]}" \
                > "/workspace/renders/$name.yaml"
              test -s "/workspace/renders/$name.yaml" || {
                echo "FAIL: $dir rendered nothing." >&2
                exit 1
              }

              # The behavioural half: render each declared off-switch flipped. A
              # switch nobody flips in a test is a switch nobody has checked, and
              # the failure is silent in both directions.
              #
              # The declaration is parsed by chartstd, not by a heredoc here: a
              # Python block inside a `script: |` is the exact thing that broke
              # this repo's YAML for three days in May.
              decl="$dir/chart-standard-toggles.yaml"
              printf '%s\n' "$name" > "/workspace/renders/$name.toggles"
              if [ -f "$decl" ]; then
                i=0
                chartstd -list-toggles "$decl" > /tmp/toggles.txt || {
                  echo "FAIL: cannot read $decl" >&2
                  exit 1
                }
                while IFS='|' read -r path off; do
                  [ -n "$path" ] || continue
                  i=$((i+1))
                  echo "==> helm template $dir --set $path=$off (toggle $i)"
                  helm template chart-standard "$dir" "${values[@]}" \
                    --set "$path=$off" \
                    > "/workspace/renders/$name.off.$i.yaml"
                done < /tmp/toggles.txt
                printf '%s\n' "$i" > "/workspace/renders/$name.togglecount"
              fi
            done
            ls -l /workspace/renders

        # onError: continue so the report step runs after a failure.
        - image: ghcr.io/mikelear/leartech-checkers:0.52.8
          name: chart-standard
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            shopt -s nullglob
            if [ -f /workspace/renders/NONE ]; then
              echo "==> no chart in this repo; nothing to check"
              exit 0
            fi
            command -v chartstd >/dev/null || {
              echo "FAIL: chartstd missing from the checkers image; bump the pin." >&2
              exit 1
            }
            args=()
            # Base renders only: a *.off.N.yaml is a flipped render and would be
            # judged as an object set of its own, inventing findings.
            for f in /workspace/renders/*.yaml; do
              case "$f" in *.off.*) continue ;; esac
              args+=(-render "$f")
            done
            for c in charts/*/; do args+=(-chart "${c%/}"); done
            args+=(-templates)
            for decl in charts/*/chart-standard-toggles.yaml; do
              [ -f "$decl" ] || continue
              name=$(basename "$(dirname "$decl")")
              args+=(-toggles "$decl")
              n=0
              [ -f "/workspace/renders/$name.togglecount" ] && \
                n=$(cat "/workspace/renders/$name.togglecount")
              i=0
              while [ "$i" -lt "$n" ]; do
                i=$((i+1))
                args+=(-render-off "/workspace/renders/$name.off.$i.yaml")
              done
            done
            set +e
            chartstd -store "$CHART_STORE" "${args[@]}" \
              > /workspace/.chartstd.log 2>&1
            rc=$?
            set -e
            cat /workspace/.chartstd.log

            # argohooks, over the SAME renders: is a hook a hook on BOTH delivery paths?
            # Helm honours helm.sh/hook; Argo CD does not implement it, so the object is an
            # ordinary resource applied on every sync. Measured on kyverno-migrate-resources:
            # a post-upgrade Job ran once under Helm and was re-applied on every Argo sync.
            # Same log, so the report step below already carries its findings.
            if ! command -v argohooks >/dev/null; then
              echo '==> argohooks missing from the checkers image; the hook gate is NOT running' >&2
              rc=1
            else
              set +e
              for f in /workspace/renders/*.yaml; do
                case "$f" in *.off.*) continue ;; esac
                argohooks -manifest "$f" >> /workspace/.chartstd.log 2>&1 || rc=1
              done
              set -e
              cat /workspace/.chartstd.log
            fi

            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$rc" > /workspace/.chartstd.rc
            fi
          onError: continue

        - image: ghcr.io/mikelear/leartech-checkers:0.52.8
          name: chart-standard-report
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -uo pipefail
            [ -f /workspace/renders/NONE ] && exit 0
            count=$(ls /workspace/renders/*.yaml 2>/dev/null | wc -l | tr -d ' ')
            echo "==> judged $count chart render(s) against store $CHART_STORE"
            for f in /workspace/renders/*.yaml; do
              echo "    $(basename "$f" .yaml): $(grep -c '^kind:' "$f") object(s)"
            done

        # The findings are the message.
        - image: ghcr.io/mikelear/leartech-checkers:0.52.8
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            if [ ! -f /workspace/.chartstd.rc ]; then
              echo "==> chart-standard passed; nothing to report"
              exit 0
            fi
            rc=$(cat /workspace/.chartstd.rc)
            findings=$(grep -c '^S[0-9]' /workspace/.chartstd.log || true)
            {
              printf '### :x: Chart standard: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:-}"
              printf 'Store judged against: `%s`.%s\n\n' "$CHART_STORE" \
                "${CHART_VALUES:+ Values: \`$CHART_VALUES\`.}"
              printf '```\n'
              grep -vE '^(FAIL: |$)' /workspace/.chartstd.log | head -n 40
              printf '```\n'
            } > /tmp/body.md
            prpost -tool chart-standard -check chart-standard -outcome failure \
              -cluster "${CLUSTER_ID:-}" \
              -summary "chart-standard: $findings finding(s)" \
              -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 20m0s
status: {}
