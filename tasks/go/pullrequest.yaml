apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: pullrequest
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          # Pod-level scheduling is sum of all step containers (Tekton steps
          # run sequentially but reserved up-front). Keep modest so the pod
          # fits on a standard node.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: ghcr.io/jenkins-x/jx-boot:3.17.129
          name: jx-variables
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx gitops variables
        - image: golang:1.27.4-alpine
          name: build-make-build
          # `go build` of a real module (type-check + codegen) exceeds the inherited
          # 256Mi under node pressure. Reserve headroom to avoid eviction flakes.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          env:
          # Honour go.mod's `toolchain` directive by auto-downloading it, the
          # same reason govulncheck sets this: the baked golang:1.27.4 image is
          # one patch behind a go.mod that pins a newer toolchain, and without
          # this `go build` silently uses the baked version regardless. A
          # go-common toolchain bump (e.g. go1.27.3 for GO-2026-6809) then
          # builds here against the version the module actually asked for.
          - name: GOTOOLCHAIN
            value: auto
          script: |
            #!/bin/sh
            set +e
            (
            set -e
            apk add --no-cache git make curl bash
            # Populate module cache. If the repo has private deps via
            # leartech-go-common or similar, make the dep repo public
            # (preferred) or inline an override step that sets GIT_TOKEN +
            # GOPRIVATE before this step runs.
            go mod download
            # Regenerate OpenAPI docs via swaggo/swag if the Makefile has a
            # `swag:` target. No-op otherwise — services without Swagger just
            # skip this.
            [ -f Makefile ] && grep -q "^swag:" Makefile && make swag || true
            # BUILD_TARGET lets monorepos point at a non-default entrypoint.
            # Default matches the golden-standard layout (cmd/server/main.go).
            go build -trimpath -ldflags="-s -w" -o bin/server "${BUILD_TARGET:-./cmd/server}"
            ) > /workspace/.go-build.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.go-build.log
            printf '%s\n' "$rc" > /workspace/.go-build.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.43.0
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            [ -f /workspace/.go-build.rc ] && rc=$(cat /workspace/.go-build.rc)
            if [ "$rc" -eq 0 ]; then
              echo "==> build passed; nothing to report"
              exit 0
            fi
            gate="go build"
            grep -q "==> go mod download" /workspace/.go-build.log 2>/dev/null || true
            grep -qE "^go: (downloading|.*error)" /workspace/.go-build.log && \
              ! grep -qE "\.[a-z]+\.go:[0-9]+" /workspace/.go-build.log && gate="go mod download"
            {
              printf '### :x: Build: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:?}"
              printf 'Failed at `%s` (exit %s).\n\n' "$gate" "$rc"
              printf '```\n'
              grep -E "\.go:[0-9]+(:[0-9]+)?:|^# |cannot find|undefined:|declared and not used|no required module" \
                /workspace/.go-build.log | head -n 25 || true
              printf '%s\n' '---'
              tail -n 25 /workspace/.go-build.log
              printf '```\n'
            } > /tmp/body.md
            prpost -tool build -check pr -outcome failure -cluster "${CLUSTER_ID:?}" \
              -summary "$gate exited $rc" -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
        - image: gcr.io/kaniko-project/executor:v1.24.0-debug
          name: build-container-build
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
          script: |
            #!/busybox/sh
            # The go build leaves its exit code in .go-build.rc: a non-zero one
            # means report already posted why and there is no binary to package.
            go_build_rc=$(cat /workspace/.go-build.rc 2>/dev/null || echo 0)
            if [ "$go_build_rc" != "0" ]; then
              echo ==> go build failed - not building an image
              exit 0
            fi
            source .jx/variables.sh
            cp /tekton/creds/.docker/config.json /kaniko/.docker/config.json
            # Layer cache — see release.yaml for rationale. Same cache repo
            # shared across PR + release builds, so PR snapshots warm the cache
            # for the eventual release build of the merged commit.
            # GO_COVER_BUILD=1 (set per-repo, like BUILD_TARGET) asks the
            # Dockerfile for a coverage-instrumented binary via ARG COVER.
            # Opt-in and PR-only: this task builds the snapshot image that is
            # deployed to a preview namespace and nowhere else, so an
            # instrumented binary never reaches staging or production. Repos
            # that do not set it, or whose Dockerfile has no ARG COVER, are
            # unaffected.
            #
            # The point is E2E_COVERAGE_DIR in leartech-go.mk: the coverage
            # floor cannot see an end2end suite driving a deployed pod, which
            # left leartech-maestro-service at 56.4% against a 60% floor with
            # its Mongo repositories and informer callbacks exercised on every
            # run and attributed to nothing.
            # PREVIEW_FIXTURES=1 asks the repo's Dockerfile for artefacts that
            # exist only to be tested against -- leartech-auth-service builds a
            # scope-gated resource server this way, so its end2end suite has a
            # callee to demonstrate capability-scope enforcement against. Same
            # opt-in, PR-only shape as GO_COVER_BUILD above.
            #
            # Two explicit flags is the limit of this pattern being clearer than
            # a generic passthrough. A third should become one, rather than a
            # third line here.
            /kaniko/executor $KANIKO_FLAGS \
              ${GO_COVER_BUILD:+--build-arg COVER=1} \
              ${PREVIEW_FIXTURES:+--build-arg PREVIEW_FIXTURES=1} \
              --cache=true \
              --cache-repo="$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/kaniko-cache" \
              --cache-ttl=168h \
              --context=/workspace/source \
              --dockerfile="${DOCKERFILE_PATH:-Dockerfile}" \
              --destination="$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION"
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/preview/clear-stuck-release.yaml@main
          name: ""
          resources: {}

        - image: ghcr.io/jenkins-x/jx-boot:3.17.129
          name: promote-jx-preview
          resources: {}
          script: |
            #!/usr/bin/env sh
            set -e
            # Same predicate as the image build: promote only what the go build
            # actually produced.
            go_build_rc=$(cat /workspace/.go-build.rc 2>/dev/null || echo 0)
            if [ "$go_build_rc" != "0" ]; then
              echo ==> go build failed - not promoting a preview
              exit 0
            fi
            source .jx/variables.sh
            # DOCKER_REGISTRY_ORG is read from .jx/variables.sh directly.
            # jx-preview v0.7.3+ dropped the --docker-register-org flag.
            jx preview create
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 2h0m0s
status: {}
