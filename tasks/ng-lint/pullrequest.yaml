# Angular ESLint presubmit. Thin: npm ci + npm run lint.
#
# Consumers own their eslint.config.mjs (ESLint flat config doesn't
# compose cleanly over HTTP — see leartech-angular-service-template
# eslint.config.mjs header for the centralisation migration path).
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: ng-lint
spec:
  pipelineSpec:
    tasks:
    - name: ng-lint
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: node:26-alpine
          name: ng-lint
          resources:
            requests:
              cpu: 400m
              memory: 1Gi
          env:
            # .npmrc in consumer repos uses ${GIT_TOKEN} to authenticate
            # against npm.pkg.github.com for @mikelear/* private packages.
            # Without this, `npm ci` fails with 401 before lint even runs.
            # Same pattern as ng-test.
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
          script: |
            #!/bin/sh
            set +e
            (
            set -e
            apk add --no-cache git
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            npm run lint
            ) > /workspace/.ng-lint.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.ng-lint.log
            printf '%s\n' "$rc" > /workspace/.ng-lint.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.52.3
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            [ -f /workspace/.ng-lint.rc ] && rc=$(cat /workspace/.ng-lint.rc)
            if [ "$rc" -eq 0 ]; then
              echo "==> lint passed; nothing to report"
              exit 0
            fi
            stage="lint"
            grep -q "npm ci\|npm install" /workspace/.ng-lint.log && \
              grep -qE "^npm error|npm ERR!" /workspace/.ng-lint.log && stage="install"
            {
              printf '### :x: Lint: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:-}"
              printf 'Failed at `%s` (exit %s).\n\n' "$stage" "$rc"
              printf '```\n'
              if [ "$stage" = "install" ]; then
                grep -E "^npm (error|ERR!)" /workspace/.ng-lint.log | head -n 20 || true
              else
                grep -E "^/workspace|error|warning" /workspace/.ng-lint.log | head -n 25 || true
              fi
              printf '%s\n' '---'
              tail -n 20 /workspace/.ng-lint.log
              printf '```\n'
            } > /tmp/body.md
            prpost -tool ng-lint -check ng-lint -outcome failure \
              -cluster "${CLUSTER_ID:-}" -summary "$stage exited $rc" \
              -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
