apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  creationTimestamp: null
  name: sp-variables
spec:
  stepTemplate:
    env:
    - name: HOME
      value: /tekton/home
    name: ""
    resources: {}
    workingDir: /workspace/source
  steps:
  - image: ghcr.io/mikelear/leartech-checkers:0.50.13
    name: sp-variables
    resources: {}
    script: |
      #!/bin/sh
      set -eu
      spvariables
  workspaces:
  - description: The checkout this writes .jx/variables.sh into
    mountPath: /workspace
    name: output
