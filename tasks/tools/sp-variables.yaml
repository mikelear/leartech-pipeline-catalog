apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  creationTimestamp: null
  name: sp-variables
spec:
  stepTemplate:
    env:
    - name: HOME
      value: /tekton/home
    name: ""
    resources: {}
    workingDir: /workspace/source
  steps:
  # This step carries its own env on purpose. The binary can read jx-cluster-config itself,
  # but only from a checkers image that has that code, and the image is a pinned tag Renovate
  # bumps -- so a step that relied on the read alone would break the build the moment the pin
  # moved to a tag that predates it. Values here come from jx-cluster-config, with JX boot's
  # ConfigMap folded in as a fallback, so the step works either side of that change.
  - image: ghcr.io/mikelear/leartech-checkers:0.60.3
    name: sp-variables
    resources: {}
    env:
    - name: DOCKER_REGISTRY
      valueFrom:
        configMapKeyRef:
          name: jx-cluster-config
          key: DOCKER_REGISTRY
          optional: true
    - name: DOCKER_REGISTRY_ORG
      valueFrom:
        configMapKeyRef:
          name: jx-cluster-config
          key: DOCKER_REGISTRY_ORG
          optional: true
    - name: PUSH_CONTAINER_REGISTRY
      valueFrom:
        configMapKeyRef:
          name: jx-cluster-config
          key: PUSH_CONTAINER_REGISTRY
          optional: true
    - name: KANIKO_FLAGS
      valueFrom:
        configMapKeyRef:
          name: jx-cluster-config
          key: KANIKO_FLAGS
          optional: true
    - name: DOMAIN
      valueFrom:
        configMapKeyRef:
          name: jx-cluster-config
          key: DOMAIN
          optional: true
    - name: CLUSTER_ID
      valueFrom:
        configMapKeyRef:
          name: jx-cluster-config
          key: CLUSTER_ID
          optional: true
    - name: JX_DOCKER_REGISTRY
      valueFrom:
        configMapKeyRef:
          name: jenkins-x-docker-registry
          key: docker.registry
          optional: true
    - name: JX_DOCKER_REGISTRY_ORG
      valueFrom:
        configMapKeyRef:
          name: jenkins-x-docker-registry
          key: docker.registry.org
          optional: true
    - name: JX_KANIKO_FLAGS
      valueFrom:
        configMapKeyRef:
          name: jenkins-x-docker-registry
          key: kaniko.flags
          optional: true
    script: |
      #!/bin/sh
      set -eu
      : "${DOCKER_REGISTRY:=${JX_DOCKER_REGISTRY:-}}"
      : "${DOCKER_REGISTRY_ORG:=${JX_DOCKER_REGISTRY_ORG:-}}"
      : "${KANIKO_FLAGS:=${JX_KANIKO_FLAGS:-}}"
      spvariables
  workspaces:
  - description: The checkout this writes .jx/variables.sh into
    mountPath: /workspace
    name: output
