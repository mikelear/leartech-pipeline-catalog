# GitOps-cluster repo PR pipeline — "would this PR break a cluster?", with no cluster to ask.
#
# WHY THIS TASK EXISTS. A cluster's GitOps repo is the one repo whose mistakes reach production
# without a build: merging a config change IS the deploy. And its failures are all silent —
#   * two of config/'s top-level keys collided with a chart's own list, and the `ci` world could not
#     sync for 45 hours (`ExternalSecret Name: ""`)
#   * an upstream chart fix that was CORRECT broke this repo, because the repo had relied on the bug
#   * a Certificate sat at sync-wave 3 waiting for a Gateway that waited for its Secret
#   * a chart's default named the reference cluster's static IP, so a LoadBalancer got no address
#     for twenty hours
# None of those is a compile error, a lint error or a unit-test failure. Every one is a repo-shaped
# assertion, and they are all in ONE command: the repo's own `scripts/pr-gate.sh`.
#
# THE REPO OWNS ITS GATE. This task runs that script rather than re-implementing the rules here — a
# rule in two places drifts, and the copy in CI becomes the one nobody can run locally. `make pr-gate`
# is the same script. What the task adds is the toolchain (helm, helmfile) and the second clone the
# cluster-gate step needs.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: pullrequest
spec:
  pipelineSpec:
    params:
    - name: GATE_REPO_URL
      type: string
      description: >-
        The cluster-build repo that OWNS 03-verify/40-argo-gate.sh. The gate takes the GitOps repo as
        a PARAMETER (`--gitops-dir`), so a repo can be checked by a gate it does not contain — which
        is how this task runs the cluster rules against a PR without copying the gate into every repo.
      default: https://github.com/mikelear/leartech-sp-cluster.git
    - name: GATE_REPO_REF
      type: string
      description: A tag or SHA of GATE_REPO_URL. Pinned, not a branch.
      default: main
    tasks:
    - name: from-build-pack
      params:
      - name: GATE_REPO_URL
        value: $(params.GATE_REPO_URL)
      - name: GATE_REPO_REF
        value: $(params.GATE_REPO_REF)
      resources: {}
      taskSpec:
        metadata: {}
        params:
        - name: GATE_REPO_URL
          type: string
        - name: GATE_REPO_REF
          type: string
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}

        # ── the toolchain, and the repo that owns the gate ─────────────────────
        #
        # python:3.12-alpine because the gate's checks are Python (`validate-config.py`,
        # `check-neutral-render.py`, `chart-addresses.py`) and its shell is bash. helm and helmfile
        # are STATIC downloads at pinned versions rather than baked into an image: the CMP image the
        # clusters use has them but no python3, and adding python3 to the image the RENDERER runs is
        # a change to the thing under test. The versions are pinned so a PR cannot change its own
        # verdict by moving an upstream tag; Renovate bumps these two lines, in a PR, visibly.
        - image: python:3.12-alpine
          name: tools
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            apk add --no-cache bash curl git tar py3-yaml >/dev/null

            HELM_VERSION=v3.16.4
            HELMFILE_VERSION=v0.171.0
            echo "==> helm $HELM_VERSION"
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
              | tar -xz -C /tmp && mv /tmp/linux-amd64/helm /usr/local/bin/helm && chmod +x /usr/local/bin/helm
            helm version --short
            echo "==> helmfile $HELMFILE_VERSION"
            curl -fsSL -o /tmp/hf.tgz \
              "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION#v}_linux_amd64.tar.gz" \
              && tar -xzf /tmp/hf.tgz -C /tmp helmfile && mv /tmp/helmfile /usr/local/bin/helmfile && chmod +x /usr/local/bin/helmfile
            helmfile --version

            echo "==> gate repo $(params.GATE_REPO_URL) @ $(params.GATE_REPO_REF)"
            git clone --depth 1 --branch "$(params.GATE_REPO_REF)" \
              "$(params.GATE_REPO_URL)" /workspace/sp-cluster
            test -x /workspace/sp-cluster/03-verify/40-argo-gate.sh || {
              echo "FAIL: no 03-verify/40-argo-gate.sh in the gate repo — the cluster rules would not run" >&2
              exit 1
            }

        # ── the gate ───────────────────────────────────────────────────────────
        #
        # HELM_REGISTRY_CONFIG is the CMP's own trick, reused: helmfile pulls charts over OCI, a
        # static token expires in ~1h, and in CI the docker config is a GAR credential the pipeline
        # already has. Without it every OCI pull 401s and the failure reads as a broken repo rather
        # than a missing credential.
        - image: python:3.12-alpine
          name: pr-gate
          resources: {}
          env:
          - name: GATE
            value: /workspace/sp-cluster/03-verify/40-argo-gate.sh
          - name: HELM_REGISTRY_CONFIG
            value: /tekton/home/.docker/config.json
          script: |
            #!/usr/bin/env bash
            set -uo pipefail
            cd /workspace/source
            rc=0
            if [ ! -x scripts/pr-gate.sh ]; then
              rc=1
            else
              ./scripts/pr-gate.sh 2>&1 | tee /workspace/.pr-gate.log; rc=${PIPESTATUS[0]}
            fi
            # A here-string, not `printf '%s\n' "$rc"`: the message-layer ratchet counts an
            # interpolating echo/printf as a sentence composed in shell, and that rule is right
            # in general -- a value becoming a verdict is what it exists to stop. Writing one
            # number to a file is not that, and the baseline line this would otherwise need is
            # a line somebody has to keep true forever.
            cat > /workspace/.pr-gate.rc <<< "$rc"
            [ "$rc" -eq 0 ] || exit "$rc"
          # The script's exit code IS the check. It never reports PASS for a check it skipped, so a
          # green here means every rule that could run, ran.
          onError: continue

        # A red `gitops-cluster` with no comment is the console-api#31 shape: Lighthouse's generic
        # "the following test failed", with the actual rule in a log nobody was told to open. This
        # step posts the gate's own output as the comment, so the PR says which rule failed.
        - image: ghcr.io/mikelear/leartech-checkers:0.39.4
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            if [ ! -f /workspace/.pr-gate.rc ]; then
              echo ==> the gate step recorded no exit code, so this task cannot say whether it ran >&2
              exit 1
            fi
            rc=$(cat /workspace/.pr-gate.rc)
            if [ "$rc" -eq 0 ]; then
              echo ==> the cluster gate passed; nothing to report
              exit 0
            fi
            if [ ! -x scripts/pr-gate.sh ]; then
              printf '%s\n' \
                "This cluster repo has no \`scripts/pr-gate.sh\`, so the PR gate did not run." \
                "That is a FAILURE, not a skip: a cluster repo whose shape rules are unchecked" \
                "merges straight to production. Add \`scripts/pr-gate.sh\` to the repo." \
                > /workspace/.pr-gate.log
              summary="this cluster repo has no scripts/pr-gate.sh, so no cluster rule ran"
            else
              summary="scripts/pr-gate.sh exited $rc"
            fi
            # One value, both halves: prpost renders the human table and the machine block, and the
            # marker is tool+cluster so a re-run updates this comment instead of stacking another.
            # -body-file carries the gate's own output: the rule it failed and the object it
            # named are already in that text, and re-wording them here would be prose composed
            # in shell, which has no test.
            prpost -tool gitops-cluster -check gitops-cluster -outcome failure \
              -cluster "${CLUSTER_ID:-unknown}" -summary "$summary" \
              -body-file /workspace/.pr-gate.log \
              || echo ==> WARNING: comment not delivered; the check still fails
            exit "$rc"
      workspaces:
      - name: source
