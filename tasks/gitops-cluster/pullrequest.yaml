# GitOps-cluster repo PR pipeline — "would this PR break a cluster?", with no cluster to ask.
#
# WHY THIS TASK EXISTS. A cluster's GitOps repo is the one repo whose mistakes reach production
# without a build: merging a config change IS the deploy. And its failures are all silent —
#   * two of config/'s top-level keys collided with a chart's own list, and the `ci` world could not
#     sync for 45 hours (`ExternalSecret Name: ""`)
#   * an upstream chart fix that was CORRECT broke this repo, because the repo had relied on the bug
#   * a Certificate sat at sync-wave 3 waiting for a Gateway that waited for its Secret
#   * a chart's default named the reference cluster's static IP, so a LoadBalancer got no address
#     for twenty hours
# None of those is a compile error, a lint error or a unit-test failure. Every one is a repo-shaped
# assertion, and they are all in ONE command: the repo's own `scripts/pr-gate.sh`.
#
# THE REPO OWNS ITS GATE. This task runs that script rather than re-implementing the rules here — a
# rule in two places drifts, and the copy in CI becomes the one nobody can run locally. `make pr-gate`
# is the same script. What the task adds is the toolchain (helm, helmfile) and the second clone the
# cluster-gate step needs.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: pullrequest
spec:
  pipelineSpec:
    params:
    - name: GATE_REPO_URL
      type: string
      description: >-
        The cluster-build repo that OWNS 03-verify/40-argo-gate.sh. The gate takes the GitOps repo as
        a PARAMETER (`--gitops-dir`), so a repo can be checked by a gate it does not contain — which
        is how this task runs the cluster rules against a PR without copying the gate into every repo.
      default: https://github.com/mikelear/leartech-sp-cluster.git
    - name: GATE_REPO_REF
      type: string
      description: A tag or SHA of GATE_REPO_URL. Pinned, not a branch.
      default: main
    tasks:
    - name: from-build-pack
      params:
      - name: GATE_REPO_URL
        value: $(params.GATE_REPO_URL)
      - name: GATE_REPO_REF
        value: $(params.GATE_REPO_REF)
      resources: {}
      taskSpec:
        metadata: {}
        params:
        - name: GATE_REPO_URL
          type: string
        - name: GATE_REPO_REF
          type: string
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}

        # ── the toolchain, and the repo that owns the gate ─────────────────────
        #
        # python:3.12-alpine because the gate's checks are Python (`validate-config.py`,
        # `check-neutral-render.py`, `chart-addresses.py`) and its shell is bash. helm and helmfile
        # are STATIC downloads at pinned versions rather than baked into an image: the CMP image the
        # clusters use has them but no python3, and adding python3 to the image the RENDERER runs is
        # a change to the thing under test. The versions are pinned so a PR cannot change its own
        # verdict by moving an upstream tag; Renovate bumps these two lines, in a PR, visibly.
        # ONE STEP, AND WHY. Tekton steps are separate containers that share only /workspace, so a
        # tool installed in one is NOT in the next — helm and helmfile installed in a "tools" step
        # were simply absent where the gate ran. (The catalog's checkers Dockerfile records the same
        # lesson: "a tool installed in one step is not in the next.") Installing and running in the
        # same step is the only shape that cannot drift.
        #
        # `/bin/sh`, not bash: this is alpine, and bash is what the apk line below installs. A
        # `#!/usr/bin/env bash` script fails BEFORE it can install bash:
        #   env: can't execute 'bash': No such file or directory        (measured, first real PR)
        #
        # The toolchain is pinned so a PR cannot change its own verdict by moving an upstream tag;
        # Renovate bumps these three lines, in a PR, visibly.
        - image: alpine:3.24
          name: pr-gate
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          env:
          - name: GATE_REPO_URL
            value: $(params.GATE_REPO_URL)
          - name: GATE_REPO_REF
            value: $(params.GATE_REPO_REF)
          # The CMP's own trick, reused: helmfile pulls charts over OCI, a static token expires in
          # ~1h, and in CI the docker config IS a GAR credential the pipeline already has. Without
          # it every OCI pull 401s and the failure reads as a broken repo rather than a credential.
          - name: HELM_REGISTRY_CONFIG
            value: /tekton/home/.docker/config.json
          script: |
            #!/bin/sh
            set -eu

            # MAKE IS NOT OPTIONAL. `scripts/pr-gate.sh` ends in `40-argo-gate.sh` group G, which
            # runs the GitOps repo's OWN `make -s check` — the two-implementations rule means the
            # cluster gate delegates rather than re-implements. Without make here that group fails
            # with "make: command not found" and the whole check goes red for a reason that names
            # nothing in this repo. Measured, not assumed: monkey-patching a failing `make` into PATH
            # reproduces exactly that, and go/taskharness/steps_test.go now asserts this list.
            apk add --no-cache bash curl git tar make python3 py3-yaml >/dev/null

            HELM_VERSION=v3.16.4
            HELMFILE_VERSION=v0.171.0
            curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
              | tar -xz -C /tmp
            mv /tmp/linux-amd64/helm /usr/local/bin/helm
            helm version --short
            curl -fsSL -o /tmp/hf.tgz \
              "https://github.com/helmfile/helmfile/releases/download/${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION#v}_linux_amd64.tar.gz"
            tar -xzf /tmp/hf.tgz -C /tmp helmfile
            mv /tmp/helmfile /usr/local/bin/helmfile
            helmfile --version

            # The gate, from the repo that OWNS it. The gate takes the GitOps repo as --gitops-dir,
            # so a repo can be checked by a gate it does not contain — and this clone is why the
            # parameters are REQUIRED rather than defaulted.
            git clone --depth 1 --branch "$GATE_REPO_REF" "$GATE_REPO_URL" /workspace/sp-cluster
            test -x /workspace/sp-cluster/03-verify/40-argo-gate.sh || {
              echo "FAIL: no 03-verify/40-argo-gate.sh in the gate repo — the cluster rules would not run" >&2
              exit 1
            }

            cd /workspace/source
            if [ ! -x scripts/pr-gate.sh ]; then
              echo "FAIL: this repo has no scripts/pr-gate.sh — the PR gate is NOT running."
              cat >&2 <<'NOPGATE'
            That is a FAILURE, not a skip: a cluster repo whose shape rules are unchecked merges
            straight to production. Add scripts/pr-gate.sh, or point this task's GATE_REPO_URL at
            the repo whose rules should apply.
            NOPGATE
              exit 1
            fi
            export GATE=/workspace/sp-cluster/03-verify/40-argo-gate.sh
            # The reason a failing gate run exists is in THIS log and nowhere else: Lighthouse posts a
            # generic "the following test failed" table that names no cause. So the exit code is
            # recorded rather than propagated, and the report step below turns the log into a comment.
            # (Worked example: tasks/go-lint/pullrequest.yaml.)
            set +e
            bash ./scripts/pr-gate.sh > /workspace/.pr-gate.log 2>&1
            rc=$?
            set -e
            tail -n 80 /workspace/.pr-gate.log
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$rc" > /workspace/.pr-gate.rc
            fi
          onError: continue

        # A red `gitops-cluster` with no comment is the console-api#31 shape: Lighthouse's generic
        # "the following test failed", with the actual rule in a log nobody was told to open. This
        # step posts the gate's own output as the comment, so the PR says which rule failed.
        - image: ghcr.io/mikelear/leartech-checkers:0.43.17
          name: report
          resources: {}
          env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          # THE STICKY COMMENT'S CLUSTER TAG. Every cluster's jx-boot writes this ConfigMap, and
          # `optional: true` because a cluster without it should lose a scoped marker, not the comment.
          # MEASURED: the step used `-cluster "${CLUSTER_ID:?}"` with NO env supplying CLUSTER_ID, so
          # `${VAR:?}` made the shell exit 1 on line 14 — BEFORE prpost — under `set -u`. That is why
          # every failing consumer PR got a red check with no comment, which is the exact defect this
          # step exists to remove. prpost already treats an empty cluster as "no cluster tag".
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            [ -f /workspace/.pr-gate.rc ] || { echo "==> pr-gate passed; nothing to report"; exit 0; }
            rc=$(cat /workspace/.pr-gate.rc)
            # The FIRST failing assertion, because that is what decides whether a person can act:
            # the gate names its group and its assertion. Written to a FILE, never composed into a
            # sentence — the message-layer ratchet is right that a verdict in shell has no test.
            grep -m1 -E '^  FAIL ' /workspace/.pr-gate.log > /workspace/.pr-gate.first || true
            tail -n 40 /workspace/.pr-gate.log > /workspace/.pr-gate.tail
            grep -E '^PASS [0-9]+' /workspace/.pr-gate.log > /workspace/.pr-gate.summary || true
            # The body is assembled by cat from FILES, so prpost owns the markdown and this step
            # owns no prose. `-failures-file` is prpost's preferred form for free text.
            cat /workspace/.pr-gate.first /workspace/.pr-gate.tail > /workspace/.pr-gate.body
            prpost -tool pr-gate -check pr-gate -outcome failure \
                   -cluster "${CLUSTER_ID:-}" \
                   -summary "pr-gate exited $rc" \
                   -failures-file /workspace/.pr-gate.first \
                   -body-file /workspace/.pr-gate.body \
              || echo "==> WARNING: could not deliver the pr-gate comment; the check still fails"
            exit "$rc"
      workspaces:
      - name: source
