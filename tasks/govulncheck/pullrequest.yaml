apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: govulncheck
spec:
  pipelineSpec:
    tasks:
    - name: govulncheck
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: golang:1.27.4-alpine
          name: govulncheck
          resources:
            # govulncheck loads the full module + vuln DB; 512Mi is borderline and
            # under-reserves the pod under node pressure. Bump for reliability.
            requests:
              cpu: 500m
              memory: 1Gi
          env:
          # Honour the `toolchain` directive in go.mod (e.g. toolchain go1.26.3)
          # by auto-downloading the requested version. AZ + GCP builders
          # cache `golang:1.26-alpine` independently and one may be at an
          # older patch — without GOTOOLCHAIN=auto, `go install` uses the
          # baked-in version regardless of go.mod's toolchain line, which
          # caused AZ govulncheck to flag std-lib CVEs already patched by
          # toolchain go1.26.3 (e.g. GO-2026-4918 in net/http).
          - name: GOTOOLCHAIN
            value: auto
          script: |
            #!/bin/sh
            # The body runs in a subshell so `set -e` still stops at the FIRST
            # failing command while this shell survives to record its exit code.
            # Without that, a red check reports nothing on the PR and its reason
            # is only in a log nobody was told to open.
            set +e
            (
            set -e
            apk add --no-cache git curl
            go mod download
            # renovate: datasource=go depName=golang.org/x/vuln
            #
            # Was pinned to v1.1.4 with the note "most leartech Go services
            # are still on go 1.24.x ... bump alongside the fleet-wide go.mod
            # upgrade to 1.25". That upgrade happened; the bump did not.
            # Counted 2026-09-14 across every repo with a go.mod:
            #
            #   go 1.26.x   21 repos
            #   go 1.25.0    4
            #   go 1.24 or below  3
            #
            # 25 of 27 are already past the threshold the old note names, so
            # its reason had expired. v1.10.0 verified against a go1.24 module
            # so the three laggards still scan.
            GOVULNCHECK_VERSION="${GOVULNCHECK_VERSION:-v1.10.0}"
            go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
            govulncheck ./...
            ) > /workspace/.govulncheck.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.govulncheck.log
            printf '%s\n' "$rc" > /workspace/.govulncheck.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.48.6
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            [ -f /workspace/.govulncheck.rc ] && rc=$(cat /workspace/.govulncheck.rc)
            if [ "$rc" -eq 0 ]; then
              echo "==> govulncheck passed; nothing to report"
              exit 0
            fi
            {
              printf '### :x: govulncheck: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:?}"
              printf 'govulncheck exited %s. The findings, then the tail of its log:\n\n' "$rc"
              printf '```\n'
              grep -E '^Vulnerability|^  (More info|Found in|Fixed in)|GO-[0-9]{4}-[0-9]+' \
                /workspace/.govulncheck.log | head -n 20 || true
              tail -n 30 /workspace/.govulncheck.log
              printf '```\n'
            } > /tmp/body.md
            prpost -tool govulncheck -check govulncheck -outcome failure \
              -cluster "${CLUSTER_ID:?}" -summary "govulncheck exited $rc" \
              -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
