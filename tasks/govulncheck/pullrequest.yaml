apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: govulncheck
spec:
  pipelineSpec:
    tasks:
    - name: govulncheck
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: golang:1.27-alpine
          name: govulncheck
          resources:
            # govulncheck loads the full module + vuln DB; 512Mi is borderline and
            # under-reserves the pod under node pressure. Bump for reliability.
            requests:
              cpu: 500m
              memory: 1Gi
          env:
          # Honour the `toolchain` directive in go.mod (e.g. toolchain go1.26.3)
          # by auto-downloading the requested version. AZ + GCP builders
          # cache `golang:1.26-alpine` independently and one may be at an
          # older patch — without GOTOOLCHAIN=auto, `go install` uses the
          # baked-in version regardless of go.mod's toolchain line, which
          # caused AZ govulncheck to flag std-lib CVEs already patched by
          # toolchain go1.26.3 (e.g. GO-2026-4918 in net/http).
          - name: GOTOOLCHAIN
            value: auto
          script: |
            #!/bin/sh
            set -e
            apk add --no-cache git
            go mod download
            # renovate: datasource=go depName=golang.org/x/vuln
            #
            # Was pinned to v1.1.4 with the note "most leartech Go services
            # are still on go 1.24.x ... bump alongside the fleet-wide go.mod
            # upgrade to 1.25". That upgrade happened; the bump did not.
            # Counted 2026-09-14 across every repo with a go.mod:
            #
            #   go 1.26.x   21 repos
            #   go 1.25.0    4
            #   go 1.24 or below  3
            #
            # 25 of 27 are already past the threshold the old note names, so
            # its reason had expired. v1.8.0 verified against a go1.24 module
            # so the three laggards still scan.
            GOVULNCHECK_VERSION="${GOVULNCHECK_VERSION:-v1.8.0}"
            go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
            govulncheck ./...
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
