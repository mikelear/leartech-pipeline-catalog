# Angular PR orchestrator. Thin wrapper: npm install + ng build +
# kaniko image build + jx-preview.
#
# Shared steps (git-clone, jx-variables, kaniko build, jx-preview) come
# from the jenkins-x versionStream catalog. Only the ng-build step is
# Angular-specific.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: pullrequest
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: ghcr.io/mikelear/leartech-checkers:0.52.8
          name: sp-variables
          resources: {}
          env:
          - name: DOCKER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOCKER_REGISTRY
                optional: true
          - name: DOCKER_REGISTRY_ORG
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOCKER_REGISTRY_ORG
                optional: true
          - name: PUSH_CONTAINER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: PUSH_CONTAINER_REGISTRY
                optional: true
          - name: KANIKO_FLAGS
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: KANIKO_FLAGS
                optional: true
          - name: DOMAIN
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOMAIN
                optional: true
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: JX_DOCKER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: docker.registry
                optional: true
          - name: JX_DOCKER_REGISTRY_ORG
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: docker.registry.org
                optional: true
          - name: JX_KANIKO_FLAGS
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: kaniko.flags
                optional: true
          script: |
            #!/bin/sh
            set -eu
            : "${DOCKER_REGISTRY:=${JX_DOCKER_REGISTRY:-}}"
            : "${DOCKER_REGISTRY_ORG:=${JX_DOCKER_REGISTRY_ORG:-}}"
            : "${KANIKO_FLAGS:=${JX_KANIKO_FLAGS:-}}"
            spvariables
        - image: node:26-alpine
          name: build-npm-install
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          script: |
            #!/bin/sh
            set +e
            (
            set -e
            # Kaniko does its own npm install inside the Dockerfile; this
            # step exists mainly to catch dependency-resolution issues
            # quickly (before the expensive container build). --legacy-peer-deps
            # matches the Dockerfile invocation — some Angular peer deps
            # still lag upstream.
            apk add --no-cache git
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            ) > /workspace/.ng-build.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.ng-build.log
            printf '%s\n' "$rc" > /workspace/.ng-build.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.52.8
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            [ -f /workspace/.ng-build.rc ] && rc=$(cat /workspace/.ng-build.rc)
            if [ "$rc" -eq 0 ]; then
              echo "==> dependency install passed; nothing to report"
              exit 0
            fi
            {
              printf '### :x: Build: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:-}"
              printf '`npm ci` / `npm install` failed (exit %s) before the image build.\n' "$rc"
              printf 'Usually a peer-dependency conflict, a registry auth problem, or a\n'
              printf 'lockfile that no longer matches package.json.\n\n'
              printf '```\n'
              grep -E "^npm (error|ERR!)" /workspace/.ng-build.log | head -n 25 || true
              printf '%s\n' '---'
              tail -n 20 /workspace/.ng-build.log
              printf '```\n'
            } > /tmp/body.md
            prpost -tool build -check build -outcome failure -cluster "${CLUSTER_ID:-}" \
              -summary "npm install exited $rc" -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
        - image: gcr.io/kaniko-project/executor:v1.24.0-debug
          name: build-container-build
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
          script: |
            #!/busybox/sh
            [ -f /workspace/.ng-build.rc ] && exit 0
            source .jx/variables.sh
            cp /tekton/creds/.docker/config.json /kaniko/.docker/config.json
            # Layer cache — see angular/release.yaml for rationale. PR builds
            # warm the cache for release, especially the npm-install layer.
            /kaniko/executor $KANIKO_FLAGS \
              --cache=true \
              --cache-repo="$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/kaniko-cache" \
              --cache-ttl=168h \
              --context=/workspace/source \
              --dockerfile="${DOCKERFILE_PATH:-Dockerfile}" \
              --destination="$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION"
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/preview/clear-stuck-release.yaml@main
          name: ""
          resources: {}

        - image: ghcr.io/jenkins-x/jx-boot:3.17.129
          name: promote-jx-preview
          resources: {}
          script: |
            #!/usr/bin/env sh
            set -e
            [ -f /workspace/.ng-build.rc ] && exit 0
            source .jx/variables.sh
            jx preview create
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 2h0m0s
status: {}
