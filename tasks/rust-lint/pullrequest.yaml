apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: rust-lint
spec:
  pipelineSpec:
    tasks:
    - name: rust-lint
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: rust:1.100-slim-bookworm
          name: rust-lint
          resources:
            requests:
              cpu: 400m
              memory: 1Gi
          script: |
            #!/bin/bash
            set +e
            (
            set -e
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              git pkg-config libssl-dev libpq-dev build-essential >/dev/null

            # rustfmt + clippy ship with the rust:slim image's default toolchain
            # via `rustup component add` (already present unless rust-toolchain.toml
            # pins a non-default channel — handled by rustup automatically when it
            # reads that file).
            rustup component add rustfmt clippy

            echo "==> cargo fmt --all -- --check"
            cargo fmt --all -- --check

            echo "==> cargo clippy --all-targets --all-features -- -D warnings"
            # -D warnings = clippy treats every warning as an error. Matches
            # the leartech-rust-common gate; services should be just as strict.
            cargo clippy --all-targets --all-features --locked -- -D warnings

            echo "==> lint complete"
            ) > /workspace/.rust-lint.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.rust-lint.log
            printf '%s\n' "$rc" > /workspace/.rust-lint.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.43.12
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            [ -f /workspace/.rust-lint.rc ] && rc=$(cat /workspace/.rust-lint.rc)
            if [ "$rc" -eq 0 ]; then
              echo "==> lint passed; nothing to report"
              exit 0
            fi
            gate=$(grep -oE "==> (cargo fmt|cargo clippy)" /workspace/.rust-lint.log | tail -n 1)
            gate=${gate#==> }
            gate=${gate:-unknown}
            {
              printf '### :x: Lint: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:?}"
              printf 'Failed at `%s` (exit %s).\n\n' "$gate" "$rc"
              printf '```\n'
              if [ "$gate" = "cargo fmt" ]; then
                grep -E "^Diff in|^error" /workspace/.rust-lint.log | head -n 20 || true
              else
                grep -E "^(error|warning)(\[|:)" /workspace/.rust-lint.log | head -n 25 || true
              fi
              printf '%s\n' '---'
              tail -n 25 /workspace/.rust-lint.log
              printf '```\n'
            } > /tmp/body.md
            prpost -tool rust-lint -check rust-lint -outcome failure \
              -cluster "${CLUSTER_ID:?}" -summary "$gate exited $rc" \
              -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
