# end2end presubmit — exercises the live preview deploy of a PR.
#
# ── CONTRACT FOR CONSUMERS ────────────────────────────────────────────
#
# Missing: if the consumer repo has no executable end2end/run.sh, this
# task posts a friendly "not configured" sticky comment and passes.
# Adoption is opt-in per repo.
#
# Present: the task exports the env below, waits up to 10 min (or
# END2END_HEALTH_TIMEOUT seconds) for the preview to respond 200 on
# /health/live, invokes bash end2end/run.sh,
# then reads end2end/results.json and posts a sticky comment. The
# check PASSES iff results.json.success == true. Non-zero exit from
# run.sh without a valid results.json is treated as a script crash
# (check fails, sticky comment flags the crash).
#
# ── ENV AVAILABLE TO end2end/run.sh ────────────────────────────────────
#
#   PREVIEW_URL         https://<APP_NAME>-pr-<PULL_NUMBER>.jx.leartech.com
#   PREVIEW_HOST_BASE   pr-<PULL_NUMBER>.jx.leartech.com
#                       (suffix shared by all preview hostnames — useful
#                       for multi-subdomain stacks like auth-ui + auth-api
#                       + hydra; see leartech-auth-ui for an example)
#   PREVIEW_NAMESPACE   jx-<REPO_OWNER>-<APP_NAME>-pr-<PULL_NUMBER>
#   APP_NAME            service repo name
#   PULL_NUMBER         PR number on GitHub
#   REPO_OWNER          e.g. mikelear
#   REPO_NAME           same as APP_NAME for now
#   CLUSTER_ID          gcp | azure (from jx-cluster-config ConfigMap)
#   VERSION             0.0.0-PR-<N>-<ITER>-SNAPSHOT
#   GIT_TOKEN           tekton-bot GitHub token — use CAREFULLY, this
#                       writes as tekton-bot. Prefer read-only usage.
#
# Standard debian-slim packages are pre-installed (jq, curl, bash,
# python3, openssl) so scripts can call them without apk/apt-get.
#
# ── end2end/results.json SCHEMA ────────────────────────────────────────
#
#   {
#     "success": true,                      // overall pass/fail
#     "summary": "3/3 checks passed",       // 1-line human-readable
#     "tests": [
#       { "name": "health-live",            // short identifier
#         "status": "pass",                 // pass | fail | skip
#         "duration_ms": 127,
#         "message": "HTTP 200" }           // short context or tail
#     ],
#     "metadata": {
#       "preview_url": "https://...",       // echoed for convenience
#       "version":     "0.0.0-PR-4-1-SNAPSHOT",
#       "doc": "### How audience binding behaves\n| req | result |\n..."
#                                           // OPTIONAL markdown. Rendered into
#                                           // the PR comment under a collapsed
#                                           // "What this run measured" block.
#                                           // For stating the behaviour the run
#                                           // just measured, so the explanation
#                                           // cannot drift from the assertions.
#     }
#   }
#
# The task does not second-guess the shape beyond these fields. If you
# need richer data (screenshots, traces, perf numbers) add them under
# metadata or extend tests[].
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: end2end
spec:
  pipelineSpec:
    tasks:
    - name: end2end
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        volumes:
        - name: gcs-key
          secret:
            secretName: test-artifacts-gcs-key
            optional: true
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: ghcr.io/jenkins-x/jx-boot:3.16.59
          name: jx-variables
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx gitops variables
        - image: debian:12-slim
          name: end2end
          resources: {}
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
          volumeMounts:
          - name: gcs-key
            mountPath: /var/run/secrets/test-artifacts
            readOnly: true
          script: |
            #!/bin/bash
            set -eo pipefail

            # Tools the contract guarantees to consumer scripts.
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              ca-certificates curl jq bash python3 python3-pip openssl >/dev/null
            # kubectl for scripts that need cluster-internal access (e.g. Hydra admin, Mongo seed)
            curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
            chmod +x /usr/local/bin/kubectl

            source .jx/variables.sh

            # DOMAIN from .jx/variables.sh — cluster-specific.
            # namespaceSubDomain is "-prN." (no hyphen — mqube pattern).
            export PREVIEW_HOST_BASE="pr${PULL_NUMBER}.${DOMAIN}"
            # Ingress prefix defaults to APP_NAME — matches the pattern
            # used by leartech-angular-service-template +
            # leartech-go-service-template. Consumers with shortened
            # subdomains (e.g. leartech-auth-ui ingress is
            # auth-ui-pr-N.jx.leartech.com not leartech-auth-ui-pr-N)
            # override via stepTemplate.env.PREVIEW_HOST_PREFIX in their
            # .lighthouse/jenkins-x/end2end.yaml.
            : "${PREVIEW_HOST_PREFIX:=${APP_NAME}}"
            export PREVIEW_URL="https://${PREVIEW_HOST_PREFIX}-${PREVIEW_HOST_BASE}"
            export PREVIEW_NAMESPACE="jx-${REPO_OWNER}-${APP_NAME}-pr-${PULL_NUMBER}"

            echo "==> consumer env:"
            echo "    PREVIEW_URL=$PREVIEW_URL"
            echo "    PREVIEW_HOST_BASE=$PREVIEW_HOST_BASE"
            echo "    PREVIEW_NAMESPACE=$PREVIEW_NAMESPACE"
            echo "    APP_NAME=$APP_NAME  PULL_NUMBER=$PULL_NUMBER  CLUSTER_ID=${CLUSTER_ID:-}"

            # ── consumer-script resolution ─────────────────────────────
            HAS_SCRIPT=0
            [ -x end2end/run.sh ] && HAS_SCRIPT=1

            # A repo with no end2end must SAY SO. end2end/NONE holds the reason.
            HAS_OPTOUT=0
            OPTOUT_REASON=""
            if [ -f end2end/NONE ]; then
              OPTOUT_REASON=$(grep -vE '^\s*(#|$)' end2end/NONE | head -3 | tr '\n' ' ' | sed 's/  */ /g')
              [ -n "$OPTOUT_REASON" ] && HAS_OPTOUT=1
            fi

            # Per-cluster sticky marker so GCP and Azure comments coexist
            # instead of clobbering each other (mirrors the security-scan
            # + ai-review conventions).
            CLUSTER_TAG="${CLUSTER_ID:-unknown}"
            MARKER="<!-- leartech-end2end-${CLUSTER_TAG} -->"

            # ── helper: post/patch sticky comment ──────────────────────
            post_sticky_once() {
              local body="$1"
              # ?per_page=100 so the marker search sees older comments on
              # long-lived PRs. Without it GitHub defaults to 30 and the
              # sticky-patch lookup misses — duplicate comments posted.
              local api="https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${PULL_NUMBER}/comments?per_page=100"
              local auth="Authorization: token ${GIT_TOKEN}"
              local accept="Accept: application/vnd.github+json"
              local existing_id
              existing_id=$(curl -fsSL -H "$auth" -H "$accept" "$api" \
                | jq -r --arg marker "$MARKER" '.[] | select(.body | startswith($marker)) | .id' \
                | head -1)
              local payload
              payload=$(jq -cn --arg body "$body" '{body: $body}')
              if [ -n "$existing_id" ]; then
                echo "==> updating existing end2end [$CLUSTER_TAG] comment $existing_id"
                curl -fsSL -X PATCH -H "$auth" -H "$accept" -d "$payload" \
                  "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/comments/${existing_id}" >/dev/null
              else
                echo "==> posting new end2end [$CLUSTER_TAG] comment"
                curl -fsSL -X POST -H "$auth" -H "$accept" -d "$payload" "$api" >/dev/null
              fi
            }

            # A PR comment is a notification, not a verdict. Delivery failure must
            # never decide this check: az/end2end went red on 2026-08-17 because a
            # "not configured" note hit HTTP 503 while the step had nothing to test.
            post_sticky() {
              local body="$1"
              if [ -z "${GIT_TOKEN:-}" ] || [ -z "${PULL_NUMBER:-}" ]; then
                echo "==> GIT_TOKEN or PULL_NUMBER unset; skipping PR comment"
                return 0
              fi
              local attempt
              for attempt in 1 2 3; do
                if post_sticky_once "$body"; then
                  return 0
                fi
                echo "==> comment delivery attempt $attempt failed; retrying in $((attempt * 5))s"
                sleep $((attempt * 5))
              done
              echo "==> WARNING: could not deliver the end2end [$CLUSTER_TAG] comment after 3 attempts."
              echo "==> Continuing anyway: this check's result is decided by the test outcome, not by comment delivery."
              return 0
            }

            # ── branch 1: no end2end/run.sh ─────────────────────────────
            #
            # This used to print "PASS: no end2end configured" and exit 0, so a
            # repo with NO tests reported a green tick indistinguishable from a
            # repo whose whole suite passed. That is the same defect that cost
            # four days on 2026-09-12, when five services showed
            # Arrival.phase=Failed with tests=[] and the empty list was read as
            # "the packs produced nothing" rather than "nothing ran".
            #
            # A check that cannot fail is not coverage. So absence is now a
            # DECISION the repo has to record, exactly as .authprofile makes a
            # service state its auth type rather than being inferred:
            #
            #   end2end/run.sh   -> run it (below)
            #   end2end/NONE     -> skip, loudly, quoting the declared reason
            #   neither          -> FAIL
            #
            # The opt-out is deliberately a file with a reason in it and not a
            # bare flag. "optional: true" and "auth.enabled: false" were the
            # same shape and both hid real gaps; a reason has to be written by
            # someone and can be argued with in review.
            if [ "$HAS_SCRIPT" = "0" ] && [ "$HAS_OPTOUT" = "1" ]; then
              echo "==> no end2end/run.sh; end2end/NONE declares: $OPTOUT_REASON"
              body=$(printf '%s\n' \
                "$MARKER" \
                ":fast_forward: **End-to-end: SKIPPED (declared)** \`[$CLUSTER_TAG]\`" \
                "" \
                "This repo declares it has no end2end suite, in \`end2end/NONE\`:" \
                "" \
                "> $OPTOUT_REASON" \
                "" \
                "**Nothing was tested against the preview deploy.** This check is green because the" \
                "absence is declared, not because anything passed. Delete \`end2end/NONE\` and add an" \
                "executable \`end2end/run.sh\` to change that." \
                "" \
                "Contract: \`tasks/end2end/pullrequest.yaml\` in \`leartech-pipeline-catalog\`." \
                "" \
                "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
              post_sticky "$body"
              echo "SKIPPED: no end2end suite, declared in end2end/NONE — nothing was tested"
              exit 0
            fi

            if [ "$HAS_SCRIPT" = "0" ]; then
              echo "==> no executable end2end/run.sh and no end2end/NONE declaration"
              body=$(printf '%s\n' \
                "$MARKER" \
                ":x: **End-to-end: undeclared** \`[$CLUSTER_TAG]\`" \
                "" \
                "This repo has neither an executable \`end2end/run.sh\` nor an \`end2end/NONE\` declaration," \
                "so nothing ran against the preview deploy and nothing says that was intended." \
                "" \
                "Pick one:" \
                "" \
                "* add \`end2end/run.sh\` (\`chmod +x\`) — it runs against the live preview, with" \
                "  \`PREVIEW_URL\` and \`PREVIEW_NAMESPACE\` in the environment;" \
                "* or add \`end2end/NONE\` containing one line saying why this service has no" \
                "  end2end suite. That keeps the check green while making the gap visible in the" \
                "  repo and in this comment, instead of looking like a pass." \
                "" \
                "This used to report \`PASS: no end2end configured\`, which made \"no tests\" and" \
                "\"all tests passed\" the same green tick." \
                "" \
                "Contract: \`tasks/end2end/pullrequest.yaml\` in \`leartech-pipeline-catalog\`." \
                "" \
                "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
              post_sticky "$body"
              echo "FAIL: no end2end/run.sh and no end2end/NONE declaration" >&2
              exit 1
            fi

            # ── branch 2: wait for preview ─────────────────────────────
            MAX_WAIT="${END2END_HEALTH_TIMEOUT:-600}"
            # Candidate health paths, tried in order until one answers 200.
            #
            # This was a single default of /health/live, and three services do
            # not serve it: maestro registers GET "" on /health, mcp-servers
            # serves /healthz. Both reported
            #   FAIL: preview never reached stable ready state
            # while every pod was Running and their helm releases were
            # deployed — a healthy preview declared dead by a probe looking in
            # the wrong place, and the message blamed the deploy.
            #
            # END2END_HEALTH_PATH still wins when set, so a service with an
            # unusual path can be explicit. When unset, the probe discovers the
            # path instead of assuming it.
            HEALTH_CANDIDATES="${END2END_HEALTH_PATH:-/health/live /health/ready /health /healthz}"
            DEADLINE=$(( $(date +%s) + MAX_WAIT ))

            # Try preview-gate first (deployed as part of preview helmfile).
            # The gate checks ALL deployments, pod stability, version match,
            # and custom health probes. A single 200 = everything ready.
            #
            # Detection window: how long we wait for the preview-gate Service
            # to become reachable before giving up and using the weaker
            # direct-health-probe fallback. A brand-new preview namespace
            # needs Helm install + chart deps + Deployment + Pod schedule +
            # image pull (if not cached) + container start + Service
            # endpoint population — easily 90-180s under cluster load.
            # 180s default covers most cold starts without burning pipeline
            # time when the gate is genuinely absent. Override via env
            # GATE_DETECT_TIMEOUT (in seconds) per consumer if needed.
            GATE_DETECT_TIMEOUT="${GATE_DETECT_TIMEOUT:-180}"
            GATE_URL="http://preview-gate.${PREVIEW_NAMESPACE}.svc.cluster.local:8090/cgi-bin/gate"
            USE_GATE=false
            GATE_DETECT_DEADLINE=$(( $(date +%s) + GATE_DETECT_TIMEOUT ))
            echo "==> looking for preview-gate at $GATE_URL (up to ${GATE_DETECT_TIMEOUT}s)"
            while [ "$(date +%s)" -lt "$GATE_DETECT_DEADLINE" ]; do
              if curl -sSf -o /dev/null -m 3 "$GATE_URL" 2>/dev/null || \
                 curl -sS -o /dev/null -w '%{http_code}' -m 3 "$GATE_URL" 2>/dev/null | grep -q "503"; then
                USE_GATE=true
                echo "==> preview-gate detected — using gate for readiness"
                break
              fi
              sleep 5
            done
            if [ "$USE_GATE" = "false" ]; then
              echo "==> preview-gate not found after ${GATE_DETECT_TIMEOUT}s — falling back to direct health probe"
            fi

            if [ "$USE_GATE" = "true" ]; then
              echo "==> waiting up to $((MAX_WAIT / 60)) min for gate to report ready"
              while true; do
                if curl -sSf -o /dev/null -m 5 "$GATE_URL" 2>/dev/null; then
                  echo "==> gate reports READY"
                  # Show gate detail for the PR comment
                  curl -sS -m 5 "$GATE_URL" 2>/dev/null | jq . || true
                  break
                fi
                if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                  echo "==> gate detail at timeout:"
                  curl -sS -m 5 "$GATE_URL" 2>/dev/null || true
                  body=$(printf '%s\n' \
                    "$MARKER" \
                    ":x: **End-to-end: FAIL (preview gate timeout)** \`[$CLUSTER_TAG]\`" \
                    "" \
                    "preview-gate never reported ready within $((MAX_WAIT / 60)) min." \
                    "Gate detail: \`$(curl -sS -m 5 "$GATE_URL" 2>/dev/null || echo 'unreachable')\`" \
                    "" \
                    "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
                  post_sticky "$body"
                  echo "FAIL: preview gate timeout"
                  exit 1
                fi
                sleep 5
              done
            else
              # Fallback: direct health probe (3 consecutive 200s)
              # ASK KUBERNETES. The chart already declares the health path as
              # the Deployment's readiness probe, and that is the path K8s
              # itself uses to decide the pod is serving — so it is the only
              # authoritative answer, and guessing beside it is how a healthy
              # preview came to be reported as dead.
              #
              # Verified on the three services that failed: maestro's chart
              # sets probePath /health, mcp-servers sets /healthz, and both
              # match the routes their code registers. The charts were right
              # the whole time; this task was not reading them.
              HEALTH_PATH=""
              if command -v kubectl >/dev/null 2>&1 && [ -n "${PREVIEW_NAMESPACE:-}" ]; then
                # Must be the Deployment for the SERVICE UNDER TEST, not the
                # first one in the namespace. A preview also contains its
                # infrastructure: leartech-preview-infrastructure's hydra
                # Deployment probes /health/alive, and taking items[0] picked
                # THAT — so the probe would have used Hydra's path against the
                # service's URL and 404'd, reproducing the very failure this
                # change fixes, but confidently.
                HEALTH_PATH=$(kubectl -n "$PREVIEW_NAMESPACE" get deploy \
                  -o jsonpath="{range .items[?(@.metadata.name==\"$APP_NAME\")]}{.spec.template.spec.containers[0].readinessProbe.httpGet.path}{\"\n\"}{end}" \
                  2>/dev/null | grep -v '^$' | head -1 || true)
                if [ -z "$HEALTH_PATH" ]; then
                  # Release-qualified name (helm prefixes the release), so match
                  # on the app label instead of an exact name.
                  HEALTH_PATH=$(kubectl -n "$PREVIEW_NAMESPACE" get deploy \
                    -l "app.kubernetes.io/name=$APP_NAME" \
                    -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].readinessProbe.httpGet.path}{"\n"}{end}' \
                    2>/dev/null | grep -v '^$' | head -1 || true)
                fi
                if [ -z "$HEALTH_PATH" ]; then
                  # Last resort before candidates: the deployment whose NAME
                  # contains the app name. Helm prefixes the release, so this is
                  # usually the tier that hits. Still scoped to the service —
                  # never to whatever sorts first.
                  dep=$(kubectl -n "$PREVIEW_NAMESPACE" get deploy -o name 2>/dev/null \
                        | grep -- "$APP_NAME" | head -1 || true)
                  if [ -n "$dep" ]; then
                    HEALTH_PATH=$(kubectl -n "$PREVIEW_NAMESPACE" get "$dep" \
                      -o jsonpath='{.spec.template.spec.containers[0].readinessProbe.httpGet.path}' \
                      2>/dev/null || true)
                  fi
                fi
                if [ -n "$HEALTH_PATH" ]; then
                  echo "==> health path from the deployed readinessProbe: $HEALTH_PATH"
                else
                  echo "==> no readinessProbe path readable in $PREVIEW_NAMESPACE; falling back to candidates"
                fi
              fi

              # Fallback only. A service with no readiness probe, or a
              # namespace this task cannot read, still gets a probe rather
              # than an immediate failure.
              RESOLVE_DEADLINE=$(( $(date +%s) + 120 ))
              while [ -z "$HEALTH_PATH" ] && [ "$(date +%s)" -lt "$RESOLVE_DEADLINE" ]; do
                for cand in $HEALTH_CANDIDATES; do
                  if curl -sSf -o /dev/null -m 5 "$PREVIEW_URL$cand" 2>/dev/null; then
                    HEALTH_PATH="$cand"
                    echo "==> health path resolved: $HEALTH_PATH"
                    break
                  fi
                done
                [ -z "$HEALTH_PATH" ] && sleep 5
              done
              if [ -z "$HEALTH_PATH" ]; then
                echo "==> no candidate health path answered 200 in 120s; tried: $HEALTH_CANDIDATES"
                echo "==> continuing with the first candidate so the wait below reports a real"
                echo "    timeout rather than a resolution failure"
                HEALTH_PATH="$(printf '%s\n' $HEALTH_CANDIDATES | head -1)"
              fi

              echo "==> waiting up to $((MAX_WAIT / 60)) min for $PREVIEW_URL$HEALTH_PATH (3 consecutive 200s)"
              STREAK=0
              REQUIRED=3
              while [ "$STREAK" -lt "$REQUIRED" ]; do
                if curl -sSf -o /dev/null -m 5 "$PREVIEW_URL$HEALTH_PATH" 2>/dev/null; then
                  STREAK=$((STREAK + 1))
                  echo "   probe $STREAK/$REQUIRED ok"
                else
                  STREAK=0
                fi
                if [ "$STREAK" -lt "$REQUIRED" ]; then
                  if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                    body=$(printf '%s\n' \
                      "$MARKER" \
                      ":x: **End-to-end: FAIL (preview not ready)** \`[$CLUSTER_TAG]\`" \
                      "" \
                      "\`$PREVIEW_URL$HEALTH_PATH\` never returned 3 consecutive 200s within $((MAX_WAIT / 60)) min." \
                      "" \
                      "Candidates tried: \`$HEALTH_CANDIDATES\`. If this service serves a different" \
                      "path, set \`END2END_HEALTH_PATH\` in its \`.lighthouse/jenkins-x/end2end.yaml\`." \
                      "" \
                      "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
                    post_sticky "$body"
                    echo "FAIL: preview never reached stable ready state"
                    exit 1
                  fi
                  sleep 5
                fi
              done
              sleep 3
            fi
            echo "==> preview stable; invoking end2end/run.sh"

            # ── branch 3: run consumer script ──────────────────────────
            SCRIPT_EXIT=0
            bash end2end/run.sh || SCRIPT_EXIT=$?
            echo "==> end2end/run.sh exited with $SCRIPT_EXIT"

            if [ ! -f end2end/results.json ]; then
              body=$(printf '%s\n' \
                "$MARKER" \
                ":x: **End-to-end: FAIL (no results.json)** \`[$CLUSTER_TAG]\`" \
                "" \
                "\`end2end/run.sh\` exited $SCRIPT_EXIT without writing \`end2end/results.json\`. See the \`end2end\` check logs for script output." \
                "" \
                "The script must emit \`end2end/results.json\` per the schema in \`tasks/end2end/pullrequest.yaml\` so the sticky PR comment can render." \
                "" \
                "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
              post_sticky "$body"
              echo "FAIL: no results.json"
              exit 1
            fi

            if ! jq -e . end2end/results.json >/dev/null 2>&1; then
              body=$(printf '%s\n' \
                "$MARKER" \
                ":x: **End-to-end: FAIL (results.json malformed)** \`[$CLUSTER_TAG]\`" \
                "" \
                "\`end2end/results.json\` is not valid JSON. See check logs." \
                "" \
                "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
              post_sticky "$body"
              echo "FAIL: results.json malformed"
              exit 1
            fi

            SUCCESS=$(jq -r '.success' end2end/results.json)
            SUMMARY=$(jq -r '.summary // "(no summary)"' end2end/results.json)

            TEST_ROWS=$(jq -r '.tests[]? |
              "| `\(.name)` | " +
              (if .status=="pass" then ":white_check_mark: pass"
               elif .status=="fail" then ":x: fail"
               else ":large_blue_circle: \(.status)" end) +
              " | \(.duration_ms // 0)ms | \(.message // "") |"' end2end/results.json)
            [ -z "$TEST_ROWS" ] && TEST_ROWS="| — | — | — | (no tests emitted) |"

            if [ "$SUCCESS" = "true" ]; then
              ICON="white_check_mark"; VERDICT="PASS"
            else
              ICON="x"; VERDICT="FAIL"
            fi

            # metadata.doc — OPTIONAL markdown the suite emits for humans.
            #
            # A pass/fail table says a property held; it does not say what the
            # property IS. For auth especially the useful artefact is the measured
            # behaviour itself — which audience requests are refused, which come
            # back silently empty, what a scope does and does not gate — written
            # where someone opening the PR will read it, by the same run that just
            # proved it.
            #
            # Emitted rather than hand-written so it cannot drift: if the behaviour
            # changes the suite fails, and whatever it prints next describes the new
            # behaviour.
            DOC=$(jq -r '.metadata.doc // empty' end2end/results.json 2>/dev/null || true)
            if [ -n "$DOC" ]; then
              DOC_BLOCK=$(printf '%s\n' "" "<details><summary>What this run measured</summary>" "" "$DOC" "" "</details>")
            else
              DOC_BLOCK=""
            fi

            body=$(printf '%s\n' \
              "$MARKER" \
              ":${ICON}: **End-to-end: ${VERDICT}** \`[$CLUSTER_TAG]\` — ${SUMMARY}" \
              "" \
              "Preview: ${PREVIEW_URL}" \
              "" \
              "| Test | Status | Duration | Message |" \
              "|---|---|---|---|" \
              "${TEST_ROWS}" \
              "${DOC_BLOCK}" \
              "" \
              "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
            post_sticky "$body"

            if [ "$SUCCESS" != "true" ]; then
              echo "FAIL: end2end results.success != true"
              exit 1
            fi
            echo "PASS: end2end complete"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
