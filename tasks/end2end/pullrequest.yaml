# end2end presubmit — exercises the live preview deploy of a PR.
#
# ── CONTRACT FOR CONSUMERS ────────────────────────────────────────────
#
# Missing: if the consumer repo has no executable end2end/run.sh, this
# task posts a friendly "not configured" sticky comment and passes.
# Adoption is opt-in per repo.
#
# Present: the task exports the env below, waits up to 10 min (or
# END2END_HEALTH_TIMEOUT seconds) for the preview to respond 200 on
# /health/live, invokes bash end2end/run.sh,
# then reads end2end/results.json and posts a sticky comment. The
# check PASSES iff results.json.success == true. Non-zero exit from
# run.sh without a valid results.json is treated as a script crash
# (check fails, sticky comment flags the crash).
#
# ── ENV AVAILABLE TO end2end/run.sh ────────────────────────────────────
#
#   PREVIEW_URL         https://<APP_NAME>-pr-<PULL_NUMBER>.jx.leartech.com
#                       Through the ingress. Use it for checks that are ABOUT
#                       the public path - TLS, redirects, a UI a browser loads.
#   PREVIEW_SERVICE_URL http://<svc>.<PREVIEW_NAMESPACE>.svc.cluster.local:<port>
#                       The app's own Service. Prefer this for everything else:
#                       no DNS, no certificate and no Ingress object have to be
#                       right for it to work, and a 404 from it is the app's
#                       404 rather than an ingress default backend's. Empty
#                       when no Service matching APP_NAME exists, which is
#                       itself worth noticing.
#   PREVIEW_HOST_BASE   pr-<PULL_NUMBER>.jx.leartech.com
#                       (suffix shared by all preview hostnames — useful
#                       for multi-subdomain stacks like auth-ui + auth-api
#                       + hydra; see leartech-auth-ui for an example)
#   PREVIEW_NAMESPACE   jx-<REPO_OWNER>-<APP_NAME>-pr-<PULL_NUMBER>
#   APP_NAME            service repo name
#   PULL_NUMBER         PR number on GitHub
#   REPO_OWNER          e.g. mikelear
#   REPO_NAME           same as APP_NAME for now
#   CLUSTER_ID          gcp | azure (from jx-cluster-config ConfigMap)
#   VERSION             0.0.0-PR-<N>-<ITER>-SNAPSHOT
#   GIT_TOKEN           tekton-bot GitHub token — use CAREFULLY, this
#                       writes as tekton-bot. Prefer read-only usage.
#
# Standard debian-slim packages are pre-installed (jq, curl, bash,
# python3, openssl) so scripts can call them without apk/apt-get.
#
#   $AUTHTOKEN          path to the Go JWT/JSON reader built for this run:
#                         "$AUTHTOKEN" field access_token   < token response
#                         "$AUTHTOKEN" claim scp            < a JWT
#                       Source of truth is go/authtoken/main.go in
#                       leartech-pipeline-catalog, with unit tests for the
#                       case that matters: an unreadable token does not read
#                       as a token with no scopes. python3 remains only until
#                       the last consumer script stops using it.
#
# ── end2end/results.json SCHEMA ────────────────────────────────────────
#
#   {
#     "success": true,                      // overall pass/fail
#     "summary": "3/3 checks passed",       // 1-line human-readable
#     "tests": [
#       { "name": "health-live",            // short identifier
#         "status": "pass",                 // pass | fail | skip
#         "duration_ms": 127,
#         "message": "HTTP 200" }           // short context or tail
#     ],
#     "metadata": {
#       "preview_url": "https://...",       // echoed for convenience
#       "version":     "0.0.0-PR-4-1-SNAPSHOT",
#       "doc": "### How audience binding behaves\n| req | result |\n..."
#                                           // OPTIONAL markdown. Rendered into
#                                           // the PR comment under a collapsed
#                                           // "What this run measured" block.
#                                           // For stating the behaviour the run
#                                           // just measured, so the explanation
#                                           // cannot drift from the assertions.
#     }
#   }
#
# The task does not second-guess the shape beyond these fields. If you
# need richer data (screenshots, traces, perf numbers) add them under
# metadata or extend tests[].
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: end2end
spec:
  pipelineSpec:
    tasks:
    - name: end2end
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        volumes:
        - name: gcs-key
          secret:
            secretName: test-artifacts-gcs-key
            optional: true
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: ghcr.io/jenkins-x/jx-boot:3.16.59
          name: jx-variables
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx gitops variables
        # authtoken: the JWT/JSON reader the auth suites use. Inlined rather
        # than fetched, so an end2end run does not depend on
        # raw.githubusercontent being up -- GitHub had a critical incident
        # yesterday -- and byte-identical to go/authtoken/main.go in this repo.
        # go/authtoken/inlined_test.go fails if the two drift, because a stale
        # copy here would be a tool that passes its own unit tests and behaves
        # differently in the pipeline.
        #
        # It replaces inline python3 in five scripts across four repos, each
        # carrying its own copy of "base64url-decode segment 2 and read scp".
        # Differentially checked against that python on real tokens from a
        # preview Hydra -- read scope, write scope, omitted scope (scp: []) and
        # a refused scope -- identical output on all four.
        - image: golang:1.26
          name: authtoken-build
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            work=$(mktemp -d)
            printf 'module authtoken\n\ngo 1.26\n' > "$work/go.mod"
            cat > "$work/main.go" <<'AUTHTOKEN_GO'
            // authtoken reads an OAuth2 token response or a JWT and prints one field of
            // it, so end2end scripts can assert on tokens without a JSON parser.
            //
            // WHY THIS EXISTS. Five end2end scripts across four repos decoded JWTs with
            // inline python3:
            //
            //	printf '%s' "$1" | python3 -c '
            //	import sys, json, base64
            //	t = sys.stdin.read().strip()
            //	if t.count(".") < 2: print(""); raise SystemExit
            //	p = t.split(".")[1]; p += "=" * (-len(p) % 4)
            //	s = json.loads(base64.urlsafe_b64decode(p)).get("scp", [])
            //	print(" ".join([s] if isinstance(s, str) else s))'
            //
            // That put a Python dependency in the path of every auth assertion this
            // estate makes, in a Go shop, and made the end2end step apt-get install
            // python3 before it could assert anything.
            //
            // Two subcommands, both reading stdin:
            //
            //	authtoken field access_token   # from a token response JSON
            //	authtoken claim scp            # from a JWT
            //	authtoken payload              # a JWT's whole payload, as JSON
            //	authtoken forge                # claims JSON in, an unverifiable JWT out
            //	authtoken count                # how many entries a JSON array has
            //	authtoken pick users email=x id  # one object's field, found by another
            //	authtoken urldecode            # form-encoded text in, plain text out
            //
            // A claim that is a JSON array prints space-separated, a string prints as
            // is, and anything absent prints nothing — matching what the shell callers
            // already compare against.
            package main

            import (
            	"crypto/hmac"
            	"crypto/rand"
            	"crypto/sha256"
            	"encoding/base64"
            	"encoding/json"
            	"fmt"
            	"io"
            	"net/url"
            	"os"
            	"strconv"
            	"strings"
            )

            func main() {
            	if len(os.Args) < 2 || len(os.Args) > 5 {
            		fmt.Fprintln(os.Stderr, "usage: authtoken field <name> | claim <name> | payload | forge | "+
            			"count | pick <array> <key>=<value> <field> | urldecode  (reads stdin)")
            		os.Exit(2)
            	}
            	in, err := io.ReadAll(os.Stdin)
            	if err != nil {
            		fmt.Fprintf(os.Stderr, "authtoken: reading stdin: %v\n", err)
            		os.Exit(1)
            	}

            	var out string
            	switch os.Args[1] {
            	case "field":
            		out, err = field(in, arg(2))
            	case "claim":
            		out, err = claim(in, arg(2))
            	case "payload":
            		out, err = payload(in)
            	case "forge":
            		out, err = forge(in)
            	case "count":
            		out, err = count(in)
            	case "pick":
            		out, err = pick(in, arg(2), arg(3), arg(4))
            	case "urldecode":
            		out, err = urldecode(in)
            	default:
            		fmt.Fprintf(os.Stderr, "authtoken: unknown subcommand %q\n", os.Args[1])
            		os.Exit(2)
            	}
            	if err != nil {
            		// Print nothing on stdout and say why on stderr. The callers treat an
            		// empty result as "not present", and their anchors abort on it -- so a
            		// malformed token must not look like a token with no scopes, but it
            		// must also not crash a suite mid-assertion.
            		fmt.Fprintf(os.Stderr, "authtoken: %v\n", err)
            		fmt.Print("")
            		os.Exit(0)
            	}
            	fmt.Println(out)
            }

            // field returns a top-level string field of a JSON object.
            func field(in []byte, name string) (string, error) {
            	var m map[string]any
            	if err := json.Unmarshal(in, &m); err != nil {
            		return "", fmt.Errorf("input is not JSON: %w", err)
            	}
            	v, ok := m[name]
            	if !ok {
            		return "", nil
            	}
            	s, ok := v.(string)
            	if !ok {
            		return "", fmt.Errorf("field %q is %T, not a string", name, v)
            	}
            	return s, nil
            }

            // claim returns one claim from a JWT's payload. The signature is not checked:
            // what these scripts assert is what the issuer put in the token, and the
            // resource server under test is the thing that verifies it.
            func claim(in []byte, name string) (string, error) {
            	b, err := decodePayload(in)
            	if err != nil {
            		return "", err
            	}
            	var m map[string]any
            	if err := json.Unmarshal(b, &m); err != nil {
            		return "", fmt.Errorf("payload is not JSON: %w", err)
            	}
            	switch v := m[name].(type) {
            	case nil:
            		return "", nil
            	case string:
            		return v, nil
            	case []any:
            		var ss []string
            		for _, e := range v {
            			ss = append(ss, fmt.Sprint(e))
            		}
            		return strings.Join(ss, " "), nil
            	default:
            		return fmt.Sprint(v), nil
            	}
            }

            func arg(i int) string {
            	if len(os.Args) > i {
            		return os.Args[i]
            	}
            	fmt.Fprintf(os.Stderr, "authtoken: %s needs a name\n", os.Args[1])
            	os.Exit(2)
            	return ""
            }

            // payload returns a JWT's payload as compact JSON, for callers that want to
            // read several claims from one decode.
            func payload(in []byte) (string, error) {
            	b, err := decodePayload(in)
            	if err != nil {
            		return "", err
            	}
            	var m map[string]any
            	if err := json.Unmarshal(b, &m); err != nil {
            		return "", fmt.Errorf("payload is not JSON: %w", err)
            	}
            	out, err := json.Marshal(m)
            	return string(out), err
            }

            // forge reads a claims object and returns a syntactically valid JWT that no
            // issuer can have signed: HS256 over a key from crypto/rand, discarded
            // immediately. Nothing in the estate holds that key, so the signature cannot
            // verify however correct the claims look -- which is the point. A suite needs
            // this to show that a resource server checks signatures rather than merely
            // parsing tokens, and "reject this" is only meaningful if the rejection
            // cannot be about the claims.
            //
            // The key is never printed. A forged token that could be verified by anything
            // would be a credential, not a fixture.
            func forge(in []byte) (string, error) {
            	var claims map[string]any
            	if err := json.Unmarshal(in, &claims); err != nil {
            		return "", fmt.Errorf("claims input is not JSON: %w", err)
            	}
            	if len(claims) == 0 {
            		return "", fmt.Errorf("no claims given; a forged token with an empty payload " +
            			"would be rejected for its claims rather than its signature")
            	}
            	hdr, err := json.Marshal(map[string]any{"alg": "HS256", "typ": "JWT", "kid": "forged"})
            	if err != nil {
            		return "", err
            	}
            	body, err := json.Marshal(claims)
            	if err != nil {
            		return "", err
            	}
            	enc := base64.RawURLEncoding
            	signing := enc.EncodeToString(hdr) + "." + enc.EncodeToString(body)

            	key := make([]byte, 32)
            	if _, err := rand.Read(key); err != nil {
            		return "", fmt.Errorf("generating a throwaway key: %w", err)
            	}
            	mac := hmac.New(sha256.New, key)
            	mac.Write([]byte(signing))
            	return signing + "." + enc.EncodeToString(mac.Sum(nil)), nil
            }

            // decodePayload returns the raw bytes of a JWT's payload segment, so claim
            // and payload cannot disagree about what a token says.
            func decodePayload(in []byte) ([]byte, error) {
            	parts := strings.Split(strings.TrimSpace(string(in)), ".")
            	if len(parts) < 3 {
            		return nil, fmt.Errorf("input has %d segment(s), so it is not a JWT", len(parts))
            	}
            	if b, err := base64.RawURLEncoding.DecodeString(parts[1]); err == nil {
            		return b, nil
            	}
            	// Some issuers pad; RawURLEncoding does not accept padding.
            	b, err := base64.URLEncoding.DecodeString(parts[1] + strings.Repeat("=", (4-len(parts[1])%4)%4))
            	if err != nil {
            		return nil, fmt.Errorf("payload is not base64url: %w", err)
            	}
            	return b, nil
            }

            // count returns the length of a JSON array, or of the array under a single
            // top-level key. Used where a suite asserts "how many sessions/users exist"
            // and must tell an empty list from a failed request: an error here is not 0.
            func count(in []byte) (string, error) {
            	var arr []any
            	if err := json.Unmarshal(in, &arr); err == nil {
            		return strconv.Itoa(len(arr)), nil
            	}
            	var obj map[string]any
            	if err := json.Unmarshal(in, &obj); err != nil {
            		return "", fmt.Errorf("input is neither a JSON array nor an object: %w", err)
            	}
            	for _, v := range obj {
            		if a, ok := v.([]any); ok {
            			return strconv.Itoa(len(a)), nil
            		}
            	}
            	return "", fmt.Errorf("object has no array field to count")
            }

            // pick finds one object in an array and returns a field of it: the shape of
            // "the user whose email is X, give me its id".
            //
            // arrayKey is the field holding the array ("users"), or "." when the payload
            // IS the array. match is key=value. Returns empty with no error when nothing
            // matches, because absence is a legitimate answer a caller asserts on —
            // distinct from an error, which means the payload could not be read at all.
            func pick(in []byte, arrayKey, match, field string) (string, error) {
            	k, want, ok := strings.Cut(match, "=")
            	if !ok {
            		return "", fmt.Errorf("match %q is not key=value", match)
            	}

            	var items []any
            	if arrayKey == "." || arrayKey == "" {
            		if err := json.Unmarshal(in, &items); err != nil {
            			return "", fmt.Errorf("input is not a JSON array: %w", err)
            		}
            	} else {
            		var obj map[string]any
            		if err := json.Unmarshal(in, &obj); err != nil {
            			return "", fmt.Errorf("input is not a JSON object: %w", err)
            		}
            		raw, present := obj[arrayKey]
            		if !present {
            			return "", fmt.Errorf("no field %q in the payload", arrayKey)
            		}
            		items, ok = raw.([]any)
            		if !ok {
            			return "", fmt.Errorf("field %q is %T, not an array", arrayKey, raw)
            		}
            	}

            	for _, it := range items {
            		m, ok := it.(map[string]any)
            		if !ok {
            			continue
            		}
            		if fmt.Sprint(m[k]) != want {
            			continue
            		}
            		v, present := m[field]
            		if !present {
            			return "", nil
            		}
            		return fmt.Sprint(v), nil
            	}
            	return "", nil
            }

            // urldecode reverses form encoding, for reading a value back out of a
            // redirect's query string.
            func urldecode(in []byte) (string, error) {
            	s, err := url.QueryUnescape(strings.TrimSpace(string(in)))
            	if err != nil {
            		return "", fmt.Errorf("input is not form-encoded: %w", err)
            	}
            	return s, nil
            }
            AUTHTOKEN_GO
            ( cd "$work" && CGO_ENABLED=0 go vet ./... && CGO_ENABLED=0 go build -o /workspace/source/authtoken . )

            # Smoke test against a payload whose contents are known, so a build
            # that produces a broken binary fails here rather than as an
            # obscure assertion inside someone else's suite. The payload is
            # {"scp":["a","b"],"aud":"x"}.
            tok='eyJhbGciOiJub25lIn0.eyJzY3AiOlsiYSIsImIiXSwiYXVkIjoieCJ9.sig'
            got=$(printf '%s' "$tok" | /workspace/source/authtoken claim scp)
            if [ "$got" != "a b" ]; then
              echo "FAIL: authtoken claim scp returned '$got', expected 'a b'" >&2
              exit 1
            fi
            echo "==> authtoken built and self-tested (claim scp -> '$got')"

        - image: debian:12-slim
          name: end2end
          resources: {}
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
          volumeMounts:
          - name: gcs-key
            mountPath: /var/run/secrets/test-artifacts
            readOnly: true
          script: |
            #!/bin/bash
            set -eo pipefail

            # Tools the contract guarantees to consumer scripts.
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              ca-certificates curl jq bash python3 python3-pip openssl >/dev/null
            # kubectl for scripts that need cluster-internal access (e.g. Hydra admin, Mongo seed)
            curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
            chmod +x /usr/local/bin/kubectl

            source .jx/variables.sh

            # DOMAIN from .jx/variables.sh — cluster-specific.
            # namespaceSubDomain is "-prN." (no hyphen — mqube pattern).
            export PREVIEW_HOST_BASE="pr${PULL_NUMBER}.${DOMAIN}"
            # Ingress prefix defaults to APP_NAME — matches the pattern
            # used by leartech-angular-service-template +
            # leartech-go-service-template. Consumers with shortened
            # subdomains (e.g. leartech-auth-ui ingress is
            # auth-ui-pr-N.jx.leartech.com not leartech-auth-ui-pr-N)
            # override via stepTemplate.env.PREVIEW_HOST_PREFIX in their
            # .lighthouse/jenkins-x/end2end.yaml.
            : "${PREVIEW_HOST_PREFIX:=${APP_NAME}}"
            export PREVIEW_URL="https://${PREVIEW_HOST_PREFIX}-${PREVIEW_HOST_BASE}"
            export PREVIEW_NAMESPACE="jx-${REPO_OWNER}-${APP_NAME}-pr-${PULL_NUMBER}"

            # ── PREVIEW_SERVICE_URL: the app's own Service, in the cluster ──
            #
            # PREVIEW_URL goes through the ingress, which means DNS, a
            # certificate and an Ingress object all have to be right before a
            # test can say anything about the POD. Two failures today were
            # exactly that and neither named the ingress:
            #
            #   * three services were reported "never reached stable ready
            #     state" while every pod was Running, because the probe
            #     guessed a health path the ingress happened not to serve;
            #   * leartech-mcp-servers' chart ships no ingress template for its
            #     internal surface at all, so every request went to the ingress
            #     controller's default backend and came back 404 -- which its
            #     auth suite reported as "/mcps admitted an unauthenticated
            #     request (404)" while the pod was correctly answering 401.
            #
            # A 404 from a default backend is indistinguishable from a 404 from
            # the app. So the Service name is published too, and it is what
            # readiness is judged on: the question "is this pod serving" should
            # not be answered through three other components.
            #
            # PREVIEW_URL stays exported and stays the right target for a check
            # that is ABOUT the public path -- TLS, redirects, a UI a browser
            # loads. Everything else should prefer the Service.
            # Resolved AFTER the deploy, by resolve_preview_service_url below.
            #
            # Deriving it here killed every end2end run in the estate. The step
            # runs under `set -eo pipefail`, and
            #
            #   svc=$(kubectl get svc -o name | sed ... | grep -x "$APP_NAME" | head -1)
            #
            # exits 1 when grep matches nothing -- which is the normal case at
            # this point, because the preview namespace does not exist yet. The
            # step died immediately after apt-get with a single line of output
            # and no message at all.
            PREVIEW_SERVICE_URL=""
            export PREVIEW_SERVICE_URL

            # Every command here is guarded: this function may NEVER fail the
            # step. Its whole purpose is to prefer a better probe target, and
            # falling back to the public URL is a worse probe, not a failure.
            resolve_preview_service_url() {
              command -v kubectl >/dev/null 2>&1 || return 0
              local svcs svc port
              svcs=$(kubectl -n "$PREVIEW_NAMESPACE" get svc -o name 2>/dev/null | sed 's|service/||' || true)
              [ -n "$svcs" ] || return 0
              # Exact name match first, so a preview that also runs an issuer or
              # a datastore is not probed on one of those. Then a substring
              # match excluding the -public surface, which is what
              # release-prefixed Service names need.
              svc=$(printf '%s\n' "$svcs" | grep -x "$APP_NAME" | head -1 || true)
              [ -n "$svc" ] || svc=$(printf '%s\n' "$svcs" | grep -- "$APP_NAME" | grep -v -- '-public$' | head -1 || true)
              [ -n "$svc" ] || return 0
              port=$(kubectl -n "$PREVIEW_NAMESPACE" get svc "$svc" -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || true)
              [ -n "$port" ] || return 0
              PREVIEW_SERVICE_URL="http://${svc}.${PREVIEW_NAMESPACE}.svc.cluster.local:${port}"
              export PREVIEW_SERVICE_URL
            }

            echo "==> consumer env:"
            echo "    PREVIEW_URL=$PREVIEW_URL"
            echo "    PREVIEW_SERVICE_URL=<resolved after the deploy>"
            echo "    PREVIEW_HOST_BASE=$PREVIEW_HOST_BASE"
            echo "    PREVIEW_NAMESPACE=$PREVIEW_NAMESPACE"
            echo "    APP_NAME=$APP_NAME  PULL_NUMBER=$PULL_NUMBER  CLUSTER_ID=${CLUSTER_ID:-}"

            # ── consumer-script resolution ─────────────────────────────
            HAS_SCRIPT=0
            [ -x end2end/run.sh ] && HAS_SCRIPT=1

            # A repo with no end2end must SAY SO. end2end/NONE holds the reason.
            HAS_OPTOUT=0
            OPTOUT_REASON=""
            if [ -f end2end/NONE ]; then
              OPTOUT_REASON=$(grep -vE '^\s*(#|$)' end2end/NONE | head -3 | tr '\n' ' ' | sed 's/  */ /g')
              [ -n "$OPTOUT_REASON" ] && HAS_OPTOUT=1
            fi

            # Per-cluster sticky marker so GCP and Azure comments coexist
            # instead of clobbering each other (mirrors the security-scan
            # + ai-review conventions).
            CLUSTER_TAG="${CLUSTER_ID:-unknown}"
            MARKER="<!-- leartech-end2end-${CLUSTER_TAG} -->"

            # ── helper: post/patch sticky comment ──────────────────────
            post_sticky_once() {
              local body="$1"
              # ?per_page=100 so the marker search sees older comments on
              # long-lived PRs. Without it GitHub defaults to 30 and the
              # sticky-patch lookup misses — duplicate comments posted.
              local api="https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${PULL_NUMBER}/comments?per_page=100"
              local auth="Authorization: token ${GIT_TOKEN}"
              local accept="Accept: application/vnd.github+json"
              local existing_id
              existing_id=$(curl -fsSL -H "$auth" -H "$accept" "$api" \
                | jq -r --arg marker "$MARKER" '.[] | select(.body | startswith($marker)) | .id' \
                | head -1)
              local payload
              payload=$(jq -cn --arg body "$body" '{body: $body}')
              if [ -n "$existing_id" ]; then
                echo "==> updating existing end2end [$CLUSTER_TAG] comment $existing_id"
                curl -fsSL -X PATCH -H "$auth" -H "$accept" -d "$payload" \
                  "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/comments/${existing_id}" >/dev/null
              else
                echo "==> posting new end2end [$CLUSTER_TAG] comment"
                curl -fsSL -X POST -H "$auth" -H "$accept" -d "$payload" "$api" >/dev/null
              fi
            }

            # A PR comment is a notification, not a verdict. Delivery failure must
            # never decide this check: az/end2end went red on 2026-08-17 because a
            # "not configured" note hit HTTP 503 while the step had nothing to test.
            post_sticky() {
              local body="$1"
              if [ -z "${GIT_TOKEN:-}" ] || [ -z "${PULL_NUMBER:-}" ]; then
                echo "==> GIT_TOKEN or PULL_NUMBER unset; skipping PR comment"
                return 0
              fi
              local attempt
              for attempt in 1 2 3; do
                if post_sticky_once "$body"; then
                  return 0
                fi
                echo "==> comment delivery attempt $attempt failed; retrying in $((attempt * 5))s"
                sleep $((attempt * 5))
              done
              echo "==> WARNING: could not deliver the end2end [$CLUSTER_TAG] comment after 3 attempts."
              echo "==> Continuing anyway: this check's result is decided by the test outcome, not by comment delivery."
              return 0
            }

            # ── branch 1: no end2end/run.sh ─────────────────────────────
            #
            # This used to print "PASS: no end2end configured" and exit 0, so a
            # repo with NO tests reported a green tick indistinguishable from a
            # repo whose whole suite passed. That is the same defect that cost
            # four days on 2026-09-12, when five services showed
            # Arrival.phase=Failed with tests=[] and the empty list was read as
            # "the packs produced nothing" rather than "nothing ran".
            #
            # A check that cannot fail is not coverage. So absence is now a
            # DECISION the repo has to record, exactly as .authprofile makes a
            # service state its auth type rather than being inferred:
            #
            #   end2end/run.sh   -> run it (below)
            #   end2end/NONE     -> skip, loudly, quoting the declared reason
            #   neither          -> FAIL
            #
            # The opt-out is deliberately a file with a reason in it and not a
            # bare flag. "optional: true" and "auth.enabled: false" were the
            # same shape and both hid real gaps; a reason has to be written by
            # someone and can be argued with in review.
            if [ "$HAS_SCRIPT" = "0" ] && [ "$HAS_OPTOUT" = "1" ]; then
              echo "==> no end2end/run.sh; end2end/NONE declares: $OPTOUT_REASON"
              body=$(printf '%s\n' \
                "$MARKER" \
                ":fast_forward: **End-to-end: SKIPPED (declared)** \`[$CLUSTER_TAG]\`" \
                "" \
                "This repo declares it has no end2end suite, in \`end2end/NONE\`:" \
                "" \
                "> $OPTOUT_REASON" \
                "" \
                "**Nothing was tested against the preview deploy.** This check is green because the" \
                "absence is declared, not because anything passed. Delete \`end2end/NONE\` and add an" \
                "executable \`end2end/run.sh\` to change that." \
                "" \
                "Contract: \`tasks/end2end/pullrequest.yaml\` in \`leartech-pipeline-catalog\`." \
                "" \
                "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
              post_sticky "$body"
              echo "SKIPPED: no end2end suite, declared in end2end/NONE — nothing was tested"
              exit 0
            fi

            if [ "$HAS_SCRIPT" = "0" ]; then
              echo "==> no executable end2end/run.sh and no end2end/NONE declaration"
              body=$(printf '%s\n' \
                "$MARKER" \
                ":x: **End-to-end: undeclared** \`[$CLUSTER_TAG]\`" \
                "" \
                "This repo has neither an executable \`end2end/run.sh\` nor an \`end2end/NONE\` declaration," \
                "so nothing ran against the preview deploy and nothing says that was intended." \
                "" \
                "Pick one:" \
                "" \
                "* add \`end2end/run.sh\` (\`chmod +x\`) — it runs against the live preview, with" \
                "  \`PREVIEW_URL\` and \`PREVIEW_NAMESPACE\` in the environment;" \
                "* or add \`end2end/NONE\` containing one line saying why this service has no" \
                "  end2end suite. That keeps the check green while making the gap visible in the" \
                "  repo and in this comment, instead of looking like a pass." \
                "" \
                "This used to report \`PASS: no end2end configured\`, which made \"no tests\" and" \
                "\"all tests passed\" the same green tick." \
                "" \
                "Contract: \`tasks/end2end/pullrequest.yaml\` in \`leartech-pipeline-catalog\`." \
                "" \
                "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
              post_sticky "$body"
              echo "FAIL: no end2end/run.sh and no end2end/NONE declaration" >&2
              exit 1
            fi

            # ── the preview must be THIS commit ────────────────────────
            # Measured on leartech-artifact-api PR #17, 2026-09-13. This task
            # started at 10:37:49, three seconds after the `pr` pipeline that
            # deploys the preview. The pod carrying the commit under test
            # became ready at 10:42:06 — four minutes later. In between, the
            # health probe collected its three consecutive 200s from the
            # PREVIOUS build's pod (PR-17-1, running since 09:55) and the suite
            # ran against that, reporting "PER-ROUTE SCOPE ENFORCEMENT BROKEN"
            # for a gate the commit under test had already fixed. Twice, on
            # both clusters, and the run before it too.
            #
            # A health probe cannot tell a fresh pod from a stale one: both
            # answer 200. preview-gate does check version, which is why the
            # services that deploy it never hit this — but the fallback for
            # services that do not deploy it silently tests the last build.
            #
            # So ask the component that knows. The `pr` run for this commit
            # carries the same lighthouse lastCommitSHA label, and it is the
            # run that deploys, so its completion is the signal.
            if command -v kubectl >/dev/null 2>&1 && [ -n "${PULL_PULL_SHA:-}" ]; then
              SEL="lighthouse.jenkins-x.io/lastCommitSHA=${PULL_PULL_SHA},lighthouse.jenkins-x.io/context=pr"
              # Lighthouse creates both runs from one webhook event, but not
              # in a guaranteed order, so an empty first lookup means "not yet"
              # far more often than "absent". Concluding absence early would
              # take the silent path below and test the previous build, which
              # is the failure this block exists to stop.
              SIB=""
              SIB_DEADLINE=$(( $(date +%s) + ${END2END_SIBLING_DETECT:-120} ))
              while :; do
                SIB=$(kubectl -n jx get pipelineruns -l "$SEL" \
                        --sort-by=.metadata.creationTimestamp \
                        -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null || true)
                [ -n "$SIB" ] && break
                [ "$(date +%s)" -ge "$SIB_DEADLINE" ] && break
                sleep 5
              done
              if [ -z "$SIB" ]; then
                echo "==> no \`pr\` PipelineRun for ${PULL_PULL_SHA:0:8} after ${END2END_SIBLING_DETECT:-120}s."
                echo "    Nothing here deploys the preview, so this suite will run against"
                echo "    whatever is already in $PREVIEW_NAMESPACE — possibly the previous"
                echo "    build. Continuing, but a result from here is about that pod."
              else
                echo "==> waiting for the deploy of ${PULL_PULL_SHA:0:8}: pipelinerun/$SIB"
                DEPLOY_DEADLINE=$(( $(date +%s) + ${END2END_DEPLOY_TIMEOUT:-1200} ))
                while :; do
                  REASON=$(kubectl -n jx get pipelinerun "$SIB" \
                             -o jsonpath='{.status.conditions[0].reason}' 2>/dev/null || echo "")
                  case "$REASON" in
                    Succeeded|Completed)
                      echo "==> deploy run $SIB: $REASON"
                      break ;;
                    Failed|PipelineRunTimeout|CouldntGetTask|Cancelled|PipelineRunCancelled|StoppedRunFinally|CancelledRunFinally)
                      body=$(printf '%s\n' \
                        "$MARKER" \
                        ":x: **End-to-end: not run (the deploy of this commit did not finish)** \`[$CLUSTER_TAG]\`" \
                        "" \
                        "\`pipelinerun/$SIB\` — the \`pr\` run that deploys the preview for" \
                        "\`${PULL_PULL_SHA:0:8}\` — ended as **$REASON**, so the namespace holds" \
                        "either nothing or the previous build." \
                        "" \
                        "This refuses rather than probing, because a health probe cannot tell a" \
                        "fresh pod from a stale one — both answer 200. Testing the last build and" \
                        "reporting it against this commit is worse than not testing: on" \
                        "\`leartech-artifact-api\` #17 it failed a scope gate that the commit under" \
                        "test had already fixed." \
                        "" \
                        "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
                      post_sticky "$body"
                      echo "FAIL: deploy run $SIB ended as $REASON — refusing to test the previous build" >&2
                      exit 1 ;;
                  esac
                  if [ "$(date +%s)" -ge "$DEPLOY_DEADLINE" ]; then
                    echo "FAIL: deploy run $SIB still $REASON after $(( ${END2END_DEPLOY_TIMEOUT:-1200} / 60 )) min" >&2
                    exit 1
                  fi
                  sleep 10
                done

                # The deploy run is finished, so helm has applied the new spec.
                # `rollout status` is what says the OLD pods are gone: it waits
                # for updatedReplicas == replicas and the previous ReplicaSet
                # scaled to zero. Until then the Service still balances onto
                # the pod this check exists to avoid.
                for obj in $(kubectl -n "$PREVIEW_NAMESPACE" get deploy,statefulset -o name 2>/dev/null); do
                  echo "==> rollout status $obj"
                  kubectl -n "$PREVIEW_NAMESPACE" rollout status "$obj" --timeout=5m || {
                    echo "FAIL: $obj did not roll out; the preview is not serving this commit" >&2
                    exit 1
                  }
                done
              fi
            else
              echo "==> kubectl or PULL_PULL_SHA unavailable, so this run cannot confirm the"
              echo "    preview carries the commit under test. Results may describe the"
              echo "    previous build."
            fi

            # ── branch 2: wait for preview ─────────────────────────────
            MAX_WAIT="${END2END_HEALTH_TIMEOUT:-600}"
            # Candidate health paths, tried in order until one answers 200.
            #
            # This was a single default of /health/live, and three services do
            # not serve it: maestro registers GET "" on /health, mcp-servers
            # serves /healthz. Both reported
            #   FAIL: preview never reached stable ready state
            # while every pod was Running and their helm releases were
            # deployed — a healthy preview declared dead by a probe looking in
            # the wrong place, and the message blamed the deploy.
            #
            # END2END_HEALTH_PATH still wins when set, so a service with an
            # unusual path can be explicit. When unset, the probe discovers the
            # path instead of assuming it.
            HEALTH_CANDIDATES="${END2END_HEALTH_PATH:-/health/live /health/ready /health /healthz}"

            # Where readiness is measured. The Service when there is one, the
            # public URL otherwise. Resolved here rather than at env-setup time
            # because the preview namespace does not exist yet up there.
            resolve_preview_service_url
            echo "==> PREVIEW_SERVICE_URL=${PREVIEW_SERVICE_URL:-<none found>}"
            PROBE_BASE="${PREVIEW_SERVICE_URL:-$PREVIEW_URL}"
            DEADLINE=$(( $(date +%s) + MAX_WAIT ))

            # Try preview-gate first (deployed as part of preview helmfile).
            # The gate checks ALL deployments, pod stability, version match,
            # and custom health probes. A single 200 = everything ready.
            #
            # Detection window: how long we wait for the preview-gate Service
            # to become reachable before giving up and using the weaker
            # direct-health-probe fallback. A brand-new preview namespace
            # needs Helm install + chart deps + Deployment + Pod schedule +
            # image pull (if not cached) + container start + Service
            # endpoint population — easily 90-180s under cluster load.
            # 180s default covers most cold starts without burning pipeline
            # time when the gate is genuinely absent. Override via env
            # GATE_DETECT_TIMEOUT (in seconds) per consumer if needed.
            GATE_DETECT_TIMEOUT="${GATE_DETECT_TIMEOUT:-180}"
            GATE_URL="http://preview-gate.${PREVIEW_NAMESPACE}.svc.cluster.local:8090/cgi-bin/gate"
            USE_GATE=false
            GATE_DETECT_DEADLINE=$(( $(date +%s) + GATE_DETECT_TIMEOUT ))
            echo "==> looking for preview-gate at $GATE_URL (up to ${GATE_DETECT_TIMEOUT}s)"
            while [ "$(date +%s)" -lt "$GATE_DETECT_DEADLINE" ]; do
              if curl -sSf -o /dev/null -m 3 "$GATE_URL" 2>/dev/null || \
                 curl -sS -o /dev/null -w '%{http_code}' -m 3 "$GATE_URL" 2>/dev/null | grep -q "503"; then
                USE_GATE=true
                echo "==> preview-gate detected — using gate for readiness"
                break
              fi
              sleep 5
            done
            if [ "$USE_GATE" = "false" ]; then
              echo "==> preview-gate not found after ${GATE_DETECT_TIMEOUT}s — falling back to direct health probe"
            fi

            if [ "$USE_GATE" = "true" ]; then
              echo "==> waiting up to $((MAX_WAIT / 60)) min for gate to report ready"
              while true; do
                if curl -sSf -o /dev/null -m 5 "$GATE_URL" 2>/dev/null; then
                  echo "==> gate reports READY"
                  # Show gate detail for the PR comment
                  curl -sS -m 5 "$GATE_URL" 2>/dev/null | jq . || true
                  break
                fi
                if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                  echo "==> gate detail at timeout:"
                  curl -sS -m 5 "$GATE_URL" 2>/dev/null || true
                  body=$(printf '%s\n' \
                    "$MARKER" \
                    ":x: **End-to-end: FAIL (preview gate timeout)** \`[$CLUSTER_TAG]\`" \
                    "" \
                    "preview-gate never reported ready within $((MAX_WAIT / 60)) min." \
                    "Gate detail: \`$(curl -sS -m 5 "$GATE_URL" 2>/dev/null || echo 'unreachable')\`" \
                    "" \
                    "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
                  post_sticky "$body"
                  echo "FAIL: preview gate timeout"
                  exit 1
                fi
                sleep 5
              done
            else
              # Fallback: direct health probe (3 consecutive 200s)
              # ASK KUBERNETES. The chart already declares the health path as
              # the Deployment's readiness probe, and that is the path K8s
              # itself uses to decide the pod is serving — so it is the only
              # authoritative answer, and guessing beside it is how a healthy
              # preview came to be reported as dead.
              #
              # Verified on the three services that failed: maestro's chart
              # sets probePath /health, mcp-servers sets /healthz, and both
              # match the routes their code registers. The charts were right
              # the whole time; this task was not reading them.
              HEALTH_PATH=""
              if command -v kubectl >/dev/null 2>&1 && [ -n "${PREVIEW_NAMESPACE:-}" ]; then
                # Must be the Deployment for the SERVICE UNDER TEST, not the
                # first one in the namespace. A preview also contains its
                # infrastructure: leartech-preview-infrastructure's hydra
                # Deployment probes /health/alive, and taking items[0] picked
                # THAT — so the probe would have used Hydra's path against the
                # service's URL and 404'd, reproducing the very failure this
                # change fixes, but confidently.
                HEALTH_PATH=$(kubectl -n "$PREVIEW_NAMESPACE" get deploy \
                  -o jsonpath="{range .items[?(@.metadata.name==\"$APP_NAME\")]}{.spec.template.spec.containers[0].readinessProbe.httpGet.path}{\"\n\"}{end}" \
                  2>/dev/null | grep -v '^$' | head -1 || true)
                if [ -z "$HEALTH_PATH" ]; then
                  # Release-qualified name (helm prefixes the release), so match
                  # on the app label instead of an exact name.
                  HEALTH_PATH=$(kubectl -n "$PREVIEW_NAMESPACE" get deploy \
                    -l "app.kubernetes.io/name=$APP_NAME" \
                    -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].readinessProbe.httpGet.path}{"\n"}{end}' \
                    2>/dev/null | grep -v '^$' | head -1 || true)
                fi
                if [ -z "$HEALTH_PATH" ]; then
                  # Last resort before candidates: the deployment whose NAME
                  # contains the app name. Helm prefixes the release, so this is
                  # usually the tier that hits. Still scoped to the service —
                  # never to whatever sorts first.
                  dep=$(kubectl -n "$PREVIEW_NAMESPACE" get deploy -o name 2>/dev/null \
                        | grep -- "$APP_NAME" | head -1 || true)
                  if [ -n "$dep" ]; then
                    HEALTH_PATH=$(kubectl -n "$PREVIEW_NAMESPACE" get "$dep" \
                      -o jsonpath='{.spec.template.spec.containers[0].readinessProbe.httpGet.path}' \
                      2>/dev/null || true)
                  fi
                fi
                if [ -n "$HEALTH_PATH" ]; then
                  echo "==> health path from the deployed readinessProbe: $HEALTH_PATH"
                else
                  echo "==> no readinessProbe path readable in $PREVIEW_NAMESPACE; falling back to candidates"
                fi
              fi

              # Fallback only. A service with no readiness probe, or a
              # namespace this task cannot read, still gets a probe rather
              # than an immediate failure.
              RESOLVE_DEADLINE=$(( $(date +%s) + 120 ))
              while [ -z "$HEALTH_PATH" ] && [ "$(date +%s)" -lt "$RESOLVE_DEADLINE" ]; do
                for cand in $HEALTH_CANDIDATES; do
                  if curl -sSf -o /dev/null -m 5 "$PROBE_BASE$cand" 2>/dev/null; then
                    HEALTH_PATH="$cand"
                    echo "==> health path resolved: $HEALTH_PATH"
                    break
                  fi
                done
                [ -z "$HEALTH_PATH" ] && sleep 5
              done
              if [ -z "$HEALTH_PATH" ]; then
                echo "==> no candidate health path answered 200 in 120s; tried: $HEALTH_CANDIDATES"
                echo "==> continuing with the first candidate so the wait below reports a real"
                echo "    timeout rather than a resolution failure"
                HEALTH_PATH="$(printf '%s\n' $HEALTH_CANDIDATES | head -1)"
              fi

              # Judge readiness on the pod, through its Service, rather than through
              # the ingress. A 404 from an ingress default backend is indistinguishable
              # from a 404 from the app, and two failures today were exactly that.
              # If no Service was found, fall back to the public URL and SAY so: a probe
              # that silently changed target would make one green tick mean two things.
              if [ -n "${PREVIEW_SERVICE_URL:-}" ]; then
                echo "==> probing the app's Service, not the ingress"
              else
                echo "==> no Service found for $APP_NAME; falling back to the public URL."
                echo "    DNS, the certificate and the Ingress all have to be right for this"
                echo "    to say anything about the pod."
              fi
              echo "==> waiting up to $((MAX_WAIT / 60)) min for $PROBE_BASE$HEALTH_PATH (3 consecutive 200s)"
              STREAK=0
              REQUIRED=3
              while [ "$STREAK" -lt "$REQUIRED" ]; do
                if curl -sSf -o /dev/null -m 5 "$PROBE_BASE$HEALTH_PATH" 2>/dev/null; then
                  STREAK=$((STREAK + 1))
                  echo "   probe $STREAK/$REQUIRED ok"
                else
                  STREAK=0
                fi
                if [ "$STREAK" -lt "$REQUIRED" ]; then
                  if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                    body=$(printf '%s\n' \
                      "$MARKER" \
                      ":x: **End-to-end: FAIL (preview not ready)** \`[$CLUSTER_TAG]\`" \
                      "" \
                      "\`$PROBE_BASE$HEALTH_PATH\` never returned 3 consecutive 200s within $((MAX_WAIT / 60)) min." \
                      "" \
                      "Candidates tried: \`$HEALTH_CANDIDATES\`. If this service serves a different" \
                      "path, set \`END2END_HEALTH_PATH\` in its \`.lighthouse/jenkins-x/end2end.yaml\`." \
                      "" \
                      "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
                    post_sticky "$body"
                    echo "FAIL: preview never reached stable ready state"
                    exit 1
                  fi
                  sleep 5
                fi
              done
              sleep 3
            fi
            echo "==> preview stable; invoking end2end/run.sh"

            # ── branch 3: run consumer script ──────────────────────────
            # Where the Go JWT reader is. Scripts must take it from here
            # rather than guess a path: run.sh cds into end2end/, so a
            # relative path works until someone runs a check directly, and
            # then it silently is not there.
            export AUTHTOKEN=/workspace/source/authtoken
            if [ ! -x "$AUTHTOKEN" ]; then
              echo "FAIL: $AUTHTOKEN is missing or not executable." >&2
              echo "      The authtoken-build step failed or was skipped, and a suite" >&2
              echo "      that cannot read a token must not report on scopes." >&2
              exit 1
            fi

            SCRIPT_EXIT=0
            bash end2end/run.sh || SCRIPT_EXIT=$?
            echo "==> end2end/run.sh exited with $SCRIPT_EXIT"

            if [ ! -f end2end/results.json ]; then
              body=$(printf '%s\n' \
                "$MARKER" \
                ":x: **End-to-end: FAIL (no results.json)** \`[$CLUSTER_TAG]\`" \
                "" \
                "\`end2end/run.sh\` exited $SCRIPT_EXIT without writing \`end2end/results.json\`. See the \`end2end\` check logs for script output." \
                "" \
                "The script must emit \`end2end/results.json\` per the schema in \`tasks/end2end/pullrequest.yaml\` so the sticky PR comment can render." \
                "" \
                "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
              post_sticky "$body"
              echo "FAIL: no results.json"
              exit 1
            fi

            if ! jq -e . end2end/results.json >/dev/null 2>&1; then
              body=$(printf '%s\n' \
                "$MARKER" \
                ":x: **End-to-end: FAIL (results.json malformed)** \`[$CLUSTER_TAG]\`" \
                "" \
                "\`end2end/results.json\` is not valid JSON. See check logs." \
                "" \
                "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
              post_sticky "$body"
              echo "FAIL: results.json malformed"
              exit 1
            fi

            SUCCESS=$(jq -r '.success' end2end/results.json)
            SUMMARY=$(jq -r '.summary // "(no summary)"' end2end/results.json)

            TEST_ROWS=$(jq -r '.tests[]? |
              "| `\(.name)` | " +
              (if .status=="pass" then ":white_check_mark: pass"
               elif .status=="fail" then ":x: fail"
               else ":large_blue_circle: \(.status)" end) +
              " | \(.duration_ms // 0)ms | \(.message // "") |"' end2end/results.json)
            [ -z "$TEST_ROWS" ] && TEST_ROWS="| — | — | — | (no tests emitted) |"

            if [ "$SUCCESS" = "true" ]; then
              ICON="white_check_mark"; VERDICT="PASS"
            else
              ICON="x"; VERDICT="FAIL"
            fi

            # metadata.doc — OPTIONAL markdown the suite emits for humans.
            #
            # A pass/fail table says a property held; it does not say what the
            # property IS. For auth especially the useful artefact is the measured
            # behaviour itself — which audience requests are refused, which come
            # back silently empty, what a scope does and does not gate — written
            # where someone opening the PR will read it, by the same run that just
            # proved it.
            #
            # Emitted rather than hand-written so it cannot drift: if the behaviour
            # changes the suite fails, and whatever it prints next describes the new
            # behaviour.
            DOC=$(jq -r '.metadata.doc // empty' end2end/results.json 2>/dev/null || true)
            if [ -n "$DOC" ]; then
              DOC_BLOCK=$(printf '%s\n' "" "<details><summary>What this run measured</summary>" "" "$DOC" "" "</details>")
            else
              DOC_BLOCK=""
            fi

            body=$(printf '%s\n' \
              "$MARKER" \
              ":${ICON}: **End-to-end: ${VERDICT}** \`[$CLUSTER_TAG]\` — ${SUMMARY}" \
              "" \
              "Preview: ${PREVIEW_URL}" \
              "" \
              "| Test | Status | Duration | Message |" \
              "|---|---|---|---|" \
              "${TEST_ROWS}" \
              "${DOC_BLOCK}" \
              "" \
              "_Posted by \`tasks/end2end/pullrequest.yaml\`._")
            post_sticky "$body"

            if [ "$SUCCESS" != "true" ]; then
              echo "FAIL: end2end results.success != true"
              exit 1
            fi
            echo "PASS: end2end complete"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
