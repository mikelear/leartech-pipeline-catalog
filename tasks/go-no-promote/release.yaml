# Go release orchestrator WITHOUT JX environment promotion.
#
# Identical to tasks/go/release.yaml but omits the final
# `tasks/release/jx-promote.yaml` step (`jx promote --all`, which auto-deploys to
# the jx-staging Environment). Use this for services that live in a DEDICATED
# platform namespace and deploy via a direct helmfiles/<ns>/ release (image tag
# bumped by Renovate), not JX environment promotion — e.g. leartech-ai-gateway.
#
# Still builds, tags (cluster-suffixed), publishes the helm chart, and cosign-signs
# the image — only the environment promotion is dropped. See
# ~/leartech/hub (ai-bus/ARCHITECTURE.md §8) for the rationale.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: release
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone.yaml@versionStream
          name: ""
          resources: {}
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/next-version.yaml@main
          name: ""
          resources: {}
        - image: ghcr.io/jenkins-x/jx-boot:3.17.116
          name: jx-variables
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx gitops variables
        - image: ghcr.io/mikelear/leartech-go-runtime:0.51.10
          name: build-make-build
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          script: |
            #!/bin/sh
            set -e
            go mod download
            [ -f Makefile ] && grep -q "^swag:" Makefile && make swag || true
            go build -trimpath -ldflags="-s -w -X main.version=$(cat VERSION)" -o bin/server "${BUILD_TARGET:-./cmd/server}"
        - image: gcr.io/kaniko-project/executor:v1.24.0-debug
          name: build-container-build
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
          script: |
            #!/busybox/sh
            source .jx/variables.sh
            cp /tekton/creds/.docker/config.json /kaniko/.docker/config.json
            /kaniko/executor $KANIKO_FLAGS \
              --cache=true \
              --cache-repo="$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/kaniko-cache" \
              --cache-ttl=168h \
              --context=/workspace/source \
              --dockerfile="${DOCKERFILE_PATH:-Dockerfile}" \
              --build-arg VERSION="$VERSION" \
              --destination="$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION"
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/promote-cluster-suffixed.yaml@main
          name: ""
          resources: {}
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/helm-release.yaml@main
          name: ""
          resources: {}
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/cosign-sign.yaml@main
          name: ""
          resources: {}
        # NOTE: tasks/release/jx-promote.yaml is intentionally OMITTED here — no
        # `jx promote --all` to jx-staging. Deploy is via helmfiles/ai-gateway/.
        # Kick the Renovate cronjob so any UMBRELLA pinning this service chart
        # gets a bump PR within minutes — the go-common pattern. A service whose
        # deployment is owned by an umbrella publishes its chart and nothing
        # else; the umbrella's pin bump IS the deploy trigger, so this kick is
        # what closes the loop fast.
        - image: ghcr.io/jenkins-x/jx-boot:3.16.59
          name: trigger-renovate
          resources: {}
          script: |
            #!/bin/sh
            set -e
            # ONE RUN PER REPO, NOT PER SECOND. The name used to carry a
            # timestamp, so every release stacked another Job — and Renovate is
            # not built to run twice over the same repositories. Observed live
            # after switching eight services to go-no-promote in one go: four
            # Jobs for the SAME repo sat Running for 4-6 hours (a normal run is
            # minutes), because concurrent runs over one repo deadlock on their
            # shared git/cache state.
            #
            # A stable per-repo name gives natural de-duplication: a release
            # while a run is in flight does not stack another, and the finished
            # one is cleared by the next release.
            JOB="renovate-after-${REPO_NAME:-release}"
            if kubectl -n jx get job "${JOB}" >/dev/null 2>&1; then
              done_=$(kubectl -n jx get job "${JOB}" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')
              fail_=$(kubectl -n jx get job "${JOB}" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')
              if [ "$done_" = "True" ] || [ "$fail_" = "True" ]; then
                kubectl -n jx delete job "${JOB}" --ignore-not-found >/dev/null 2>&1
              fi
            fi
            if kubectl -n jx get job "${JOB}" >/dev/null 2>&1; then
              echo "==> ${JOB} is still running for this repo — not stacking another (it will pick the tag up)"
            else
              rc=0
              kubectl -n jx create job --from=cronjob/renovate "${JOB}" || rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "::WARN renovate trigger exited ${rc}; the Monday cron will pick up the bump"
              else
                echo "==> ${JOB} created"
              fi
            fi
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
