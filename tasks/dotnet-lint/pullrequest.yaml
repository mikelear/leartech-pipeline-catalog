apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: dotnet-lint
spec:
  pipelineSpec:
    tasks:
    - name: dotnet-lint
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: mcr.microsoft.com/dotnet/sdk:11.0
          name: dotnet-lint
          resources:
            requests:
              cpu: 400m
              memory: 1Gi
          env:
            # GitHub Packages NuGet feed credentials — nuget.config references
            # these as %GITHUB_USER% / %GITHUB_TOKEN%. Without them `dotnet
            # restore` 401s on any Leartech.* / Mqube.* PackageReference.
            # `optional: true` keeps services with only nuget.org deps working.
            - name: GITHUB_USER
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: username
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
          script: |
            #!/bin/bash
            set +e
            (
            set -e
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              git make ca-certificates >/dev/null

            SOLUTION="${BUILD_TARGET:-./*.sln}"

            echo "==> dotnet restore $SOLUTION"
            dotnet restore $SOLUTION --locked-mode

            # `dotnet format --verify-no-changes` exits non-zero if any file
            # would be reformatted. Covers whitespace + style + analyzer
            # auto-fixes (where applicable). Build-time analyzer enforcement
            # via Directory.Build.props (EnforceCodeStyleInBuild +
            # TreatWarningsAsErrors) catches the rest at the build step
            # below.
            echo "==> dotnet format --verify-no-changes (whitespace + style)"
            dotnet format $SOLUTION --verify-no-changes --no-restore

            # Building with TreatWarningsAsErrors=true (set in repo's
            # Directory.Build.props) means analyzer warnings fail the build
            # here. Mqube's services have <NoWarn>1591;NU1605</NoWarn>
            # suppressions; leartech intentionally goes the other way.
            echo "==> dotnet build (analyzer-as-error gate)"
            dotnet build $SOLUTION --no-restore --configuration Debug

            echo "==> lint complete"
            ) > /workspace/.dotnet-lint.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.dotnet-lint.log
            printf '%s\n' "$rc" > /workspace/.dotnet-lint.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.39.12
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            [ -f /workspace/.dotnet-lint.rc ] && rc=$(cat /workspace/.dotnet-lint.rc)
            if [ "$rc" -eq 0 ]; then
              echo "==> lint passed; nothing to report"
              exit 0
            fi
            # the LAST marker: earlier gates succeeded
            gate=$(grep -oE "==> dotnet (restore|format|build)" /workspace/.dotnet-lint.log \
              | tail -n 1 | awk '{print $3}')
            gate=${gate:-unknown}
            {
              printf '### :x: Lint: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:?}"
              printf 'Failed at `dotnet %s` (exit %s).\n\n' "$gate" "$rc"
              printf '```\n'
              grep -E "(error|warning) [A-Z]{2,4}[0-9]{3,}|error:|NU[0-9]+" \
                /workspace/.dotnet-lint.log | head -n 20 || true
              printf '%s\n' '---'
              tail -n 30 /workspace/.dotnet-lint.log
              printf '```\n'
            } > /tmp/body.md
            prpost -tool dotnet-lint -check dotnet-lint -outcome failure \
              -cluster "${CLUSTER_ID:?}" -summary "dotnet $gate exited $rc" \
              -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
