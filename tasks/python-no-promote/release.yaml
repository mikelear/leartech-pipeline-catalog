# Python release orchestrator WITHOUT JX environment promotion.
#
# Identical to tasks/python/release.yaml but omits the final
# tasks/release/jx-promote.yaml step (`jx promote --all`, which raises a chart-bump
# PR against each cluster's GitOps repo and auto-deploys to the jx-staging
# Environment).
#
# Use this for repos that publish an IMAGE ONLY and have no service to deploy —
# e.g. leartech-automated-agent, which builds the Dev Agent images consumed by
# AgentTypes. Its image tag reaches the clusters via Renovate bumping
# agentTypes.tag, not via environment promotion, so a promote PR would be a
# chart-bump for a chart nobody deploys.
#
# Mirrors tasks/go-no-promote/release.yaml — same single omission, same reason.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: release
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          # Pod-level scheduling = sum of all step containers. Keep modest
          # so the pod fits on a standard AKS/GKE node.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone.yaml@versionStream
          name: ""
          resources: {}
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/next-version.yaml@main
          name: ""
          resources: {}
        - image: ghcr.io/jenkins-x/jx-boot:3.16.59
          name: jx-variables
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx gitops variables
        - image: python:3.13-slim
          name: build-python-test
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          script: |
            #!/bin/sh
            set -e
            pip install uv --quiet
            # Frozen install is preferred; fall back to a fresh resolve if
            # the lockfile lags (e.g. first build after dep bump on main).
            uv sync --dev --frozen --no-cache 2>/dev/null || uv sync --dev --no-cache
            uv run coverage run -m pytest -v
            uv run coverage report
        - image: gcr.io/kaniko-project/executor:v1.9.1-debug
          name: build-container-build
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
          script: |
            #!/busybox/sh
            set -e
            source .jx/variables.sh
            # Build Docker config with cluster registry + ghcr.io auth so kaniko
            # can pull FROM-images on ghcr.io/mikelear/* (e.g. leartech-agent-go).
            # Mirrors the auth pattern leartech-dockerfiles/*/release.yaml uses.
            sed 's/"credHelpers":{[^}]*},//' /tekton/creds/.docker/config.json > /workspace/docker-config.json
            if [ -n "$GIT_TOKEN" ]; then
              GHCR_AUTH=$(printf "mikelear:%s" "$GIT_TOKEN" | base64)
              cat /workspace/docker-config.json | sed "s/\"auths\":{/\"auths\":{\"ghcr.io\":{\"auth\":\"${GHCR_AUTH}\"},/" > /kaniko/.docker/config.json
            else
              cp /workspace/docker-config.json /kaniko/.docker/config.json
            fi
            # Layer cache: --cache=true reuses identical layers across builds,
            # stored in $PUSH_CONTAINER_REGISTRY/.../kaniko-cache. Major speedup
            # (~50% on incremental builds) since base-image + apt + COPY of
            # uv.lock + .venv stay cached between PRs. --cache-ttl=168h (7d)
            # so layers eventually re-validate. See ~/leartech/hub/shared-rules/build-speed.md.
            /kaniko/executor $KANIKO_FLAGS \
              --cache=true \
              --cache-repo="$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/kaniko-cache" \
              --cache-ttl=168h \
              --context=/workspace/source \
              --dockerfile="${DOCKERFILE_PATH:-Dockerfile}" \
              --destination="$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION"
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/promote-cluster-suffixed.yaml@main
          name: ""
          resources: {}
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/helm-release.yaml@main
          name: ""
          resources: {}
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/cosign-sign.yaml@main
          name: ""
          resources: {}
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
