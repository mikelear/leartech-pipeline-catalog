# OpenAPI client SDK generation for release builds.
#
# Same shape as tasks/openapi-generation/pullrequest.yaml but driven
# from the service repo's release.yaml — runs after the service has
# been built + tagged, generates packages with the release version,
# publishes them as latest tags (no `--tag preview` flag).
#
# Consumer release.yaml typically widens OutputLanguages vs PR builds:
#   PR:      angular typescript                    (fast, frontend-only)
#   Release: angular typescript go python rust     (full set)
#
# See pullrequest.yaml header for the full env contract + secret
# prerequisite.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: openapi-generation
spec:
  pipelineSpec:
    tasks:
    - name: openapi-generation
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: openapi-pkg-gen
                key: auth-token
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: openapi-pkg-gen
                key: user
          # CLUSTER_ID drives both the single-publisher gate (only az
          # publishes) and the tag-matching pattern. Source is the
          # jx-cluster-config ConfigMap, same pattern as
          # tasks/release/promote-cluster-suffixed.yaml.
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: OPENAPI_PUBLISHER
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: OPENAPI_PUBLISHER
                optional: true
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone.yaml@versionStream
          name: ""
          resources: {}
        - image: ghcr.io/mikelear/leartech-checkers:0.51.2
          name: sp-variables
          resources: {}
          env:
          - name: DOCKER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOCKER_REGISTRY
                optional: true
          - name: DOCKER_REGISTRY_ORG
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOCKER_REGISTRY_ORG
                optional: true
          - name: PUSH_CONTAINER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: PUSH_CONTAINER_REGISTRY
                optional: true
          - name: KANIKO_FLAGS
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: KANIKO_FLAGS
                optional: true
          - name: DOMAIN
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOMAIN
                optional: true
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: JX_DOCKER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: docker.registry
                optional: true
          - name: JX_DOCKER_REGISTRY_ORG
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: docker.registry.org
                optional: true
          - name: JX_KANIKO_FLAGS
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: kaniko.flags
                optional: true
          script: |
            #!/bin/sh
            set -eu
            : "${DOCKER_REGISTRY:=${JX_DOCKER_REGISTRY:-}}"
            : "${DOCKER_REGISTRY_ORG:=${JX_DOCKER_REGISTRY_ORG:-}}"
            : "${KANIKO_FLAGS:=${JX_KANIKO_FLAGS:-}}"
            spvariables
        - image: ghcr.io/mikelear/leartech-openapi-generation:0.1.3
          name: package-generation
          resources: {}
          script: |
            #!/bin/bash
            set -e
            source /workspace/source/.jx/variables.sh

            # Single-publisher gate: this task runs on every cluster's release
            # pipeline, but only one publishes (otherwise they race to push the
            # same package version). The cluster says so itself, in
            # jx-cluster-config/OPENAPI_PUBLISHER. The old test was
            # `${CLUSTER_ID:-az}`, so a cluster whose ConfigMap was missing
            # behaved AS az and raced the real publisher.
            if [ "${OPENAPI_PUBLISHER:-false}" != "true" ]; then
              echo "==> CLUSTER_ID=${CLUSTER_ID:-<none>} is not the codegen publisher; skipping"
              exit 0
            fi

            git config --global --add safe.directory /workspace/source
            git config --global user.name "${GIT_USER}"
            git config --global user.email "${GIT_USER}@users.noreply.github.com"

            # VERSION isn't in .jx/variables.sh — next-version writes it
            # in the from-build-pack pod's workspace, not this pod's.
            # The from-build-pack pod pushes the cluster-suffixed tag but
            # NOT the "chore: release X.Y.Z" commit it points at, so
            # `git describe` from main never finds the tag in HEAD's
            # ancestry. Sort tags by version directly instead.
            git fetch --tags --force origin
            RAW=$(git tag -l "v*-${CLUSTER_ID}" --sort=-version:refname | head -1)
            if [ -z "$RAW" ]; then
              echo "==> no v*-${CLUSTER_ID} tags found; cannot derive VERSION"
              exit 1
            fi
            VERSION=${RAW#v}                   # v0.1.17-az -> 0.1.17-az
            VERSION=${VERSION%-${CLUSTER_ID}}  # 0.1.17-az -> 0.1.17
            export VERSION
            echo "==> derived VERSION=${VERSION} from tag ${RAW}"

            leartech-openapi-generation generate pkg ${OutputLanguages}
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
