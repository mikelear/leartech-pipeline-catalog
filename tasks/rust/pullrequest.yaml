apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: pullrequest
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          # Pod-level scheduling = sum of step container requests; keep modest.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: ghcr.io/jenkins-x/jx-boot:3.17.129
          name: jx-variables
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx gitops variables
        # rust:1.88-slim-bookworm — switch to leartech-rust-runtime:<semver>
        # once that image is published (PR mikelear/leartech-dockerfiles#15).
        - image: rust:1.98-slim-bookworm
          name: build-cargo-build
          resources:
            requests:
              cpu: 400m
              memory: 1Gi
          script: |
            #!/bin/bash
            set +e
            (
            set -e
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              git make pkg-config libssl-dev libpq-dev build-essential >/dev/null
            # Optional Makefile hook: services that ship a `gen-openapi`
            # binary expose an `openapi:` target so the spec stays fresh
            # alongside the just-built code. Mirrors the go task's
            # `make swag` hook. Non-fatal: if there's no Makefile or no
            # `openapi:` target, just skip.
            [ -f Makefile ] && grep -q "^openapi:" Makefile && make openapi || true
            # Debug build for PR (release optimisations live in release.yaml).
            # BUILD_TARGET lets monorepos point cargo at a non-default crate.
            cargo build --locked ${BUILD_TARGET:+--package $BUILD_TARGET}
            ) > /workspace/.cargo-build.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.cargo-build.log
            printf '%s\n' "$rc" > /workspace/.cargo-build.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.38.2
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            [ -f /workspace/.cargo-build.rc ] && rc=$(cat /workspace/.cargo-build.rc)
            if [ "$rc" -eq 0 ]; then
              echo "==> build passed; nothing to report"
              exit 0
            fi
            gate="cargo build"
            grep -qE "^error: failed to (load|select) source|^error: failed to get .* as a dependency" \
              /workspace/.cargo-build.log && gate="cargo fetch"
            {
              printf '### :x: Build: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:?}"
              printf 'Failed at `%s` (exit %s).\n\n' "$gate" "$rc"
              printf '```\n'
              if [ "$gate" = "cargo fetch" ]; then
                grep -E "^error" /workspace/.cargo-build.log | head -n 15 || true
              else
                grep -E "^error(\[|:)|^  --> |^warning: unused" /workspace/.cargo-build.log \
                  | head -n 25 || true
              fi
              printf '%s\n' '---'
              tail -n 25 /workspace/.cargo-build.log
              printf '```\n'
            } > /tmp/body.md
            prpost -tool build -check build -outcome failure -cluster "${CLUSTER_ID:?}" \
              -summary "$gate exited $rc" -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
        - image: gcr.io/kaniko-project/executor:v1.24.0-debug
          name: build-container-build
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
          env:
            # GIT_TOKEN gets passed as a kaniko build-arg so the Dockerfile
            # can configure git credentials inside the builder stage to
            # fetch private cargo deps (e.g. leartech-common via git+tag).
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
          script: |
            #!/busybox/sh
            [ -f /workspace/.cargo-build.rc ] && exit 0
            source .jx/variables.sh
            cp /tekton/creds/.docker/config.json /kaniko/.docker/config.json
            # Layer cache shared with release builds — PR snapshots warm the
            # cache for the eventual release build of the merged commit.
            /kaniko/executor $KANIKO_FLAGS \
              --cache=true \
              --cache-repo="$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/kaniko-cache" \
              --cache-ttl=168h \
              --build-arg "GIT_TOKEN=${GIT_TOKEN}" \
              --context=/workspace/source \
              --dockerfile="${DOCKERFILE_PATH:-Dockerfile}" \
              --destination="$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION"
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/preview/clear-stuck-release.yaml@main
          name: ""
          resources: {}

        - image: ghcr.io/jenkins-x/jx-boot:3.17.129
          name: promote-jx-preview
          resources: {}
          script: |
            #!/usr/bin/env sh
            set -e
            [ -f /workspace/.cargo-build.rc ] && exit 0
            source .jx/variables.sh
            jx preview create
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 2h0m0s
status: {}
