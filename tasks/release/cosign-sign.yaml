# Language-agnostic: cosign-sign the built container image.
#
# Signs $DOCKER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION using
# the cluster's cosign-keys secret. Assumes .jx/variables.sh has been
# sourced (i.e. jx-variables step ran earlier in the pipeline).
#
# Idempotent: if the image already has a valid signature with our key,
# the sign step is skipped. This makes retries safe — without the
# guard, Rekor returns HTTP 409 ("an equivalent entry already exists
# in the transparency log") and fails the pipeline even though the
# image is correctly signed.
#
# SIGNATURE FORMAT — KNOWN GAP. DO NOT "FIX" IT WITH A FLAG (2026-09-08)
#
# cosign v3 changed its DEFAULT signature storage from the tag convention
# (<repo>:sha256-<digest>.sig) to OCI 1.1 referrers. Sigstore's docs: "all new
# images signed with cosign v3 are shown as not signed by systems that don't
# support OCI 1.1 referrers." Kyverno's key attestor is one of those systems,
# so verify-image-signatures reads 1,271 fail / 0 pass on GCP with
# ".attestors[0].entries[0].keys: no signatures found" for images that ARE
# correctly signed (cosign verify succeeds on every version tested).
#
# A previous revision added --registry-referrers-mode=legacy here believing it
# would restore the .sig tag. IT DOES NOT. That flag is a FETCH option --
# cosign's own help says "mode for fetching references from the registry" -- so
# on `sign` it is inert. Verified: signing with it exits 0, emits no "Pushing
# signature to" line, and a registry API probe of the expected .sig tag returns
# 404. Removed again here.
#
# There is no write-side format flag in cosign v3; bundle-via-referrers is
# simply what v3 does. --tlog-upload=false is also deprecated in v3 and
# rejected alongside the default signing config.
#
# Deliberately NOT pinning cosign back to v2 to satisfy the verifier. This is a
# security control; pinning it to an older major so a downstream tool is happy
# is the wrong trade. The fix belongs on the verifying side.
#
# Open, tracked separately: making Kyverno read referrer-attached signatures.
# Upstream says verifyImageSignatures supports OCI 1.1 and the key-attestor bug
# (kyverno/kyverno#16435) is milestoned 1.19.0 -- but both clusters are ON
# 1.19.0 with rekor.ignoreTlog and it still fails, so either that fix is
# incomplete or there is configuration still to find.
#
# The credHelpers strip is required because bitnami/cosign doesn't ship
# the gcloud / az docker credential helpers that Tekton's injected
# config.json references.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: cosign-sign
spec:
  pipelineSpec:
    tasks:
    - name: cosign-sign
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          name: ""
          resources: {}
          workingDir: /workspace/source
        steps:
        - image: bitnami/cosign:latest@sha256:3e033887ed477d88393b7bc1aa634e21bbbe5268dd360ed550ac1c476bb9cd51
          name: cosign-sign
          resources: {}
          securityContext:
            runAsUser: 0
          env:
          - name: COSIGN_KEY
            valueFrom:
              secretKeyRef:
                name: cosign-keys
                key: cosign.key
          - name: COSIGN_PUB
            valueFrom:
              secretKeyRef:
                name: cosign-keys
                key: cosign.pub
          script: |
            #!/bin/bash
            set -e
            source .jx/variables.sh
            export COSIGN_PASSWORD=""

            mkdir -p /root/.docker
            sed 's/"credHelpers":{[^}]*},//' /tekton/creds/.docker/config.json > /root/.docker/config.json
            export DOCKER_CONFIG=/root/.docker

            echo "$COSIGN_KEY" > /tmp/cosign.key
            echo "$COSIGN_PUB" > /tmp/cosign.pub
            IMAGE="$DOCKER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION"

            # Skip-if-already-signed: cosign verify hits the OCI registry's
            # signature tag (no Rekor lookup with --insecure-ignore-tlog),
            # so this is a registry-only idempotency check. If the
            # signature is present and verifies with our pubkey, the sign
            # step is unnecessary and would 409 against Rekor anyway.
            if cosign verify --key /tmp/cosign.pub --insecure-ignore-tlog=true "$IMAGE" >/dev/null 2>&1; then
              echo "$IMAGE already signed — skipping (retry-safe)"
            else
              echo "Signing $IMAGE"
              cosign sign --key /tmp/cosign.key --yes "$IMAGE"
            fi
            rm -f /tmp/cosign.key /tmp/cosign.pub
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
