# Language-agnostic: cosign-sign the built container image.
#
# Signs $DOCKER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION using
# the cluster's cosign-keys secret. Assumes .jx/variables.sh has been
# sourced (i.e. jx-variables step ran earlier in the pipeline).
#
# Idempotent: if the image already has a valid signature with our key,
# the sign step is skipped. This makes retries safe — without the
# guard, Rekor returns HTTP 409 ("an equivalent entry already exists
# in the transparency log") and fails the pipeline even though the
# image is correctly signed.
#
# --registry-referrers-mode=legacy (added 2026-09-08) — READ THIS BEFORE
# REMOVING IT.
#
# cosign v3 changed its DEFAULT signature storage from the tag-based
# convention (<repo>:sha256-<digest>.sig) to OCI 1.1 referrers. Sigstore's
# own docs put it plainly: "all new images signed with cosign v3 are shown
# as not signed by systems that don't support OCI 1.1 referrers."
#
# This image is bitnami/cosign, pinned by digest but on a v3 build, so every
# signature written since that rollover is referrer-attached. Consequences
# observed on the build clusters 2026-09-08:
#
#   * Kyverno's verify-image-signatures reported 1,271 fail / 0 pass on GCP
#     with the error ".attestors[0].entries[0].keys: no signatures found",
#     even though the images ARE signed — cosign verify succeeds on every
#     version tested (mcp-servers 0.0.71/0.0.90/0.0.95/0.0.97/0.0.99/0.0.100).
#     Kyverno's key attestor reads the .sig tag; nothing was there.
#   * Upgrading Kyverno 1.17/1.18 -> 1.19.0 did NOT fix it, and neither did
#     rekor.ignoreTlog. The format is the blocker, not the verifier version.
#   * It is not specific to us: Harbor has the same bug open
#     (goharbor/harbor#23013, #22592).
#
# `legacy` restores the .sig tag, which is what Kyverno and most other
# verifiers expect. cosign itself reads BOTH formats, so nothing that
# currently verifies stops verifying.
#
# NOTE ON THE GUARD ABOVE: `cosign verify` has no --registry-referrers-mode
# flag and reads either format, so it cannot tell "signed as a referrer" from
# "signed as a tag". That is fine for NEW images (unsigned -> guard fails ->
# signed in legacy mode) but means images already signed as referrers are
# SKIPPED and never gain a .sig tag. Those need the one-off backfill in
# scripts/backfill-legacy-signatures.sh; they are not fixed by this change
# alone.
#
# The credHelpers strip is required because bitnami/cosign doesn't ship
# the gcloud / az docker credential helpers that Tekton's injected
# config.json references.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: cosign-sign
spec:
  pipelineSpec:
    tasks:
    - name: cosign-sign
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          name: ""
          resources: {}
          workingDir: /workspace/source
        steps:
        - image: bitnami/cosign:latest@sha256:3e033887ed477d88393b7bc1aa634e21bbbe5268dd360ed550ac1c476bb9cd51
          name: cosign-sign
          resources: {}
          securityContext:
            runAsUser: 0
          env:
          - name: COSIGN_KEY
            valueFrom:
              secretKeyRef:
                name: cosign-keys
                key: cosign.key
          script: |
            #!/bin/bash
            set -e
            source .jx/variables.sh
            export COSIGN_PASSWORD=""

            mkdir -p /root/.docker
            sed 's/"credHelpers":{[^}]*},//' /tekton/creds/.docker/config.json > /root/.docker/config.json
            export DOCKER_CONFIG=/root/.docker

            echo "$COSIGN_KEY" > /tmp/cosign.key
            IMAGE="$DOCKER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION"

            # Skip-if-already-signed: cosign verify hits the OCI registry's
            # signature tag (no Rekor lookup with --insecure-ignore-tlog),
            # so this is a registry-only idempotency check. If the
            # signature is present and verifies with our pubkey, the sign
            # step is unnecessary and would 409 against Rekor anyway.
            if cosign verify --key /tmp/cosign.key --insecure-ignore-tlog=true "$IMAGE" >/dev/null 2>&1; then
              echo "$IMAGE already signed — skipping (retry-safe)"
            else
              echo "Signing $IMAGE"
              # --registry-referrers-mode=legacy: write the .sig tag, not an
              # OCI 1.1 referrer. See the header for why.
              cosign sign --key /tmp/cosign.key --yes \
                --registry-referrers-mode=legacy "$IMAGE"
            fi
            rm -f /tmp/cosign.key
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
