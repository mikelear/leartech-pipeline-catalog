metadata:
  creationTimestamp: null
  name: go-build-and-tag
spec:
  pipelineSpec:
    tasks:
    - name: go-build-and-tag
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ''
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone.yaml@versionStream
          name: ''
          resources: {}
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/next-version.yaml@main
          name: ''
          resources: {}
        - image: ghcr.io/mikelear/leartech-checkers:0.55.1
          name: sp-variables
          resources: {}
          env:
          - name: DOCKER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOCKER_REGISTRY
                optional: true
          - name: DOCKER_REGISTRY_ORG
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOCKER_REGISTRY_ORG
                optional: true
          - name: PUSH_CONTAINER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: PUSH_CONTAINER_REGISTRY
                optional: true
          - name: KANIKO_FLAGS
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: KANIKO_FLAGS
                optional: true
          - name: DOMAIN
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOMAIN
                optional: true
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: JX_DOCKER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: docker.registry
                optional: true
          - name: JX_DOCKER_REGISTRY_ORG
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: docker.registry.org
                optional: true
          - name: JX_KANIKO_FLAGS
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: kaniko.flags
                optional: true
          script: '#!/bin/sh

            set -eu

            : "${DOCKER_REGISTRY:=${JX_DOCKER_REGISTRY:-}}"

            : "${DOCKER_REGISTRY_ORG:=${JX_DOCKER_REGISTRY_ORG:-}}"

            : "${KANIKO_FLAGS:=${JX_KANIKO_FLAGS:-}}"

            spvariables

            '
        - image: ghcr.io/mikelear/leartech-go-runtime:0.53.56@sha256:b7683e3d00985b90c4dbd1bcc0951cfb29f7cdd5b28e8ca4a7aa32f431c86e01
          name: build-make-build
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          script: '#!/bin/sh

            set -e

            go mod download

            [ -f Makefile ] && grep -q "^swag:" Makefile && make swag || true

            go build -trimpath -ldflags="-s -w -X main.version=$(cat VERSION)" -o bin/server "${BUILD_TARGET:-./cmd/server}"

            '
        - image: gcr.io/kaniko-project/executor:v1.24.0-debug
          name: build-container-build
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
          script: "#!/busybox/sh\nsource .jx/variables.sh\ncp /tekton/creds/.docker/config.json /kaniko/.docker/config.json\n/kaniko/executor $KANIKO_FLAGS \\\n  --cache=true \\\n  --cache-repo=\"$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/kaniko-cache\" \\\n  --cache-ttl=168h \\\n  --context=/workspace/source \\\n  --dockerfile=\"${DOCKERFILE_PATH:-Dockerfile}\" \\\n  --build-arg VERSION=\"$VERSION\" \\\n  --destination=\"$PUSH_CONTAINER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION\"\n"
        - image: uses:mikelear/leartech-pipeline-catalog/tasks/release/promote-cluster-suffixed.yaml@main
          name: ''
          resources: {}
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 2h0m0s
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
