apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: dotnet-audit
spec:
  pipelineSpec:
    tasks:
    - name: dotnet-audit
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: mcr.microsoft.com/dotnet/sdk:11.0
          name: dotnet-audit
          resources:
            requests:
              cpu: 400m
              memory: 1Gi
          env:
            # GitHub Packages NuGet feed credentials — nuget.config references
            # these as %GITHUB_USER% / %GITHUB_TOKEN%. Without them `dotnet
            # restore` 401s on any Leartech.* / Mqube.* PackageReference.
            # `optional: true` keeps services with only nuget.org deps working.
            - name: GITHUB_USER
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: username
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
          script: |
            #!/bin/bash
            set +e
            (
            set -e
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              git make ca-certificates >/dev/null

            SOLUTION="${BUILD_TARGET:-./*.sln}"

            echo "==> dotnet restore $SOLUTION"
            dotnet restore $SOLUTION --locked-mode

            # `dotnet list package --vulnerable --include-transitive` is the
            # built-in NuGet advisory check. Output goes to stdout; we grep
            # for known severity markers and fail on Critical/High by default.
            # Set DOTNET_VULN_FAIL_ON=Moderate (or Low) to tighten.
            FAIL_ON="${DOTNET_VULN_FAIL_ON:-High}"
            echo "==> dotnet list package --vulnerable --include-transitive (fail on >=$FAIL_ON)"
            VULN_OUTPUT=$(dotnet list $SOLUTION package --vulnerable --include-transitive 2>&1 || true)
            echo "$VULN_OUTPUT"

            # Levels are emitted as "Severity" column: Critical/High/Moderate/Low.
            # Build the regex from the threshold downward.
            case "$FAIL_ON" in
              Critical) REGEX='Critical' ;;
              High) REGEX='Critical|High' ;;
              Moderate) REGEX='Critical|High|Moderate' ;;
              Low) REGEX='Critical|High|Moderate|Low' ;;
              *) REGEX='Critical|High' ;;
            esac

            if echo "$VULN_OUTPUT" | grep -E "$REGEX" >/dev/null; then
              echo "FAIL: vulnerable packages at or above $FAIL_ON severity"
              exit 1
            fi

            # Deprecated package surfacing — informational only by default.
            # Set DOTNET_FAIL_ON_DEPRECATED=true to gate (most teams don't —
            # deprecated ≠ vulnerable, just maintained-elsewhere).
            echo "==> dotnet list package --deprecated --include-transitive (informational)"
            DEPRECATED_OUTPUT=$(dotnet list $SOLUTION package --deprecated --include-transitive 2>&1 || true)
            echo "$DEPRECATED_OUTPUT"

            if [ "${DOTNET_FAIL_ON_DEPRECATED:-false}" = "true" ]; then
              if echo "$DEPRECATED_OUTPUT" | grep -E '> [^[:space:]]+ ' >/dev/null; then
                echo "FAIL: deprecated packages found and DOTNET_FAIL_ON_DEPRECATED=true"
                exit 1
              fi
            fi

            echo "==> audit complete"
            ) > /workspace/.dotnet-audit.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.dotnet-audit.log
            printf '%s\n' "$rc" > /workspace/.dotnet-audit.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.43.14
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            [ -f /workspace/.dotnet-audit.rc ] && rc=$(cat /workspace/.dotnet-audit.rc)
            if [ "$rc" -eq 0 ]; then
              echo "==> dotnet-audit passed; nothing to report"
              exit 0
            fi
            gate="vulnerable packages"
            grep -q "FAIL: deprecated packages" /workspace/.dotnet-audit.log \
              && gate="deprecated packages"
            {
              printf '### :x: Audit: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:?}"
              printf '`%s` (exit %s). Vulnerability threshold: `%s`.\n\n' "$gate" "$rc" \
                "${DOTNET_VULN_FAIL_ON:-High}"
              printf '```\n'
              if [ "$gate" = "vulnerable packages" ]; then
                grep -E "> [^[:space:]]+ +[0-9]+\.[0-9]|Critical|High|Moderate" \
                  /workspace/.dotnet-audit.log | head -n 30 || true
              else
                sed -n '/--deprecated/,$p' /workspace/.dotnet-audit.log | head -n 30 || true
              fi
              printf '%s\n' '---'
              tail -n 20 /workspace/.dotnet-audit.log
              printf '```\n'
            } > /tmp/body.md
            prpost -tool dotnet-audit -check dotnet-audit -outcome failure \
              -cluster "${CLUSTER_ID:?}" -summary "$gate" \
              -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
