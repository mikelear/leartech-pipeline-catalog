apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: release
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            limits: {}
          workingDir: /workspace/source
        steps:
        - env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                key: password
                name: tekton-git
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                key: username
                name: tekton-git
          image: ghcr.io/jenkins-x/jx-release-version:2.10.8
          name: next-version
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx-release-version --tag > VERSION
        - image: ghcr.io/mikelear/leartech-checkers:0.60.1
          name: sp-variables
          resources:
            requests:
              cpu: 400m
              memory: 512Mi
          env:
          - name: DOCKER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOCKER_REGISTRY
                optional: true
          - name: DOCKER_REGISTRY_ORG
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOCKER_REGISTRY_ORG
                optional: true
          - name: PUSH_CONTAINER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: PUSH_CONTAINER_REGISTRY
                optional: true
          - name: KANIKO_FLAGS
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: KANIKO_FLAGS
                optional: true
          - name: DOMAIN
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: DOMAIN
                optional: true
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: JX_DOCKER_REGISTRY
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: docker.registry
                optional: true
          - name: JX_DOCKER_REGISTRY_ORG
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: docker.registry.org
                optional: true
          - name: JX_KANIKO_FLAGS
            valueFrom:
              configMapKeyRef:
                name: jenkins-x-docker-registry
                key: kaniko.flags
                optional: true
          script: |
            #!/bin/sh
            set -eu
            : "${DOCKER_REGISTRY:=${JX_DOCKER_REGISTRY:-}}"
            : "${DOCKER_REGISTRY_ORG:=${JX_DOCKER_REGISTRY_ORG:-}}"
            : "${KANIKO_FLAGS:=${JX_KANIKO_FLAGS:-}}"
            spvariables
        - image: ghcr.io/jenkins-x/jx-boot:3.17.129
          name: promote-changelog
          resources: {}
          script: |
            #!/usr/bin/env sh
            source .jx/variables.sh

            if [ -d "charts/$REPO_NAME" ]; then
            jx gitops yset -p version -v "$VERSION" -f ./charts/$REPO_NAME/Chart.yaml
            jx gitops yset -p appVersion -v "$VERSION" -f ./charts/$REPO_NAME/Chart.yaml
            yq e -i '.sources = ((.sources // []) + "'$REPO_URL'" | unique)' ./charts/$REPO_NAME/Chart.yaml
            jx gitops yset -p 'image.repository' -v $DOCKER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME -f ./charts/$REPO_NAME/values.yaml
            jx gitops yset -p 'image.tag' -v "$VERSION" -f ./charts/$REPO_NAME/values.yaml;
            else echo no charts; fi

            git add * || true
            git commit -a -m "chore: release $VERSION" --allow-empty
            git tag -fa v$VERSION -m "Release version $VERSION"
            git push --force origin v$VERSION

            jx changelog create --version v${VERSION} --output-markdown ../changelog.md
        - image: ghcr.io/jenkins-x/jx-boot:3.17.129
          name: promote-helm-release
          resources: {}
          script: |
            #!/usr/bin/env sh
            source .jx/variables.sh
            jx gitops helm release --no-oci-login
        - image: bitnami/cosign:latest@sha256:3e033887ed477d88393b7bc1aa634e21bbbe5268dd360ed550ac1c476bb9cd51
          name: cosign-sign
          resources: {}
          securityContext:
            runAsUser: 0
          env:
            - name: COSIGN_KEY
              valueFrom:
                secretKeyRef:
                  name: cosign-keys
                  key: cosign.key
          script: |
            #!/bin/bash
            set -e
            source .jx/variables.sh
            export COSIGN_PASSWORD=""
            echo "$COSIGN_KEY" > /tmp/cosign.key
            IMAGE="$DOCKER_REGISTRY/$DOCKER_REGISTRY_ORG/$APP_NAME:$VERSION"
            echo "Signing $IMAGE"
            cosign sign --key /tmp/cosign.key --yes "$IMAGE"
            rm -f /tmp/cosign.key
        - image: ghcr.io/jenkins-x-plugins/jx-promote:0.6.54
          name: promote-jx-promote
          resources: {}
          script: |
            #!/usr/bin/env sh
            source .jx/variables.sh
            jx promote -b --all --timeout 1h --no-poll --add-changelog ../changelog.md
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
