# Chart-repo PR pipeline.
#
# WHY THIS EXISTS. tasks/helm/ had only release.yaml, so a chart-only repo had
# no PR task to delegate to. leartech-preview-infrastructure copied
# leartech-evm-network's pipeline instead — 1151 lines that generate an
# Ethereum genesis config, mint 128 validator keystores and health-check a
# beacon chain. On a Hydra chart PR that fails at step-generate-genesis-config,
# which is what blocked its first PR.
#
# WHAT IT DOES, in order:
#   1. lint the chart (dependency build first, so subchart pins resolve)
#   2. run the repo's OWN executable checks — tests/*_test.go (Go)
#   3. deploy the chart into a preview, if the repo has a preview helmfile
#
# Step 2 is the point. A chart's faults are mostly not in its manifests:
# leartech-preview-infrastructure shipped a migration Helm hook that deadlocked
# before its own database existed, an image tag its upstream had delisted, an
# http issuer Hydra refuses to start with, and a read-only /tmp that broke its
# provisioning Job after the client was already created. `helm lint` and
# `helm template` passed on every one. The repo's tests caught them, so the
# pipeline has to run them.
#
# Those tests are Go, and each is mutation-verified in its own repo: the
# assertion is shown to fail when the thing it checks is broken, and to pass
# when it is not. A chart test that cannot fail is decoration.
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: pullrequest
spec:
  pipelineSpec:
    tasks:
    - name: from-build-pack
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            limits: {}
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}

        - image: ghcr.io/jenkins-x/jx-boot:3.17.129
          name: jx-variables
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx gitops variables

        - image: ghcr.io/jenkins-x/jx-boot:3.17.129
          name: chart-lint
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            shopt -s nullglob
            charts=(charts/*/Chart.yaml)
            if [ ${#charts[@]} -eq 0 ]; then
              echo "FAIL: no charts/*/Chart.yaml found. This task is for chart repos;"
              echo "      a repo with no chart should not be using it."
              exit 1
            fi
            mkdir -p /workspace/renders
            rc=0
            for c in "${charts[@]}"; do
              dir=$(dirname "$c"); name=$(basename "$dir")
              echo "==> helm dependency build $dir"
              helm dependency build "$dir" || rc=1
              echo "==> helm lint $dir"
              helm lint "$dir" || rc=1
              if helm template chart-standard "$dir" > "/workspace/renders/$name.yaml" 2>"/workspace/renders/$name.render-err"; then
                test -s "/workspace/renders/$name.yaml" || {
                  echo "NOTE: $dir rendered an empty document; the render rules cannot run on it" >&2
                  rm -f "/workspace/renders/$name.yaml"
                }
              else
                echo "NOTE: $dir does not render with its own defaults — its consumer supplies"
                echo "      required values (auth.issuerUrl and friends). The RENDER rules"
                echo "      cannot run on it; the SOURCE rules still do, and they are where the"
                echo "      tenant-default rule lives. First line of the render error:"
                head -n 1 "/workspace/renders/$name.render-err" | cut -c1-200 | sed 's/^/      /'
                rm -f "/workspace/renders/$name.yaml"
              fi
            done
            printf '%s\n' "$rc" > /workspace/.chart-lint.rc
          onError: continue

        - image: ghcr.io/mikelear/leartech-checkers:0.36.4
          name: chart-standard
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -uo pipefail
            shopt -s nullglob
            rc=0
            # chartstd is the only place S1-S10 are enforced. This task is where
            # every umbrella's PR arrives, and it did not invoke it — which is how
            # 0.0.130 shipped a tenant GSA and a tenant project to every customer
            # while the standard said it could not.
            for c in charts/*/Chart.yaml; do
              dir=$(dirname "$c"); name=$(basename "$dir")
              echo "==> chartstd -tenant $dir"
              chartstd -tenant "$dir" || rc=1
              if [ -f "/workspace/renders/$name.yaml" ]; then
                echo "==> chartstd -store (render rules) $dir"
                args=(-store leartech-secrets -render "/workspace/renders/$name.yaml" \
                      -chart "$dir" -templates)
                [ -f "$dir/chart-standard-toggles.yaml" ] && args+=(-toggles "$dir/chart-standard-toggles.yaml")
                chartstd "${args[@]}" || rc=1
              fi
            done
            [ "$rc" -eq 0 ] || { echo "FAIL: the chart standard found something above" >&2; }
            printf '%s\n' "$rc" > /workspace/.chart-standard.rc
          onError: continue

        # The chart's own tests are Go, and no single image has both the Go
        # toolchain and helm: jx-boot:3.16.59 carries helm 3.15.1 and curl but
        # neither go nor python3 (probed, not assumed). So compile here, run
        # next door. `go test -c` also removes a trap worth naming: `go test`
        # caches on file inputs, and a chart read through exec is not one of
        # them, so a run against a mutated chart replays the previous PASS. A
        # compiled binary cannot do that.
        - image: golang:1.27.4
          name: chart-tests-build
          resources: {}
          env:
          # Honour tests/go.mod's `toolchain` directive, like govulncheck and
          # go-test: the baked image trails a module pinning a newer toolchain,
          # and without this the chart tests compile on the wrong Go version.
          - name: GOTOOLCHAIN
            value: auto
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            if [ ! -f tests/go.mod ]; then
              echo "==> no tests/go.mod — nothing to compile"
              exit 0
            fi
            cd tests
            go vet ./...
            CGO_ENABLED=0 go test -c -o /workspace/source/chart.test ./...
            echo "==> built chart.test ($(stat -c%s /workspace/source/chart.test) bytes, static)"
          onError: continue

        - image: ghcr.io/jenkins-x/jx-boot:3.17.129
          name: chart-tests
          resources: {}
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            shopt -s nullglob

            # Runners this step no longer executes. Left unrun they would read
            # as passing, so refuse instead of skipping.
            stale=(tests/*/run.sh)
            if [ ${#stale[@]} -gt 0 ]; then
              echo "FAIL: ${stale[*]} will not be run — this step executes Go tests."
              echo "      Convert them to tests/*_test.go. A runner nothing invokes is"
              echo "      worse than no test: it looks like coverage in the tree."
              exit 1
            fi

            if [ ! -f tests/go.mod ]; then
              echo "==> no tests/go.mod in this repo"
              echo "==> NOTE: helm lint and helm template cannot see install ORDER,"
              echo "    a delisted image tag, or a hook that waits on a resource the"
              echo "    same release has not created yet. A chart with no executable"
              echo "    checks is unverified in exactly the ways charts fail."
              exit 0
            fi

            if [ ! -x chart.test ]; then
              echo "FAIL: tests/go.mod exists but chart.test was not built."
              echo "      The compile step failed or was skipped, and skipping a"
              echo "      check is not the same as passing it."
              exit 1
            fi

            # The tests shell out to helm, and the chart's subchart archives
            # come from the dependency build in chart-lint, which ran in this
            # same workspace.
            command -v helm >/dev/null || { echo "FAIL: helm missing from this image"; exit 1; }
            set +e
            ( cd tests && /workspace/source/chart.test -test.v ) > /workspace/.chart-tests.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.chart-tests.log
            printf '%s\n' "$rc" > /workspace/.chart-tests.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue

        - image: ghcr.io/mikelear/leartech-checkers:0.36.4
          name: comment-gate
          resources: {}
          script: |
            #!/bin/bash
            set -uo pipefail
            # commentgate lives in leartech-go.mk, which only Go SERVICE repos run.
            # This task is where every chart repo's PR arrives, and it never called
            # it — so no prose gate, no file-size check and no swag drift check has
            # ever run on an umbrella. Backwards: values.yaml is where the prose is
            # that goes stale silently.
            #
            # It examines CHANGED LINES ONLY against origin/main, so a chart repo's
            # existing comments are not a blocker and the ratchet closes as files
            # are touched.
            git remote -v >/dev/null 2>&1 || { echo "==> no git remote; skipping"; exit 0; }
            set +e
            commentgate -base "origin/${PULL_BASE_REF:-main}" 2>&1 | tee /workspace/.comment-gate.log
            rc=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$rc" > /workspace/.comment-gate.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue

        - image: ghcr.io/mikelear/leartech-checkers:0.36.4
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            failed=""
            for step in chart-lint chart-standard chart-tests comment-gate; do
              if [ -f "/workspace/.$step.rc" ] && [ "$(cat "/workspace/.$step.rc")" -ne 0 ]; then
                rc=1
                failed="$failed $step"
              fi
            done
            if [ "$rc" -eq 0 ]; then
              echo "==> chart checks passed; nothing to report"
              exit 0
            fi
            {
              printf '### :x: Chart checks: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:?}"
              printf 'Failed:%s\n\n' "$failed"
              for step in chart-lint chart-standard chart-tests comment-gate; do
                [ -f "/workspace/.$step.rc" ] || continue
                [ "$(cat "/workspace/.$step.rc")" -eq 0 ] && continue
                printf '**%s**\n```\n' "$step"
                tail -n 25 "/workspace/.$step.log" 2>/dev/null \
                  || printf 'see the %s step log\n' "$step"
                printf '```\n'
              done
            } > /tmp/body.md
            prpost -tool pr -check pr -outcome failure -cluster "${CLUSTER_ID:?}" \
              -summary "chart checks failed:$failed" -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"

        - image: uses:mikelear/leartech-pipeline-catalog/tasks/preview/clear-stuck-release.yaml@main
          name: ""
          resources: {}

        - image: ghcr.io/jenkins-x-plugins/jx-preview:0.7.30
          name: promote-jx-preview
          resources: {}
          script: |
            #!/usr/bin/env sh
            set -e
            if [ -f /workspace/.chart-lint.rc ] || [ -f /workspace/.chart-standard.rc ] \
               || [ -f /workspace/.chart-tests.rc ]; then
              echo "==> chart checks recorded a failure; not creating a preview from them"
              exit 0
            fi
            if [ ! -f preview/helmfile.yaml.gotmpl ]; then
              echo "==> no preview/helmfile.yaml.gotmpl — skipping preview"
              echo "==> a chart that never deploys in CI is only render-tested"
              exit 0
            fi
            # `jx preview create` needs DOCKER_REGISTRY and DOCKER_REGISTRY_ORG
            # even for a chart repo that builds no image. jx-variables wrote
            # both to .jx/variables.sh two steps ago; without sourcing it this
            # step ends as
            #
            #   error: failed to create env vars: missing $DOCKER_REGISTRY environment variable
            #
            # which is what the umbrella's own PR did on its first green
            # chart-tests run. The go task has always sourced it; this one was
            # written without that line.
            . ./.jx/variables.sh
            jx preview create
      podTemplate:
        tolerations:
        - key: sku
          operator: Equal
          value: build
          effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
