apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: go-test
spec:
  pipelineSpec:
    tasks:
    - name: go-test
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        # Non-alpine golang image: -race needs cgo + gcc which alpine lacks
        # by default. Slightly bigger image, but no apk add build-base.
        - image: golang:1.26
          name: go-test
          resources:
            # `go test ./... -race` + envtest (real apiserver+etcd) is memory-heavy;
            # 512Mi under-reserved the pod (Burstable) → evicted/OOM under node
            # pressure = intermittent single-cluster test flakes. Reserve for the
            # -race+envtest worst case so the pod is scheduled with real headroom.
            requests:
              cpu: "1"
              memory: 2Gi
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
          script: |
            #!/bin/bash
            set -eo pipefail

            # Self-contained: curl the golden mk file and delegate to
            # `make test-coverage`. The mk owns go test invocation, the
            # strip-generated filter, floor + delta-vs-base logic — one
            # code path shared with the developer laptop (see
            # go/leartech-go.mk::test-coverage).
            #
            # This task keeps ONLY the per-cluster PR sticky-comment
            # posting, which needs the Tekton-injected GIT_TOKEN /
            # PULL_NUMBER / CLUSTER_ID and belongs at the CI edge, not in
            # the shared mk.
            #
            # Consumer-overridable via env (defaults mirror the mk):
            #   COVERAGE_THRESHOLD     — minimum acceptable total coverage % (default 60.0)
            #   COVERAGE_SCOPE         — go test -coverpkg scope (default ./internal/...)
            #   COVERAGE_DELTA_TOLERANCE — allow PR coverage to drop at most this much
            #                             below base-branch coverage (default 0.5%).
            THRESHOLD="${COVERAGE_THRESHOLD:-60.0}"
            SCOPE="${COVERAGE_SCOPE:-./internal/...}"
            DELTA_TOL="${COVERAGE_DELTA_TOLERANCE:-0.5}"

            MK_URL="https://raw.githubusercontent.com/mikelear/leartech-pipeline-catalog/main/go/leartech-go.mk"
            echo "==> fetching golden mk from $MK_URL"
            curl -fsSL -o /tmp/leartech-go.mk "$MK_URL"

            # Run test-coverage: writes cover.out, prints per-func summary,
            # threshold verdict, and (when REPO_OWNER/REPO_NAME + network
            # available) base-branch delta. Preserve exit code — make exits
            # non-zero on floor breach or delta regression.
            set +e
            make -f /tmp/leartech-go.mk test-coverage \
              COVERAGE_THRESHOLD="$THRESHOLD" \
              COVERAGE_SCOPE="$SCOPE" \
              COVERAGE_DELTA_TOLERANCE="$DELTA_TOL" \
              2>&1 | tee /tmp/test-coverage.log
            MAKE_RC=${PIPESTATUS[0]}
            set -eo pipefail

            # ── Derive summary values for the sticky ──
            # TOTAL + LOWEST come from cover.out (mk writes it in cwd).
            # BASE_TOTAL / BASE_DELTA / BASE_STATUS are parsed back from
            # the make log (mk emits a "base=X% pr=Y% delta=Z%" line or
            # a "base-branch coverage unavailable" line).
            TOTAL=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | sed 's/%//')

            BASE_TOTAL=""
            BASE_DELTA=""
            BASE_STATUS="UNAVAILABLE"
            if grep -q '^base=' /tmp/test-coverage.log; then
              BASE_LINE=$(grep -m1 '^base=' /tmp/test-coverage.log)
              BASE_TOTAL=$(printf '%s' "$BASE_LINE" | sed -E 's/^base=([0-9.]+)%.*/\1/')
              BASE_DELTA=$(printf '%s' "$BASE_LINE" | sed -E 's/.*delta=(-?[0-9.]+)%.*/\1/')
              if grep -q 'coverage dropped' /tmp/test-coverage.log; then
                BASE_STATUS="REGRESSED"
              else
                BASE_STATUS="OK"
              fi
            fi

            STATUS="pass"
            if [ "$MAKE_RC" -ne 0 ]; then STATUS="fail"; fi

            # ── PR sticky comment (per-cluster) ──
            # Per-cluster marker <!-- leartech-coverage-<cluster> --> so GCP
            # and Azure coexist instead of clobbering each other (mirrors
            # security-scan + ai-review conventions).
            if [ -n "${GIT_TOKEN:-}" ] && [ -n "${PULL_NUMBER:-}" ]; then
              apt-get update -qq && apt-get install -y -qq --no-install-recommends jq curl >/dev/null

              CLUSTER_TAG="${CLUSTER_ID:-unknown}"
              MARKER="<!-- leartech-coverage-${CLUSTER_TAG} -->"

              ICON="white_check_mark"
              VERDICT="PASS"
              if [ "$STATUS" = "fail" ]; then
                ICON="x"
                VERDICT="FAIL"
              fi

              # Top 5 lowest-covered functions (excluding 100%-covered ones so
              # the table is useful even on well-tested repos). Skips the
              # `total:` summary row.
              LOWEST=$(go tool cover -func=cover.out \
                | awk 'NR>1 && $1!="total:" && $NF!="100.0%" {printf "| `%s` | `%s` | %s |\n", $1, $2, $NF}' \
                | sort -t '|' -k4 -g \
                | head -5)
              [ -z "$LOWEST" ] && LOWEST="| — | — | all functions ≥ 100% |"

              BASE_REF="${PULL_BASE_REF:-main}"
              if [ "$BASE_STATUS" = "UNAVAILABLE" ]; then
                DELTA_LINE="_Delta vs \`${BASE_REF}\`: unavailable (couldn't fetch/run baseline)_"
              elif [ "$BASE_STATUS" = "REGRESSED" ]; then
                DELTA_LINE=":warning: **Delta vs \`${BASE_REF}\`**: ${BASE_TOTAL}% → ${TOTAL}% (\`${BASE_DELTA}%\` — exceeds tolerance \`-${DELTA_TOL}%\`)"
              else
                DELTA_LINE=":information_source: Delta vs \`${BASE_REF}\`: ${BASE_TOTAL}% → ${TOTAL}% (\`${BASE_DELTA}%\`)"
              fi

              # Build body via printf rather than HEREDOC — YAML `script: |`
              # treats any line with less indentation than the first content
              # line as the end of the block, so an un-indented heredoc body
              # silently truncates the script at the catalog-parse layer
              # (Lighthouse then skips creating the LighthouseJob — seen
              # 2026-04-17 on PR #4 where the `test` trigger never fired).
              BODY=$(printf '%s\n' \
                "$MARKER" \
                "### :${ICON}: Coverage: ${TOTAL}% (threshold ${THRESHOLD}%) \`[${CLUSTER_TAG}]\` — ${VERDICT}" \
                "" \
                "${DELTA_LINE}" \
                "" \
                "Scope: \`${SCOPE}\`" \
                "" \
                "**Lowest-covered functions**" \
                "" \
                "| File | Function | Coverage |" \
                "|---|---|---|" \
                "${LOWEST}" \
                "" \
                "_Posted by \`tasks/go-test/pullrequest.yaml\` (delegates to \`go/leartech-go.mk::test-coverage\`)._")

              # ?per_page=100 so the marker search sees older comments on
              # long-lived PRs. Without it, GitHub defaults to 30 and the
              # sticky-patch lookup misses — duplicate comments posted.
              API="https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/${PULL_NUMBER}/comments?per_page=100"
              AUTH="Authorization: token ${GIT_TOKEN}"
              ACCEPT="Accept: application/vnd.github+json"

              # Find existing sticky comment (by per-cluster marker)
              EXISTING_ID=$(curl -fsSL -H "$AUTH" -H "$ACCEPT" "$API" \
                | jq -r --arg marker "$MARKER" '.[] | select(.body | startswith($marker)) | .id' \
                | head -1)

              PAYLOAD=$(jq -cn --arg body "$BODY" '{body: $body}')

              if [ -n "$EXISTING_ID" ]; then
                echo "==> updating existing coverage [$CLUSTER_TAG] comment $EXISTING_ID"
                curl -fsSL -X PATCH -H "$AUTH" -H "$ACCEPT" -d "$PAYLOAD" \
                  "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues/comments/${EXISTING_ID}" >/dev/null
              else
                echo "==> posting new coverage [$CLUSTER_TAG] comment"
                curl -fsSL -X POST  -H "$AUTH" -H "$ACCEPT" -d "$PAYLOAD" "$API" >/dev/null
              fi
            else
              echo "==> GIT_TOKEN or PULL_NUMBER unset; skipping PR coverage comment"
            fi

            # Propagate the make verdict — task fails iff the mk's test-coverage
            # fails (floor breach or delta regression).
            exit "$MAKE_RC"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
