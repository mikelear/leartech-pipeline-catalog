# npm audit presubmit — vulnerability check equivalent to govulncheck.
#
# Runs `npm audit --audit-level=${AUDIT_LEVEL}`. Default is `critical`
# because the npm ecosystem generates enough HIGH transitive noise that
# a HIGH default blocks legitimate PRs on dep graphs the service doesn't
# actually use. Consumers that want stricter gating raise this to `high`.
#
# Consumer-overridable via env:
#   AUDIT_LEVEL  low | moderate | high | critical  (default: critical)
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: npm-audit
spec:
  pipelineSpec:
    tasks:
    - name: npm-audit
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        - image: node:26-alpine
          name: npm-audit
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          script: |
            #!/bin/sh
            set +e
            (
            set -e
            apk add --no-cache git
            AUDIT_LEVEL="${AUDIT_LEVEL:-critical}"
            # `npm audit` requires an existing lockfile. Templates that
            # don't commit package-lock.json (first-clone state) get one
            # generated on the fly here — no deps downloaded, just the
            # lockfile computed. Consumers should commit a real lockfile
            # after their first `npm install`.
            if [ ! -f package-lock.json ]; then
              echo "==> no package-lock.json found; generating one (--package-lock-only)"
              npm install --package-lock-only --legacy-peer-deps
            fi
            echo "==> npm audit --audit-level=$AUDIT_LEVEL"
            npm audit --audit-level="$AUDIT_LEVEL"
            ) > /workspace/.npm-audit.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.npm-audit.log
            printf '%s\n' "$rc" > /workspace/.npm-audit.rc
            [ "$rc" -eq 0 ] || exit "$rc"
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.50.2
          name: report
          resources: {}
          env:
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: tekton-git
                key: password
                optional: true
          - name: FORGE_API_URL
            value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
          - name: LEARTECH_AUTH_SERVER_URL
            value: https://hydra-sp-infra.jx.leartech.com
          - name: LEARTECH_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_ID
                optional: true
          - name: LEARTECH_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-prpost-oauth
                key: CLIENT_SECRET
                optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            rc=0
            [ -f /workspace/.npm-audit.rc ] && rc=$(cat /workspace/.npm-audit.rc)
            if [ "$rc" -eq 0 ]; then
              echo "==> npm audit passed; nothing to report"
              exit 0
            fi
            level="${AUDIT_LEVEL:-critical}"
            {
              printf '### :x: npm audit: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:-}"
              printf 'At `--audit-level=%s` (exit %s). A HIGH finding does not fail this\n' \
                "$level" "$rc"
              printf 'check by default; only at or above the level fails.\n\n'
              printf '```\n'
              head -n 40 /workspace/.npm-audit.log
              printf '```\n'
            } > /tmp/body.md
            prpost -tool npm-audit -check npm-audit -outcome failure \
              -cluster "${CLUSTER_ID:-}" -summary "npm audit ($level) exited $rc" \
              -body-file /tmp/body.md \
              || echo "==> WARNING: comment not delivered; the check still fails"
            exit "$rc"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 15m0s
status: {}
