apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: go-lint
spec:
  pipelineSpec:
    tasks:
    - name: go-lint
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        # Image tag pinned here is the ONE canonical golangci-lint version —
        # it MUST equal GOLANGCI_VERSION in go/leartech-go.mk (the golden
        # source). Bump the mk file first, then mirror the tag here in the
        # same PR. Do not diverge — the delegated `make lint` invocation
        # below will produce a linter set identical to what a developer
        # runs locally with `make -f leartech-go.mk lint`.
        - image: golangci/golangci-lint:v2.12.2
          name: golangci-lint
          # golangci-lint loads the whole type-checked module graph — memory-heavy
          # on real modules; the inherited 512Mi under-reserves it (Burstable pod
          # evicted/OOM under node pressure = lint flakes). Reserve real headroom,
          # with matching limits == requests → Guaranteed QoS (evicted absolute-last;
          # a request-only Burstable pod is still evicted under node pressure).
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "1"
              memory: 3Gi
          script: |
            #!/bin/sh
            set -eu
            # Peak-memory guard: golangci's buildir/staticcheck loads the whole
            # module IR and peaked at ~2GB on a real controller module — right at
            # the old 2Gi ceiling (OOMKilled under node pressure). Two levers:
            # (1) 2Gi→3Gi headroom above; (2) GOMEMLIMIT below the container limit
            # so the Go runtime GCs HARD before the cgroup OOM-kills it (soft cap
            # beats a hard kill). ~2600MiB leaves room for non-heap (stacks/OS).
            export GOMEMLIMIT=2600MiB
            # Self-contained: curl the golden mk file and delegate. The mk
            # file owns the merge semantics (yq base + local .golangci.yml),
            # the timeout, and the golangci-lint invocation — CI and laptop
            # go through the same code path (no drift possible).
            apt-get update -qq && apt-get install -y -qq --no-install-recommends curl make >/dev/null 2>&1
            # yq is required by the mk's lint-config target (base←local merge).
            curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
            chmod +x /usr/local/bin/yq

            MK_URL="https://raw.githubusercontent.com/mikelear/leartech-pipeline-catalog/main/go/leartech-go.mk"
            echo "==> fetching golden mk from $MK_URL"
            curl -fsSL -o /tmp/leartech-go.mk "$MK_URL"

            echo "==> make -f /tmp/leartech-go.mk lint"
            make -f /tmp/leartech-go.mk lint
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
