apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: go-lint
spec:
  pipelineSpec:
    tasks:
    - name: go-lint
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        # The catalog's tools, from the pinned image. They used to be curled from
        # raw.githubusercontent inside the step that used them, which made what ran a
        # different artefact from what merged for up to five minutes (that CDN serves
        # cache-control: max-age=300) and needed a Go toolchain in every image.
        - image: ghcr.io/mikelear/leartech-checkers:0.50.6
          name: provide-catalog-tools
          resources: {}
          script: |
            #!/bin/sh
            set -eu
            mkdir -p /workspace/bin
            for f in /usr/local/bin/prpost /usr/local/share/leartech-go.mk; do
              test -f "$f" || { echo "FAIL: $f missing from ghcr.io/mikelear/leartech-checkers:0.14.0" >&2; exit 1; }
            done
            cp /usr/local/bin/prpost /workspace/bin/prpost
            cp /usr/local/share/leartech-go.mk /workspace/bin/leartech-go.mk
            chmod +x /workspace/bin/prpost
            test -x /workspace/bin/prpost
            test -f /workspace/bin/leartech-go.mk
            echo "==> provided /workspace/bin/{prpost,leartech-go.mk}"
        - image: golangci/golangci-lint:v2.15.0
          name: golangci-lint
          # golangci-lint loads the whole type-checked module graph — memory-heavy
          # on real modules; the inherited 512Mi under-reserves it (Burstable pod
          # evicted/OOM under node pressure = lint flakes). Reserve real headroom,
          # with matching limits == requests → Guaranteed QoS (evicted absolute-last;
          # a request-only Burstable pod is still evicted under node pressure).
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "1"
              memory: 3Gi
          script: |
            #!/bin/sh
            set -eu
            # Peak-memory guard: golangci's buildir/staticcheck loads the whole
            # module IR and peaked at ~2GB on a real controller module — right at
            # the old 2Gi ceiling (OOMKilled under node pressure). Two levers:
            # (1) 2Gi→3Gi headroom above; (2) GOMEMLIMIT below the container limit
            # so the Go runtime GCs HARD before the cgroup OOM-kills it (soft cap
            # beats a hard kill). ~2600MiB leaves room for non-heap (stacks/OS).
            export GOMEMLIMIT=2600MiB
            # Self-contained: curl the golden mk file and delegate. The mk
            # file owns the merge semantics (yq base + local .golangci.yml),
            # the timeout, and the golangci-lint invocation — CI and laptop
            # go through the same code path (no drift possible).
            apt-get update -qq && apt-get install -y -qq --no-install-recommends curl make >/dev/null 2>&1
            # yq is required by the mk's lint-config target (base←local merge).
            curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
            chmod +x /usr/local/bin/yq

            MK_URL="/workspace/bin/leartech-go.mk"
            test -f "$MK_URL" || { echo "FAIL: $MK_URL missing; the provide-catalog-tools step did not run" >&2; exit 1; }
            echo "==> using the mk from the pinned checkers image: $MK_URL"
            cp "$MK_URL" /tmp/leartech-go.mk

            echo "==> make -f /tmp/leartech-go.mk lint"
            # The reason a lint run failed is in this log and nowhere else: the
            # PR gets Lighthouse's generic "the following test failed" table,
            # which names no cause. So the log is kept for the report step and
            # the exit code is recorded rather than propagated, because a
            # non-zero exit here would stop the task before anything can post.
            set +e
            make -f /tmp/leartech-go.mk lint > /workspace/.lint.log 2>&1
            rc=$?
            set -e
            tail -n 120 /workspace/.lint.log
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$rc" > /workspace/.lint.rc
            fi
          onError: continue
        - image: ghcr.io/mikelear/leartech-checkers:0.50.6
          name: report
          resources: {}
          env:
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: jx-cluster-config
                  key: CLUSTER_ID
                  optional: true
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
            - name: FORGE_API_URL
              value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
            - name: LEARTECH_AUTH_SERVER_URL
              value: https://hydra-sp-infra.jx.leartech.com
            - name: LEARTECH_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: catalog-prpost-oauth
                  key: CLIENT_ID
                  optional: true
            - name: LEARTECH_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-prpost-oauth
                  key: CLIENT_SECRET
                  optional: true
          script: |
            #!/bin/bash
            set -uo pipefail
            [ -f /workspace/.lint.rc ] || { echo "==> lint passed; nothing to report"; exit 0; }
            rc=$(cat /workspace/.lint.rc)
            # The first failing target plus its own message, because that is what
            # decides whether a person can act: comment-gate names file:line, a
            # golangci failure names the linter and the file.
            first=$(grep -nE "^(FAIL|make: \*\*\*|.*Error: )" /workspace/.lint.log | head -1 | cut -d: -f2-)
            {
              printf '### :x: Lint: **FAIL** `[%s]`\n\n' "${CLUSTER_ID:-}"
              printf '`make lint` exited %s.%s\n\n' "$rc" "${first:+ First reason: \`$first\`}"
              printf '<details><summary>Last 40 lines of the log</summary>\n\n```\n'
              tail -n 40 /workspace/.lint.log
              printf '```\n\n</details>\n'
            } > /tmp/body.md
            prpost -tool lint -check lint -outcome failure -cluster "${CLUSTER_ID:-}"               -summary "make lint exited $rc" -body-file /tmp/body.md \
              || echo "==> WARNING: could not deliver the lint comment; the check still fails"
            exit "$rc"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 30m0s
status: {}
