# Angular Karma test presubmit. Runs ng test with --code-coverage,
# parses the emitted LCOV to compute total line coverage %, compares
# against COVERAGE_THRESHOLD, and posts a per-cluster sticky PR comment
# with the top lowest-covered files.
#
# Consumer-overridable via env:
#   COVERAGE_THRESHOLD  minimum line-coverage % (default 60.0, matches
#                       golden-service-standard)
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: ng-test
spec:
  pipelineSpec:
    tasks:
    - name: ng-test
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env:
          - name: HOME
            value: /tekton/home
          - name: CLUSTER_ID
            valueFrom:
              configMapKeyRef:
                name: jx-cluster-config
                key: CLUSTER_ID
                optional: true
          envFrom:
          - secretRef:
              name: jx-boot-job-env-vars
              optional: true
          name: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          workingDir: /workspace/source
        steps:
        - image: uses:jenkins-x/jx3-pipeline-catalog/tasks/git-clone/git-clone-pr.yaml@versionStream
          name: ""
          resources: {}
        # The catalog's tools, from the pinned image. They used to be curled from
        # raw.githubusercontent inside the step that used them, which made what ran a
        # different artefact from what merged for up to five minutes (that CDN serves
        # cache-control: max-age=300) and needed a Go toolchain in every image.
        - image: ghcr.io/mikelear/leartech-checkers:0.59.2
          name: provide-catalog-tools
          resources: {}
          script: |
            #!/bin/sh
            set -eu
            mkdir -p /workspace/bin
            for f in /usr/local/bin/prpost /usr/local/share/leartech-go.mk; do
              test -f "$f" || { echo "FAIL: $f missing from this step's leartech-checkers image (bump the task's image pin)" >&2; exit 1; }
            done
            cp /usr/local/bin/prpost /workspace/bin/prpost
            cp /usr/local/share/leartech-go.mk /workspace/bin/leartech-go.mk
            chmod +x /workspace/bin/prpost
            test -x /workspace/bin/prpost
            test -f /workspace/bin/leartech-go.mk
            echo "==> provided /workspace/bin/{prpost,leartech-go.mk}"
        # node:22-alpine + chromium installed inline. zenika/alpine-chrome
        # runs as uid 1000 by default, which breaks Tekton's cred-inject
        # (credentials land in /tekton/home which is root-owned) and also
        # blocks `apk add`. Staying on node:22-alpine (runs as root) keeps
        # the whole pipeline pattern consistent with every other catalog
        # task in this repo.
        - image: node:26-alpine
          name: ng-test
          resources:
            requests:
              cpu: 400m
              memory: 1Gi
          env:
            - name: FORGE_API_URL
              value: http://leartech-ship-proven-umbrella-leartech-forge-api.ship-proven.svc:8080
            - name: LEARTECH_AUTH_SERVER_URL
              value: https://hydra-sp-infra.jx.leartech.com
            - name: LEARTECH_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: catalog-prpost-oauth
                  key: CLIENT_ID
                  optional: true
            - name: LEARTECH_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-prpost-oauth
                  key: CLIENT_SECRET
                  optional: true
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tekton-git
                  key: password
                  optional: true
            - name: CHROME_BIN
              value: /usr/bin/chromium-browser
            - name: CHROMIUM_FLAGS
              value: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
          script: |
            #!/bin/sh
            set -eo pipefail
            apk add --no-cache git jq curl chromium nss freetype harfbuzz ttf-freefont go

            THRESHOLD="${COVERAGE_THRESHOLD:-60.0}"

            echo "==> npm ci"
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps

            echo "==> ng test --watch=false --code-coverage"
            npm test

            # Find the emitted lcov. Angular emits into
            # coverage/<project>/lcov.info. Glob + first match is reliable.
            LCOV=$(find coverage -name 'lcov.info' -type f 2>/dev/null | head -1)
            if [ -z "$LCOV" ]; then
              echo "FAIL: no lcov.info produced by Karma — did the test suite run?"
              exit 1
            fi
            echo "==> parsing $LCOV"

            # LCOV records totals as LF (lines found) + LH (lines hit)
            # per file. Sum across the file.
            LF=$(awk -F: '/^LF:/ { sum += $2 } END { print sum+0 }' "$LCOV")
            LH=$(awk -F: '/^LH:/ { sum += $2 } END { print sum+0 }' "$LCOV")
            TOTAL=$(awk -v h="$LH" -v f="$LF" 'BEGIN { if (f == 0) print "0.0"; else printf "%.1f", (h/f)*100 }')
            echo "total=${TOTAL}%  threshold=${THRESHOLD}%"

            STATUS="pass"
            if awk -v t="$TOTAL" -v th="$THRESHOLD" 'BEGIN { exit !(t < th) }'; then
              STATUS="fail"
            fi

            # Per-cluster sticky marker so GCP + Azure comments coexist.
            if [ -n "${GIT_TOKEN:-}" ] && [ -n "${PULL_NUMBER:-}" ]; then
              CLUSTER_TAG="${CLUSTER_ID:-unknown}"
              MARKER="<!-- leartech-coverage-${CLUSTER_TAG} -->"

              ICON="white_check_mark"
              VERDICT="PASS"
              if [ "$STATUS" = "fail" ]; then
                ICON="x"
                VERDICT="FAIL"
              fi

              # Top 5 lowest-covered FILES (Karma reports per-file, not
              # per-function like go). Skip 100%-covered to keep the
              # table useful on well-tested repos.
              LOWEST=$(awk -v FS=: '
                /^SF:/ { file=$2; lf=0; lh=0; }
                /^LF:/ { lf=$2; }
                /^LH:/ { lh=$2; }
                /^end_of_record/ {
                  if (lf > 0) {
                    pct = (lh/lf)*100;
                    if (pct < 100.0) printf "| `%s` | %.1f%% | %d/%d |\n", file, pct, lh, lf;
                  }
                }' "$LCOV" | sort -t '|' -k3 -g | head -5)
              [ -z "$LOWEST" ] && LOWEST="| — | — | all files ≥ 100% |"

              BODY=$(printf '%s\n' \
                "$MARKER" \
                "### :${ICON}: Coverage: ${TOTAL}% (threshold ${THRESHOLD}%) \`[${CLUSTER_TAG}]\` — ${VERDICT}" \
                "" \
                "${LH} of ${LF} lines hit." \
                "" \
                "**Lowest-covered files**" \
                "" \
                "| File | Coverage | Hit/Total |" \
                "|---|---|---|" \
                "${LOWEST}" \
                "" \
                "_Posted by \`tasks/ng-test/pullrequest.yaml\`._")

              # ?per_page=100 so the marker search sees older comments on
              # long-lived PRs. Without it, GitHub defaults to 30 and the
              # sticky-patch lookup misses — duplicate comments posted.
              # One Go poster (go/prpost) via leartech-forge-api: sticky key adopts the
              # old marker and the body gains the machine-readable leartech-report block.
              printf '%s' "$BODY" | /workspace/bin/prpost -tool coverage -check test -cluster "$CLUSTER_TAG" -outcome "$( [ "$STATUS" = "fail" ] && echo failure || echo success )" -summary "Coverage: ${TOTAL}% — ${STATUS}" -body-file /dev/stdin
            fi

            if [ "$STATUS" = "fail" ]; then
              echo "FAIL: coverage ${TOTAL}% is below threshold ${THRESHOLD}%"
              exit 1
            fi
            echo "PASS: coverage ${TOTAL}% meets threshold ${THRESHOLD}%"
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
